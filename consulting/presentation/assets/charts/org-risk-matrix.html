<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组织转型专项风险矩阵</title>
<style>
  :root{
    --c1:#1B3A6B; --c2:#2E5C9E; --c3:#0070C0; --c4:#2374a3; --c5:#5B9BD5; --c6:#A5C8E4;
    --bg:#F5F8FC; --white:#FFFFFF; --text:#0D1B2A; --text2:#2C3E50;
  }
  body{font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px}
  h2{font-size:18px;font-weight:700;color:var(--c1);margin:0 0 4px}
  .subtitle{font-size:12px;color:var(--c5);margin-bottom:16px}
  .wrap{max-width:960px;margin:0 auto;background:var(--white);border-radius:10px;padding:20px 24px;box-shadow:0 2px 10px rgba(27,58,107,.08)}
  .layout{display:flex;gap:16px;flex-wrap:wrap}
  .matrix-wrap{flex:0 0 280px}
  .matrix-title{font-size:13px;font-weight:700;color:var(--c1);margin-bottom:8px}
  .matrix{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:3px}
  .mx-hdr{font-size:9px;color:#6B8CB8;text-align:center;padding:4px 2px;font-weight:600}
  .mx-lbl{font-size:9px;color:#6B8CB8;display:flex;align-items:center;justify-content:center;font-weight:600}
  .mx-cell{height:56px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;transition:transform .15s}
  .mx-cell:hover{transform:scale(1.04)}
  .c-low{background:#D1FAE5;color:#065F46}
  .c-med{background:#FEF3C7;color:#B7950B}
  .c-hi{background:#FED7AA;color:#9A3412}
  .c-crit{background:#FECACA;color:#B91C1C}
  .legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#6B8CB8}
  .legend-dot{width:10px;height:10px;border-radius:2px}
  .register{flex:1;min-width:280px}
  .reg-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .reg-title{font-size:12.5px;font-weight:700;color:var(--c1)}
  .reg-count{font-size:11px;color:#6B8CB8}
  .rsk-item{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:#F8FBFF;border:1px solid #D0E4F7;margin-bottom:8px}
  .rsk-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;margin-top:1px}
  .rsk-body{flex:1}
  .rsk-title{font-size:12px;font-weight:700;color:var(--c1);margin-bottom:3px}
  .rsk-desc{font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:4px}
  .rsk-mit{font-size:11px;color:#2E5C9E;line-height:1.6;margin-bottom:6px;padding:6px 8px;background:#EBF4FF;border-radius:4px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
  .p-low{background:#EBF4FF;color:#005EB8;border:1px solid #D0E4F7}
  .p-med{background:#FEF3C7;color:#B7950B;border:1px solid #FDE68A}
  .p-hi{background:#FECACA;color:#B91C1C;border:1px solid #FCA5A5}
  .s-new{background:#1B3A6B;color:#fff}
  .s-wip{background:#0070C0;color:#fff}
  .s-acc{background:#5B9BD5;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h2>组织转型专项风险矩阵</h2>
<div class="subtitle">共 5 项组织转型专项风险 · 可能性 × 影响度矩阵</div>

<div class="layout">
  <div class="matrix-wrap">
    <div class="matrix-title">风险矩阵 <span style="font-size:10px;color:#6B8CB8;font-weight:400">(点击格子筛选)</span></div>
    <div class="matrix">
      <div></div>
      <div class="mx-hdr">低<br>可能性</div>
      <div class="mx-hdr">中<br>可能性</div>
      <div class="mx-hdr">高<br>可能性</div>
      <div class="mx-lbl">高<br>影响</div>
      <div class="mx-cell c-med" onclick="filterRisk('低','高')" id="cell-低-高"></div>
      <div class="mx-cell c-hi"  onclick="filterRisk('中','高')" id="cell-中-高"></div>
      <div class="mx-cell c-crit" onclick="filterRisk('高','高')" id="cell-高-高"></div>
      <div class="mx-lbl">中<br>影响</div>
      <div class="mx-cell c-low" onclick="filterRisk('低','中')" id="cell-低-中"></div>
      <div class="mx-cell c-med" onclick="filterRisk('中','中')" id="cell-中-中"></div>
      <div class="mx-cell c-hi"  onclick="filterRisk('高','中')" id="cell-高-中"></div>
      <div class="mx-lbl">低<br>影响</div>
      <div class="mx-cell c-low" onclick="filterRisk('低','低')" id="cell-低-低"></div>
      <div class="mx-cell c-low" onclick="filterRisk('中','低')" id="cell-中-低"></div>
      <div class="mx-cell c-med" onclick="filterRisk('高','低')" id="cell-高-低"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#D1FAE5"></div>低风险</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FEF3C7"></div>中风险</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FED7AA"></div>高风险</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FECACA"></div>严重</div>
    </div>
  </div>

  <div class="register">
    <div class="reg-hdr">
      <div class="reg-title">风险登记册</div>
      <div class="reg-count">共 <strong id="rsk-count">5</strong> 项 · <span onclick="filterRisk(null,null)" style="color:#0070C0;cursor:pointer;text-decoration:underline">显示全部</span></div>
    </div>
    <div id="risk-list"></div>
  </div>
</div>
</div>

<script>
(function(){
const risks=[
  {id:'R-O01',dot:'#C0392B',title:'总部精简目标与数字化扩编的矛盾',desc:'精益改善项目目标总部人员精简20-30%，而本报告建议数智化部新增约8-10人，方向相反。若强制执行精简，关键用户（Super User）可能在上线前离职。',mit:'明确数字化战略性岗位豁免精简；数智化部通过自动化（RPA/AI）承接工作实现"IT微增、业务大减"净效果；联合人力资源部制定《数字化转型期人力豁免方案》，提交李泽华批准。',prob:'中',impact:'高',status:'缓解中'},
  {id:'R-O02',dot:'#E67E22',title:'BPO/联络员无时间参与SAP项目',desc:'业务部门BPO和联络员有自己的业务工作量，要求每周投入5-10小时参与SAP项目，存在较大阻力，历史经验表明业务参与不足是项目失败的主要根因。',mit:'在精益改善项目清单中明确SAP参与为各部门年度重点工作；BPO在项目期间可申请减少20%日常工作量；数字化保障委员会每月监控参与度，未达标时李泽华直接介入。',prob:'高',impact:'高',status:'未处理'},
  {id:'R-O03',dot:'#E67E22',title:'MDM主任等关键岗位招聘难度',desc:'广东制造业中具备SAP MDG+数据治理+跨部门协调能力的复合型人才稀缺，可能面临招聘延迟，而MDM主任是数据清洗工作的关键前提。',mit:'7月上旬立即发布职位，不等组织架构批准；优先从艾维登体系挖掘候选人；7月底无合适人选则临时由艾维登MDG顾问提供外包服务（2个月为限）。',prob:'中',impact:'高',status:'缓解中'},
  {id:'R-O04',dot:'#4A6FA5',title:'企管部流程人员能力不匹配',desc:'新增2名流程分析师若无SAP蓝图经验，仍难以承担TO-BE流程确认工作，导致蓝图阶段顾问等待延误。',mit:'招聘要求必须包含"参与过SAP蓝图设计"经验；艾维登顾问在蓝图阶段提供"师傅带徒弟"专项指导；蓝图初期安排3天集中培训（TOGAF流程框架+SAP流程设计方法）。',prob:'中',impact:'中',status:'缓解中'},
  {id:'R-O05',dot:'#4A6FA5',title:'变革管理资源不足',desc:'若无法招到合适的变革管理专员，此工作将由吴梓填（甲方PM）兼任，导致项目管理和变革管理双线受压，影响用户培训和上线质量。',mit:'在2026年7月确认艾维登合同是否包含变革管理服务；若艾维登提供支持，甲方变革专员可降级为协调员；最差情况由HR部门培训岗兼任（轻量化运作）。',prob:'中',impact:'中',status:'缓解中'}
];

function pClass(p){return p==='高'?'p-hi':p==='中'?'p-med':'p-low';}
function sClass(s){return s==='未处理'?'s-new':s==='缓解中'?'s-wip':'s-acc';}

function render(list){
  document.getElementById('rsk-count').textContent=list.length;
  document.getElementById('risk-list').innerHTML=list.map(r=>`
    <div class="rsk-item">
      <div class="rsk-dot" style="background:${r.dot}">${r.id.replace('R-O','R')}</div>
      <div class="rsk-body">
        <div class="rsk-title">${r.title}</div>
        <div class="rsk-desc">${r.desc}</div>
        <div class="rsk-mit">${r.mit}</div>
        <div class="pills">
          <span class="pill ${pClass(r.prob)}">可能性 ${r.prob}</span>
          <span class="pill ${pClass(r.impact)}">影响 ${r.impact}</span>
          <span class="pill ${sClass(r.status)}">${r.status}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function fillMatrix(){
  const cells={};
  risks.forEach(r=>{
    const key=r.prob+'-'+r.impact;
    cells[key]=(cells[key]||0)+1;
  });
  Object.entries(cells).forEach(([k,v])=>{
    const el=document.getElementById('cell-'+k);
    if(el) el.textContent=v;
  });
}

window.filterRisk=function(prob,impact){
  if(!prob && !impact){render(risks);return;}
  render(risks.filter(r=>r.prob===prob && r.impact===impact));
};

render(risks);
fillMatrix();
})();
</script>
</body>
</html>
