<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三年累计价值贡献</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  .chart-container { width: 100%; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
  h2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 18px; color: #1B3A6B; margin-bottom: 12px; text-align: center; }
  .canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="chart-container">
  <h2>三年累计价值贡献</h2>
  <div class="canvas-wrap"><canvas id="valueChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
var C = {
  navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
  steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
};

new Chart(document.getElementById('valueChart'), {
  type:'bar',
  data:{
    labels:['2026年 Phase1','2027年 Phase2','2028年 Phase3'],
    datasets:[
      { label:'当年价值贡献（亿元）', data:[1.6,2.9,2.3],
        backgroundColor:[C.navy,C.primary,C.steel], borderRadius:6 },
      { label:'累计价值（亿元）', type:'line', data:[1.6,4.5,6.8],
        borderColor:C.light, borderWidth:2, pointBackgroundColor:C.light,
        fill:false, tension:0.3, datalabels:{display:false} }
    ]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top:28}},
    plugins:{
      legend:{position:'top',labels:{font:{size:11},padding:10}},
      datalabels:{
        anchor:'end',align:'top',font:{size:10,weight:'600'},color:C.dark,
        formatter:function(v,ctx){ return ctx.datasetIndex===0 ? v+'亿' : ''; }
      }
    },
    scales:{y:{beginAtZero:true,title:{display:true,text:'亿元（人民币）'}}}
  }
});
</script>
</body>
</html>
