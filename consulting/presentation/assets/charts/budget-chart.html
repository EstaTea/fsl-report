<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预算分配</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  .chart-container { width: 100%; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
  h2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 18px; color: #1B3A6B; margin-bottom: 12px; text-align: center; }
  .charts-row { flex: 1; display: flex; gap: 20px; min-height: 0; }
  .chart-box { flex: 1; display: flex; flex-direction: column; }
  .chart-box h3 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 14px; color: #1B3A6B; margin-bottom: 8px; text-align: center; }
  .canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="chart-container">
  <h2>预算分配</h2>
  <div class="charts-row">
    <div class="chart-box">
      <h3>三年预算投入</h3>
      <div class="canvas-wrap"><canvas id="budgetChart"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>预算构成</h3>
      <div class="canvas-wrap"><canvas id="budget1Chart"></canvas></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
var C = {
  navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
  steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
};

new Chart(document.getElementById('budgetChart'), {
  type:'bar',
  data:{
    labels:['2026年（Phase1）','2027年（Phase2）','2028年（Phase3）'],
    datasets:[{label:'预算投入（万元）',data:[950,300,600],backgroundColor:[C.navy,C.primary,C.steel],borderRadius:6}]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top:24}},
    plugins:{
      legend:{display:false},
      datalabels:{anchor:'end',align:'top',font:{size:10,weight:'600'},color:C.dark,formatter:function(v){return v+'万';}}
    },
    scales:{y:{beginAtZero:true,title:{display:true,text:'万元（人民币）'}}}
  }
});

new Chart(document.getElementById('budget1Chart'), {
  type:'doughnut',
  data:{
    labels:['业务诊断咨询（约200万）','SAP实施服务（约750万）'],
    datasets:[{data:[200,750],backgroundColor:[C.steel,C.navy],borderColor:'#fff',borderWidth:2}]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{position:'bottom',labels:{font:{size:10},padding:8}},
      datalabels:{color:'#fff',font:{size:10,weight:'600'},formatter:function(v){return v+'万';}}
    }
  }
});
</script>
</body>
</html>
