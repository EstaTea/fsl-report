  {main:'TOGAF 4A 架构', sub:'BA / DA / AA / TA'},
  {main:'高价值场景 / 治理桶', sub:'23 个场景 + 3 个治理桶'},
  {main:'项目卡片', sub:'11 个 · 2026-2028 分期'}
];
const colX = i => i * (width / 4);
const colLabelG = svg.selectAll('.col-label-g').data(colLabels).enter().append('g').attr('class','col-label-g')
  .attr('transform', (d,i) => `translate(${colX(i)},-68)`);
colLabelG.append('text').attr('class','col-label').attr('text-anchor','middle').attr('y',0).text(d=>d.main);
colLabelG.append('text').attr('class','col-label-sub').attr('text-anchor','middle').attr('y',44).text(d=>d.sub);

const orderMap = {};
const painOrder = ['P05','P06','P07','P08','P13','P01','P02','P17','P03','P04','P09','P10','P11','P12','P14','P15','P16','P18','P19','P20','P21','P22','P23'];
painOrder.forEach((id,i)=>orderMap['pain:'+id]=i);
const domainOrder = ['销售与渠道','采购与供应','计划与制造','仓储物流','主数据与IT','财务与资金','研发与BOM','质量','数据分析','管理协同'];
domainOrder.forEach((id,i)=>orderMap['domain:'+id]=i);
const sceneOrder = ['S04','S05','S02','S03','S06','S13','S14','S15','S16','S17','S18','S19','S20','S01','S08','S07','S09','S10','S11','S12','S21','S22','S23','管理需求-移出','数字化规划-非专题','平台技术底座'];
sceneOrder.forEach((id,i)=>orderMap['scene:'+id]=i);
const wpOrder = ['PC06','PC07','PC09','PC02','PC05','PC08','PC03','PC10','PC01','PC04','PC11'];
wpOrder.forEach((id,i)=>orderMap['wp:'+id]=i);
const archOrder = ['BA','DA','AA','TA'];
archOrder.forEach((id,i)=>orderMap['arch:'+id]=i);

const sankey = d3.sankey()
  .nodeWidth(42)
  .nodePadding(120)
  .extent([[0, 10], [width, height-10]])
  .nodeAlign(node => node.col || 0)
  .nodeSort((a,b)=>{
    const oa = orderMap[a.type+':'+a.id]; const ob = orderMap[b.type+':'+b.id];
    if (oa!==undefined && ob!==undefined) return oa - ob;
    return b.value - a.value;
  });

const graph = sankey({
  nodes: data.nodes.map(d=>Object.assign({}, d)),
  links: data.links.map(d=>Object.assign({}, d))
});

// ---- 颜色：全部来自 link.domain，从第一列贯穿到第五列 ----
// 节点主导色 = 入流量最大的业务域颜色
const nodeColor = new Map();
graph.nodes.forEach(n => {
  if (n.type === 'domain') { nodeColor.set(n, DOMAIN_COLORS[n.id] || '#90A4AE'); return; }
  const tally = {};
  graph.links.forEach(l => { if (l.target === n && l.domain) tally[l.domain] = (tally[l.domain] || 0) + l.value; });
  let best = null, bv = -1;
  for (const g in tally) if (tally[g] > bv) { bv = tally[g]; best = g; }
  nodeColor.set(n, best ? DOMAIN_COLORS[best] : '#90A4AE');
});

// 连线颜色 = 自身携带的原始需求域颜色（五层贯穿）
const linkColor = l => DOMAIN_COLORS[l.domain] || '#999';

// 4A 架构节点：按入流域构成生成纵向多色渐变（精确比例）
function archGradientId(node) { return 'grad-' + node.id; }
const defs = svg.append('defs');
graph.nodes.filter(n => n.type === 'arch').forEach(n => {
  const tally = {};
  let total = 0;
  graph.links.filter(l => l.target === n).forEach(l => {
    tally[l.domain] = (tally[l.domain] || 0) + l.value;
    total += l.value;
  });
  const grad = defs.append('linearGradient')
    .attr('id', archGradientId(n))
    .attr('x1', '0%').attr('y1', '0%')
    .attr('x2', '0%').attr('y2', '100%');
  let acc = 0;
  Object.entries(tally).sort((a,b)=>b[1]-a[1]).forEach(([g, v]) => {
    const start = acc / total, end = (acc + v) / total;
    grad.append('stop').attr('offset', (start*100).toFixed(1)+'%').attr('stop-color', DOMAIN_COLORS[g] || '#999');
    grad.append('stop').attr('offset', (end*100).toFixed(1)+'%').attr('stop-color', DOMAIN_COLORS[g] || '#999');
    acc += v;
  });
});

svg.append('g').selectAll('path').data(graph.links).enter().append('path')
  .attr('class','link')
  .attr('d', d3.sankeyLinkHorizontal())
  .attr('stroke', linkColor)
  .attr('stroke-width', d => Math.max(0.5, d.width));

const node = svg.append('g').selectAll('g').data(graph.nodes).enter().append('g')
  .attr('class','node').attr('transform', d => `translate(${d.x0},${d.y0})`);

node.append('rect')
  .attr('x', 0).attr('y', 0)
  .attr('width', d => d.x1 - d.x0)
  .attr('height', d => Math.max(1, d.y1 - d.y0))
  .attr('fill', d => d.type === 'arch' ? `url(#${archGradientId(d)})` : (nodeColor.get(d) || '#999'));

function splitName(name, maxLen) {
  if (name.length <= maxLen) return [name];
  const mid = Math.floor(name.length / 2);
  const breakChars = [' ','，','、','；','：'];
  let best = -1, bestDiff = Infinity;
  for (let i = 0; i < name.length; i++) {
    if (breakChars.includes(name[i]) && i >= name.length * 0.3 && i <= name.length * 0.7) {
      const diff = Math.abs(i - mid);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
  }
  if (best < 0) best = mid;
  return [name.slice(0, best), name.slice(best + 1)];
}

function nodeLabelLines(d) {
  const label = d.fullName;
  const codeMap = {
    pain: /^(P\d+)\s+(.+)$/,
    scene: /^(S\d+)\s+(.+)$/,
    wp: /^(PC\d+)\s+(.+)$/,
    arch: /^(BA|DA|AA|TA)\s+(.+)$/
  };
  const re = codeMap[d.type];
  if (!re) return splitName(label, 13);
  const m = label.match(re);
  if (!m) return splitName(label, 13);
  const code = m[1], name = m[2];
  const maxNameLen = d.type === 'wp' ? 11 : 12;
  const parts = splitName(name, maxNameLen);
  parts[0] = code + ' ' + parts[0];
  return parts;
}

const lineHeight = 48;
const subLineHeight = 42;
const countLineHeight = 34;
const matLineHeight = 30;
const blockW = 560;

const labelPos = new Map();
const colLast = {};
graph.nodes.slice().sort((a, b) => a.y0 - b.y0).forEach(d => {
  const mat = d.type === 'wp' ? (d.maturity || '') : '';
  let lines = nodeLabelLines(d);
  lines = lines.slice(0, 2);
  d._mat = mat;
  d._labelLines = lines;
  const blockH = lines.length * lineHeight + countLineHeight + (d._mat ? matLineHeight + 6 : 0) + 16;
  let y = (d.y0 + d.y1) / 2 - blockH / 2;
  const last = colLast[d.col] !== undefined ? colLast[d.col] : -1e9;
  if (y < last + 10) y = last + 10;
  labelPos.set(d, { lines, blockH, y });
  colLast[d.col] = y + blockH;
});

node.each(function(d) {
  const g = d3.select(this);
  const w = d.x1 - d.x0;
  const isLeft = d.col <= 1;
  const xOffset = isLeft ? -18 : w + 18;
  const anchor = isLeft ? 'end' : 'start';

  const meta = labelPos.get(d);
  const lines = meta.lines;
  const blockH = meta.blockH;
  const bgX = isLeft ? xOffset - blockW - 8 : xOffset - 8;
  const bgY = meta.y - d.y0;

  g.append('rect').attr('class','label-bg')
    .attr('x', bgX).attr('y', bgY)
    .attr('width', blockW).attr('height', blockH);

  lines.forEach((line, i) => {
    g.append('text').attr('class', i===0 ? '' : 'sub')
      .attr('x', isLeft ? xOffset - 12 : xOffset + 12)
      .attr('y', bgY + 38 + i * (i===0 ? lineHeight : subLineHeight))
      .attr('text-anchor', anchor).attr('dy', '0.35em').text(line);
  });

  const countY = bgY + 38 + lines.length * lineHeight + 4;
  g.append('text').attr('class','count')
    .attr('x', isLeft ? xOffset - 12 : xOffset + 12)
    .attr('y', countY)
    .attr('text-anchor', anchor).attr('dy', '0.35em')
    .text(d.value ? d.value.toFixed(0) + ' 条' : '');

  if (d._mat) {
    g.append('text').attr('class','mat')
      .attr('x', isLeft ? xOffset - 12 : xOffset + 12)
      .attr('y', countY + matLineHeight + 6)
      .attr('text-anchor', anchor).attr('dy', '0.35em')
      .text('成熟度：' + d._mat);
  }
});
</script>
</body>
