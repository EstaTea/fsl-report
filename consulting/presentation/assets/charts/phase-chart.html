<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三阶段转型路径总览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  .chart-container { width: 100%; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
  h2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 18px; color: #1B3A6B; margin-bottom: 12px; text-align: center; }
  .canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="chart-container">
  <h2>三阶段转型路径总览</h2>
  <div class="canvas-wrap"><canvas id="phaseChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
var C = {
  navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
  steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
};

new Chart(document.getElementById('phaseChart'), {
  type: 'bar',
  data: {
    labels: [['Phase 1','夯实底座'],['Phase 2','贯通协同'],['Phase 3','智慧跃升']],
    datasets: [
      { label: '已有成熟度基础', data:[1.9,2.5,3.2],
        backgroundColor:['rgba(168,196,224,0.35)','rgba(168,196,224,0.25)','rgba(168,196,224,0.15)'],
        borderRadius:6, stack:'s' },
      { label: '成熟度提升', data:[0.6,0.7,0.6],
        backgroundColor:[C.navy,C.primary,C.steel], borderRadius:6, stack:'s' }
    ]
  },
  options: {
    indexAxis:'y', responsive:true, maintainAspectRatio:false,
    layout:{padding:{right:60,top:10}},
    plugins: {
      legend:{position:'top',labels:{font:{size:11},padding:10}},
      datalabels:{
        anchor:'end', align:'right', font:{size:10,weight:'600'}, color:C.dark,
        formatter:function(v,ctx){ return ctx.datasetIndex===0 ? '+'+v.toFixed(1) : ''; }
      }
    },
    scales: {
      x:{stacked:true,min:0,max:5.5,title:{display:true,text:'成熟度分值（1-5）'}},
      y:{stacked:true,ticks:{font:{size:11}}}
    }
  }
});
</script>
</body>
</html>
