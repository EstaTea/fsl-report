<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23个高价值场景四象限评估</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#fff}
  body{display:flex;flex-direction:column;align-items:center;padding:12px 16px}
  h1{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
     font-size:16px;font-weight:700;color:#1B3A6B;margin-bottom:6px;text-align:center}
  .chart-box{position:relative;width:100%;height:calc(100% - 50px);min-height:260px}
  .legend{display:flex;gap:20px;margin-top:6px;font-size:11px;color:#5B7A91}
  .legend span{display:flex;align-items:center;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<h1>23个高价值场景：业务价值 × 技术难度 四象限评估</h1>
<div class="chart-box">
  <canvas id="quadrantChart"></canvas>
</div>
<div class="legend">
  <span><i class="dot" style="background:#003087"></i>一期 · 2026（14个）</span>
  <span><i class="dot" style="background:#2374a3"></i>二期 · 2027（6个）</span>
  <span><i class="dot" style="background:#89c4e8"></i>三期 · 2028（3个）</span>
</div>
<script>
(function(){
  var scenarios = [
    // 一期 - 2026 (14个)
    {id:'S01',name:'物料主数据治理',bv:5.0,td:4.5,p:'一期',c:'#003087'},
    {id:'S02',name:'客户信用管理',bv:4.5,td:4.5,p:'一期',c:'#003087'},
    {id:'S05',name:'销售订单全链路追踪',bv:3.4,td:4.2,p:'一期',c:'#003087'},
    {id:'S06',name:'海外财务合规',bv:3.0,td:3.2,p:'一期',c:'#003087'},
    {id:'S07',name:'制造成本还原',bv:4.8,td:4.5,p:'一期',c:'#003087'},
    {id:'S08',name:'财务组织+科目主数据',bv:2.2,td:2.1,p:'一期',c:'#003087'},
    {id:'S09',name:'应收清账+BIP接口',bv:2.8,td:2.3,p:'一期',c:'#003087'},
    {id:'S11',name:'按客户销售项目核算和分析方案',bv:4.3,td:3.3,p:'一期',c:'#003087'},
    {id:'S12',name:'研发投入产出分析体系建设',bv:4.5,td:3.5,p:'一期',c:'#003087'},
    {id:'S13',name:'供应商交期与供应商绩效管理方案',bv:4.2,td:3.8,p:'一期',c:'#003087'},
    {id:'S14',name:'采购价格透明化与比价分析体系',bv:4.1,td:3.8,p:'一期',c:'#003087'},
    {id:'S15',name:'采购配额管理与订单分配智能化',bv:4.5,td:3.5,p:'一期',c:'#003087'},
    {id:'S16',name:'产前齐套性预警与跟踪',bv:4.3,td:3.6,p:'一期',c:'#003087'},
    {id:'S17',name:'库存多维度查询体系',bv:3.6,td:4.5,p:'一期',c:'#003087'},
    // 二期 - 2027 (6个)
    {id:'S03',name:'跨公司转卖模式优化',bv:3.8,td:3.6,p:'二期',c:'#2374a3'},
    {id:'S04',name:'销售价格与折扣管理体系优化',bv:3.2,td:4.2,p:'二期',c:'#2374a3'},
    {id:'S10',name:'集团合并报表建设',bv:3.2,td:4.5,p:'二期',c:'#2374a3'},
    {id:'S18',name:'主生产计划MPS建设',bv:4.2,td:2.8,p:'二期',c:'#2374a3'},
    {id:'S19',name:'MRP物料需求计划',bv:4.6,td:3.2,p:'二期',c:'#2374a3'},
    {id:'S23',name:'BOM全生命周期建设',bv:3.3,td:3.8,p:'二期',c:'#2374a3'},
    // 三期 - 2028 (3个)
    {id:'S20',name:'生产进度看板',bv:3.9,td:3.6,p:'三期',c:'#89c4e8'},
    {id:'S21',name:'质量追溯建设',bv:3.0,td:2.6,p:'三期',c:'#89c4e8'},
    {id:'S22',name:'质量合格率统计分析',bv:3.0,td:2.3,p:'三期',c:'#89c4e8'}
  ];

  var labelPlugin = {
    id: 'scenarioLabels',
    afterDraw: function(chart) {
      var ctx = chart.ctx;
      var padX = 4, padY = 3;
      var fontSize = 8;
      var font = '600 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.font = font;

      var area = chart.chartArea;
      var pts = [];
      scenarios.forEach(function(s, i) {
        var meta = chart.getDatasetMeta(i);
        if (meta.hidden) return;
        var point = meta.data[0];
        if (!point) return;
        pts.push({ i: i, s: s, x: point.x, y: point.y, r: point.r || 10 });
      });
      if (!pts.length) return;

      // 8 个候选方向：上、下、右、左、左上、右上、左下、右下
      // 优先级：上下（文字横放，最省空间）> 左右 > 斜角
      var DIRS = [
        {key:'T',  dx:0,  dy:-1, ax:'center', bl:'bottom'}, // 上
        {key:'B',  dx:0,  dy: 1, ax:'center', bl:'top'   }, // 下
        {key:'R',  dx: 1, dy:0,  ax:'left',   bl:'middle'}, // 右
        {key:'L',  dx:-1, dy:0,  ax:'right',  bl:'middle'}, // 左
        {key:'TL', dx:-1, dy:-1, ax:'right',  bl:'bottom'}, // 左上
        {key:'TR', dx: 1, dy:-1, ax:'left',   bl:'bottom'}, // 右上
        {key:'BL', dx:-1, dy: 1, ax:'right',  bl:'top'   }, // 左下
        {key:'BR', dx: 1, dy: 1, ax:'left',   bl:'top'   }  // 右下
      ];

      function makeBox(p, dir, extraDist) {
        var dist = p.r + 6 + (extraDist || 0); // 紧贴气泡，仅 6px 间隙
        var text = p.s.id + ' ' + p.s.name;
        var w = ctx.measureText(text).width + padX * 2;
        var h = fontSize + padY * 2;
        var bx = p.x + dir.dx * dist;
        var by = p.y + dir.dy * dist;
        // 根据 textAlign/textBaseline 换算盒子左上角
        var boxX = bx, boxY = by;
        if (dir.ax === 'center') boxX -= w / 2;
        else if (dir.ax === 'right') boxX -= w;
        if (dir.bl === 'middle') boxY -= h / 2;
        else if (dir.bl === 'bottom') boxY -= h;
        return { boxX: boxX, boxY: boxY, w: w, h: h, text: text, ax: dir.ax, bl: dir.bl, cx: bx, cy: by };
      }

      function inArea(box) {
        return box.boxX >= area.left - 2 &&
               box.boxY >= area.top - 2 &&
               box.boxX + box.w <= area.right + 2 &&
               box.boxY + box.h <= area.bottom + 2;
      }
      function boxOverlap(a, b) {
        return a.boxX < b.boxX + b.w && a.boxX + a.w > b.boxX &&
               a.boxY < b.boxY + b.h && a.boxY + a.h > b.boxY;
      }
      function bubbleOverlap(box, p) {
        var nx = Math.max(box.boxX, Math.min(p.x, box.boxX + box.w));
        var ny = Math.max(box.boxY, Math.min(p.y, box.boxY + box.h));
        var ddx = p.x - nx, ddy = p.y - ny;
        return (ddx*ddx + ddy*ddy) < (p.r * p.r);
      }

      // 逐个放置标签：优先选离气泡最近的可用方向
      var placed = [];
      pts.forEach(function(p){
        var best = null, bestScore = -1;
        DIRS.forEach(function(dir){
          for (var d = 0; d <= 30; d += 2) { // 最多额外外推 30px
            var box = makeBox(p, dir, d);
            if (!inArea(box)) continue;
            var bad = false;
            for (var k = 0; k < placed.length; k++) {
              if (boxOverlap(box, placed[k])) { bad = true; break; }
            }
            for (var k = 0; k < pts.length; k++) {
              if (pts[k].i !== p.i && bubbleOverlap(box, pts[k])) { bad = true; break; }
            }
            if (!bad) {
              // 评分：优先方向靠前、距离气泡近
              var score = (8 - DIRS.indexOf(dir)) * 1000 + (30 - d);
              if (score > bestScore) { bestScore = score; best = box; }
              break; // 该方向找到最近可用位置，停止外推
            }
          }
        });
        if (!best) {
          // 如果实在没有不碰撞的位置，选方向优先级最高的，距离最近的位置
          best = makeBox(p, DIRS[0], 0);
        }
        // 保存到点对象，供绘制使用
        p.boxX = best.boxX; p.boxY = best.boxY;
        p.w = best.w; p.h = best.h;
        p.text = best.text; p.cx = best.cx; p.cy = best.cy;
        placed.push(best);
      });

      // 绘制标签盒
      ctx.save();
      ctx.font = font;
      ctx.lineWidth = 1;
      pts.forEach(function(p){
        // 白色底框 + 阶段色细边框
        ctx.fillStyle = 'rgba(255,255,255,0.96)';
        ctx.strokeStyle = p.s.c;
        ctx.beginPath();
        ctx.roundRect(p.boxX, p.boxY, p.w, p.h, 3);
        ctx.fill();
        ctx.stroke();

        // 文字居中于盒子
        ctx.fillStyle = '#1B3A6B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.boxX + p.w/2, p.boxY + p.h/2);
      });
      ctx.restore();
    }
  };

  new Chart(document.getElementById('quadrantChart'), {
    type: 'scatter',
    data: {
      datasets: scenarios.map(function(s){
        var r = s.p === '一期' ? 18 : s.p === '二期' ? 12 : 7;
        return {
          label: s.id + ' ' + s.name,
          data: [{x: Math.min(s.bv, 5.0), y: s.td}],
          backgroundColor: s.c,
          pointRadius: r,
          pointHoverRadius: r + 3,
          pointBorderColor: '#fff',
          pointBorderWidth: 1,
          clip: false
        };
      })
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 40, right: 150, bottom: 36, left: 40 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var s = scenarios[ctx.datasetIndex];
              return s.id + ' ' + s.name + ' (BV:' + s.bv + ' TD:' + s.td + ')';
            }
          }
        }
      },
      scales: {
        x: {
          min: 2.0, max: 5.0,
          title: { display: true, text: '业务价值（Business Value）', font: { size: 12 } },
          ticks: { stepSize: 0.5, font: { size: 11 } }
        },
        y: {
          min: 1.5, max: 5.0,
          title: { display: true, text: '技术难度（Technical Difficulty）', font: { size: 12 } },
          ticks: { stepSize: 0.5, font: { size: 11 } }
        }
      }
    },
    plugins: [labelPlugin]
  });
})();
</script>
</body>
</html>
