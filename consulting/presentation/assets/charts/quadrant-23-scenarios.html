<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23个高价值场景四象限评估</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#fff}
  body{display:flex;flex-direction:column;align-items:center;padding:12px 16px}
  h1{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
     font-size:16px;font-weight:700;color:#1B3A6B;margin-bottom:6px;text-align:center}
  .chart-box{position:relative;width:100%;height:calc(100% - 50px);min-height:260px}
  .legend{display:flex;gap:20px;margin-top:6px;font-size:11px;color:#5B7A91}
  .legend span{display:flex;align-items:center;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<h1>23个高价值场景：业务价值 × 技术难度 四象限评估</h1>
<div class="chart-box">
  <canvas id="quadrantChart"></canvas>
</div>
<div class="legend">
  <span><i class="dot" style="background:#003087"></i>P0 优先级高 · 2026（10个）</span>
  <span><i class="dot" style="background:#2374a3"></i>P1 优先级中 · 2027（9个）</span>
  <span><i class="dot" style="background:#89c4e8"></i>P2 优先级低 · 2028（4个）</span>
</div>
<script>
(function(){
  var scenarios = [
    // P0 - 2026 (10个)
    {id:'S01',name:'物料主数据治理',bv:5.0,td:3.0,p:'P0',c:'#003087'},
    {id:'S04',name:'销售价格管理',bv:4.5,td:3.15,p:'P0',c:'#003087'},
    {id:'S08',name:'海外财务合规',bv:5.0,td:3.5,p:'P0',c:'#003087'},
    {id:'S10',name:'财务主数据治理',bv:4.5,td:2.85,p:'P0',c:'#003087'},
    {id:'S11',name:'应收清账',bv:4.0,td:2.5,p:'P0',c:'#003087'},
    {id:'S12',name:'集团法定合并',bv:4.65,td:3.5,p:'P0',c:'#003087'},
    {id:'S15',name:'采购配额',bv:4.0,td:2.65,p:'P0',c:'#003087'},
    {id:'S18',name:'主生产计划',bv:4.35,td:3.5,p:'P0',c:'#003087'},
    {id:'S19',name:'MRP',bv:5.0,td:3.65,p:'P0',c:'#003087'},
    {id:'S25',name:'研发产出分析',bv:4.15,td:2.5,p:'P0',c:'#003087'},
    // P1 - 2027 (9个)
    {id:'S02',name:'客户信用管理',bv:4.5,td:4.0,p:'P1',c:'#2374a3'},
    {id:'S03',name:'跨公司转卖',bv:4.0,td:4.0,p:'P1',c:'#2374a3'},
    {id:'S05',name:'订单全链路跟踪',bv:4.5,td:3.85,p:'P1',c:'#2374a3'},
    {id:'S09',name:'制造成本还原',bv:4.0,td:3.85,p:'P1',c:'#2374a3'},
    {id:'S13',name:'供应商绩效管理',bv:4.0,td:3.5,p:'P1',c:'#2374a3'},
    {id:'S14',name:'采购价格透明化',bv:4.0,td:3.65,p:'P1',c:'#2374a3'},
    {id:'S16',name:'产前齐套预警',bv:3.5,td:4.0,p:'P1',c:'#2374a3'},
    {id:'S23',name:'BOM全生命周期',bv:4.0,td:4.15,p:'P1',c:'#2374a3'},
    {id:'S24',name:'客户项目核算',bv:3.5,td:3.85,p:'P1',c:'#2374a3'},
    // P2 - 2028 (4个)
    {id:'S17',name:'库存可视化',bv:3.0,td:2.0,p:'P2',c:'#89c4e8'},
    {id:'S20',name:'生产进度看板',bv:3.0,td:2.15,p:'P2',c:'#89c4e8'},
    {id:'S21',name:'质量追溯',bv:3.5,td:2.5,p:'P2',c:'#89c4e8'},
    {id:'S22',name:'质量合格率统计',bv:3.0,td:1.85,p:'P2',c:'#89c4e8'}
  ];

  var labelPlugin = {
    id: 'scenarioLabels',
    afterDraw: function(chart) {
      var ctx = chart.ctx;
      var padX = 4, padY = 3;
      var fontSize = 8;
      var font = '600 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.font = font;

      var area = chart.chartArea;
      var pts = [];
      scenarios.forEach(function(s, i) {
        var meta = chart.getDatasetMeta(i);
        if (meta.hidden) return;
        var point = meta.data[0];
        if (!point) return;
        pts.push({ i: i, s: s, x: point.x, y: point.y, r: point.r || 10 });
      });
      if (!pts.length) return;

      // 集群质心，用于把标签向外推
      var cx = 0, cy = 0;
      pts.forEach(function(p){ cx += p.x; cy += p.y; });
      cx /= pts.length; cy /= pts.length;

      // 每个点的方向：远离质心（8 个离散方向）
      function dirVec(p) {
        var dx = p.x - cx, dy = p.y - cy;
        if (dx === 0 && dy === 0) { dx = 0; dy = -1; }
        var ang = Math.atan2(dy, dx);
        var steps = [
          {a: -Math.PI/2,           ax:'center', bl:'bottom', sx:-1, sy:-1}, // 上
          {a: -Math.PI*0.75,        ax:'left',   bl:'bottom', sx: 0, sy:-1}, // 左上
          {a: Math.PI,              ax:'right',  bl:'middle', sx:-1, sy: 0}, // 左
          {a: -Math.PI*0.25,        ax:'left',   bl:'top',    sx: 0, sy: 0}, // 左下
          {a:  Math.PI/2,           ax:'center', bl:'top',    sx:-1, sy: 1}, // 下
          {a:  Math.PI*0.25,        ax:'right',  bl:'top',    sx:-1, sy: 0}, // 右下
          {a:  0,                   ax:'left',   bl:'middle', sx: 1, sy: 0}, // 右
          {a:  Math.PI*0.75,        ax:'right',  bl:'bottom', sx:-1, sy: 0}  // 右上
        ];
        var best = steps[0], bd = 1e9;
        steps.forEach(function(st){
          var d = Math.abs(((ang - st.a + Math.PI*3) % (Math.PI*2)) - Math.PI);
          if (d < bd) { bd = d; best = st; }
        });
        return best;
      }

      // 计算标签盒子（先按方向放置）
      pts.forEach(function(p){
        var dv = dirVec(p);
        p.align = dv.ax; p.baseline = dv.bl;
        p.text = p.s.id + ' ' + p.s.name;
        p.w = ctx.measureText(p.text).width + padX * 2;
        p.h = fontSize + padY * 2;
        var dist = p.r + 14; // 与气泡的固定间隙，确保不叠加
        // 锚点坐标（标签盒子与气泡接触的边/角）
        var bx, by;
        if (dv.ax === 'center') { bx = p.x; }
        else if (dv.ax === 'left') { bx = p.x + p.r + dist; }
        else { bx = p.x - p.r - dist; }
        if (dv.bl === 'middle') { by = p.y; }
        else if (dv.bl === 'top') { by = p.y + p.r + dist; }
        else { by = p.y - p.r - dist; }
        // 盒子左上角
        p.boxX = bx + (dv.sx < 0 ? -p.w : 0);
        p.boxY = by + (dv.sy < 0 ? -p.h : 0);
      });

      // 碰撞避让：标签之间、标签与气泡之间分离
      function overlapBoxes(a, b) {
        return a.boxX < b.boxX + b.w && a.boxX + a.w > b.boxX &&
               a.boxY < b.boxY + b.h && a.boxY + a.h > b.boxY;
      }
      function overlapBubble(p) {
        // 标签盒与任一气泡圆的最小矩形-圆碰撞
        var nx = Math.max(p.boxX, Math.min(p.x, p.boxX + p.w));
        var ny = Math.max(p.boxY, Math.min(p.y, p.boxY + p.h));
        var ddx = p.x - nx, ddy = p.y - ny;
        return (ddx*ddx + ddy*ddy) < (p.r * p.r) - 4;
      }
      for (var iter = 0; iter < 60; iter++) {
        var moved = false;
        for (var a = 0; a < pts.length; a++) {
          for (var b = a + 1; b < pts.length; b++) {
            if (overlapBoxes(pts[a], pts[b])) {
              // 沿竖直方向分开（盒子高度小，竖直推开更稳定）
              var ca = pts[a].boxY + pts[a].h/2, cb = pts[b].boxY + pts[b].h/2;
              var push = (pts[a].h)/2 + (pts[b].h)/2 + 2;
              if (ca <= cb) { pts[a].boxY -= 3; pts[b].boxY += 3; }
              else { pts[a].boxY += 3; pts[b].boxY -= 3; }
              moved = true;
            }
          }
          // 与气泡分离
          if (overlapBubble(pts[a])) {
            // 沿着远离质心方向再推开
            var ddx2 = pts[a].boxX + pts[a].w/2 - cx;
            var ddy2 = pts[a].boxY + pts[a].h/2 - cy;
            if (ddy2 !== 0) pts[a].boxY += (ddy2 > 0 ? 3 : -3);
            else pts[a].boxX += (ddx2 > 0 ? 3 : -3);
            moved = true;
          }
          // 约束在画布内
          if (pts[a].boxX < area.left + 2) pts[a].boxX = area.left + 2;
          if (pts[a].boxY < area.top + 2) pts[a].boxY = area.top + 2;
          if (pts[a].boxX + pts[a].w > area.right - 2) pts[a].boxX = area.right - 2 - pts[a].w;
          if (pts[a].boxY + pts[a].h > area.bottom - 2) pts[a].boxY = area.bottom - 2 - pts[a].h;
        }
        if (!moved) break;
      }

      // 绘制：先画引线，再画标签盒
      ctx.save();
      ctx.font = font;
      ctx.lineWidth = 1;
      pts.forEach(function(p){
        // 标签盒中心
        var lcx = p.boxX + p.w/2, lcy = p.boxY + p.h/2;
        // 从气泡边缘到标签盒边缘的引线
        ctx.strokeStyle = p.s.c;
        ctx.beginPath();
        ctx.moveTo(p.x + (lcx - p.x >= 0 ? p.r*0.6 : -p.r*0.6),
                   p.y + (lcy - p.y >= 0 ? p.r*0.6 : -p.r*0.6));
        ctx.lineTo(lcx, lcy);
        ctx.stroke();

        // 白色底框 + 阶段色细边框
        ctx.fillStyle = 'rgba(255,255,255,0.96)';
        ctx.strokeStyle = p.s.c;
        ctx.beginPath();
        ctx.roundRect(p.boxX, p.boxY, p.w, p.h, 3);
        ctx.fill();
        ctx.stroke();

        // 文字（居中于盒子）
        ctx.fillStyle = '#1B3A6B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.text, lcx, lcy);
      });
      ctx.restore();
    }
  };

  new Chart(document.getElementById('quadrantChart'), {
    type: 'scatter',
    data: {
      datasets: scenarios.map(function(s){
        var r = s.p === 'P0' ? 18 : s.p === 'P1' ? 12 : 7;
        return {
          label: s.id + ' ' + s.name,
          data: [{x: Math.min(s.bv, 5.0), y: s.td}],
          backgroundColor: s.c,
          pointRadius: r,
          pointHoverRadius: r + 3,
          pointBorderColor: '#fff',
          pointBorderWidth: 1,
          clip: false
        };
      })
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 40, right: 140, bottom: 40, left: 40 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var s = scenarios[ctx.datasetIndex];
              return s.id + ' ' + s.name + ' (BV:' + s.bv + ' TD:' + s.td + ')';
            }
          }
        }
      },
      scales: {
        x: {
          min: 2.5, max: 5.0,
          title: { display: true, text: '业务价值（Business Value）', font: { size: 12 } },
          ticks: { stepSize: 0.5, font: { size: 11 } }
        },
        y: {
          min: 1.5, max: 5.0,
          title: { display: true, text: '技术难度（Technical Difficulty）', font: { size: 12 } },
          ticks: { stepSize: 0.5, font: { size: 11 } }
        }
      }
    },
    plugins: [labelPlugin]
  });
})();
</script>
</body>
</html>
