<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目分布</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  .chart-container { width: 100%; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
  h2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 18px; color: #1B3A6B; margin-bottom: 12px; text-align: center; }
  .canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="chart-container">
  <h2>项目分布</h2>
  <div class="canvas-wrap"><canvas id="projDistChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
var C = {
  navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
  steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
};

new Chart(document.getElementById('projDistChart'), {
  type:'bar',
  data:{
    labels:['财务/合规','供应链','生产/研发','销售','质量','IT治理','AI/IoT/ESG','HR'],
    datasets:[
      {label:'Phase1（2026）',data:[4,2,1,1,0,1,0,0],backgroundColor:C.navy,borderRadius:3},
      {label:'Phase2（2027）',data:[1,2,2,2,1,2,0,0],backgroundColor:C.primary,borderRadius:3},
      {label:'Phase3（2028）',data:[1,1,0,0,0,1,3,1],backgroundColor:C.steel,borderRadius:3}
    ]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top:20}},
    plugins:{
      legend:{position:'top',labels:{font:{size:11},padding:10}},
      datalabels:{
        anchor:'end',align:'top',font:{size:9,weight:'600'},color:C.dark,
        formatter:function(v){return v>0?v:'';}
      }
    },
    scales:{x:{},y:{beginAtZero:true,title:{display:true,text:'项目数量'},ticks:{stepSize:1}}}
  }
});
</script>
</body>
</html>
