<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24个项目卡片综合优先级评分</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  .chart-container { width: 100%; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
  h2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 18px; color: #1B3A6B; margin-bottom: 12px; text-align: center; }
  .canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="chart-container">
  <h2>24个项目卡片综合优先级评分</h2>
  <div class="canvas-wrap"><canvas id="priorityChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
var C = {
  navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
  steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
};

// 24个项目卡片综合优先级评分（来源：《数字化转型路径规划报告 V3》§4.2）
var items=[
  {label:'PC01 S/4HANA PCE 数字底座', score:92},
  {label:'PC02 主数据治理与数据规范', score:90},
  {label:'PC03 集成架构与CPI接口收敛', score:85},
  {label:'PC04 端到端流程蓝图与变革管理', score:83},
  {label:'PC12 数据中台', score:80},
  {label:'PC05 财务核心与全球合并', score:80},
  {label:'PC06 销售订单与信用全链路', score:78},
  {label:'PC19 优化供应链·启用 MRP', score:76},
  {label:'PC07 供应链计划与制造协同', score:76},
  {label:'PC08 质量追溯与研发一体化', score:74},
  {label:'PC14 APS高级计划排程（重建）', score:73},
  {label:'PC09 海外本地化合规', score:72},
  {label:'PC18 全面预算管理系统', score:72},
  {label:'PC23 信息安全体系治理', score:70},
  {label:'PC13 AI平台深化与场景落地', score:70},
  {label:'PC20 MES系统新建与集成', score:68},
  {label:'PC21 CRM系统新建与集成', score:66},
  {label:'PC16 设备物联 IoT', score:65},
  {label:'PC15 智能仓储 WMS深化', score:64},
  {label:'PC10 数据智能分析平台', score:64},
  {label:'PC22 AI深化二期·智能体', score:62},
  {label:'PC11 生态协同与模式创新', score:60},
  {label:'PC24 IT/OT融合安全与SOC', score:60},
  {label:'PC17 供应链控制塔 / BI', score:60}
];
items.sort(function(a,b){return b.score-a.score;});
var pLabels=items.map(function(i){return i.label;});
var pScores=items.map(function(i){return i.score;});
var pColors=pScores.map(function(s){return s>=85?C.navy:s>=70?C.primary:C.steel;});

new Chart(document.getElementById('priorityChart'), {
  type:'bar',
  data:{labels:pLabels,datasets:[{label:'优先级综合评分',data:pScores,backgroundColor:pColors,borderRadius:4}]},
  options:{
    indexAxis:'y', responsive:true, maintainAspectRatio:false,
    layout:{padding:{right:50}},
    plugins:{
      legend:{display:false},
      datalabels:{anchor:'end',align:'right',font:{size:9,weight:'600'},color:C.dark,formatter:function(v){return v+'分';}}
    },
    scales:{x:{min:55,max:100},y:{ticks:{font:{size:10}}}}
  }
});
</script>
</body>
</html>
