<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22系统处理策略四象限图</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#fff}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  h1{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
     font-size:18px;font-weight:700;color:#1B3A6B;margin-bottom:12px;text-align:center}
  .chart-box{position:relative;width:100%;max-width:900px;height:70vh;min-height:320px}
</style>
</head>
<body>
<h1>系统处理策略定位图：业务满足度 vs 更换代价</h1>
<div class="chart-box">
  <canvas id="strategyChart"></canvas>
</div>
<script>
(function(){
  Chart.register(ChartDataLabels);
  var C = {
    navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
    steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
  };
  var systems = [
    { x: 2, y: 4, label: 'ECC→S/4HANA', r: 32, color: C.navy },
    { x: 3, y: 4, label: 'MDG(新引入)', r: 22, color: C.primary },
    { x: 3, y: 3.5, label: 'Group Rpt(新引入)', r: 20, color: C.primary },
    { x: 4, y: 2, label: 'PLM(保留+集成)', r: 18, color: C.steel },
    { x: 4, y: 2.5, label: 'SRM(保留+集成)', r: 18, color: C.steel },
    { x: 3.5, y: 2, label: 'CRM(保留+集成)', r: 18, color: C.steel },
    { x: 2.5, y: 3, label: 'WMS→EWM(升级)', r: 20, color: C.mid },
    { x: 4, y: 3, label: 'MES(保留+集成)', r: 18, color: C.steel },
    { x: 3, y: 3, label: 'CPI(升级)', r: 20, color: C.mid },
    { x: 4.5, y: 3, label: 'SmartBI(保留)', r: 15, color: C.muted }
  ];
  new Chart(document.getElementById('strategyChart'), {
    type: 'bubble',
    data: {
      datasets: systems.map(function(s){
        return {
          label: s.label,
          data: [{ x: s.x, y: s.y, r: s.r }],
          backgroundColor: s.color + 'CC',
          borderColor: s.color,
          borderWidth: 1.5
        };
      })
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display:false },
        datalabels: {
          anchor: 'center', align: 'center',
          color: '#fff', font: { size: 7, weight: '600' },
          formatter: function(value, context) { return context.dataset.label; }
        },
        tooltip: { callbacks: { label: function(ctx) { return ctx.dataset.label; } } }
      },
      scales: {
        x: { min:1, max:5.5, title:{display:true,text:'当前满足业务需求程度（低→高）'}, ticks:{font:{size:10}} },
        y: { min:1, max:5, title:{display:true,text:'更换代价（高→低）'}, ticks:{font:{size:10}} }
      }
    }
  });
})();
</script>
</body>
</html>
