<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOGAF ADM 八相位雷达图</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
  .radar-wrap{width:100%;max-width:440px;text-align:center}
  .radar-title{font-size:12px;font-weight:700;color:#0b2d47;margin-bottom:8px;letter-spacing:.3px}
  .chart-box{position:relative;width:100%;height:380px}
</style>
</head>
<body>
<div class="radar-wrap">
  <div class="radar-title">TOGAF ADM 相位与本项目映射关系</div>
  <div class="chart-box"><canvas id="admChart"></canvas></div>
</div>
<script>
const C = { navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1', steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7' };
new Chart(document.getElementById('admChart'), {
  type: 'radar',
  data: {
    labels: [['Phase A','架构愿景'],['Phase B','业务架构'],['Phase C','信息系统'],['Phase D','技术架构'],['Phase E','机会方案'],['Phase F','迁移规划'],['Phase G','实施治理'],['Phase H','变更管理']],
    datasets: [{
      label: '本项目覆盖深度',
      data: [5, 5, 5, 5, 3, 2, 3, 3],
      borderColor: C.primary,
      backgroundColor: 'rgba(0,94,184,0.2)',
      pointBackgroundColor: C.primary,
      borderWidth: 2,
      pointRadius: 5
    },{
      label: 'TOGAF标准完整覆盖',
      data: [5,5,5,5,5,5,5,5],
      borderColor: C.pale,
      backgroundColor: 'rgba(208,228,247,0.1)',
      pointBackgroundColor: C.light,
      borderWidth: 1,
      borderDash: [4,4],
      pointRadius: 3
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position:'bottom', labels:{font:{size:11},padding:12} } },
    scales: { r: { min:0, max:5, ticks:{stepSize:1,font:{size:9}}, pointLabels:{font:{size:10}}, grid:{color:'#e0e6ee'}, angleLines:{color:'#e0e6ee'} } }
  }
});
</script>
</body>
</html>
