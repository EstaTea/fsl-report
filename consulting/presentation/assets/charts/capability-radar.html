<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能力成熟度雷达图</title>
<style>
  :root{
    --navy:#0b2d47; --primary:#2374a3; --light:#79b4eb; --pale:#d0e8f0;
    --bg:transparent;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
  svg{display:block;margin:0 auto}
</style>
</head>
<body>
<svg id="capRadar" viewBox="0 0 420 380" width="400" height="360" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <style>
      .rl{font-size:10.5px;fill:#1a3a5c;font-weight:700}
      .rs{font-size:9px;fill:#6b8cb8}
      .axis-line{stroke:#c8ddf0;stroke-width:1}
      .ring-poly{fill:none;stroke:#d0e4f7;stroke-width:1}
    </style>
  </defs>

  <!-- 中心点 (210, 190), 半径 R=140, 8轴每45° -->
  <g transform="translate(210,190)">
    <!-- 5圈背景网格 (20%/40%/60%/80%/100%) -->
    <polygon class="ring-poly" points="0,-28 19.8,-19.8 28,0 19.8,19.8 0,28 -19.8,19.8 -28,0 -19.8,-19.8"/>
    <polygon class="ring-poly" points="0,-56 39.6,-39.6 56,0 39.6,39.6 0,56 -39.6,39.6 -56,0 -39.6,-39.6"/>
    <polygon class="ring-poly" points="0,-84 59.4,-59.4 84,0 59.4,59.4 0,84 -59.4,59.4 -84,0 -59.4,-59.4"/>
    <polygon class="ring-poly" points="0,-112 79.2,-79.2 112,0 79.2,79.2 0,112 -79.2,79.2 -112,0 -79.2,-79.2"/>
    <polygon class="ring-poly" points="0,-140 99,-99 140,0 99,99 0,140 -99,99 -140,0 -99,-99"/>

    <!-- 8条轴线 -->
    <line class="axis-line" x1="0" y1="0" x2="0" y2="-140"/>
    <line class="axis-line" x1="0" y1="0" x2="99" y2="-99"/>
    <line class="axis-line" x1="0" y1="0" x2="140" y2="0"/>
    <line class="axis-line" x1="0" y1="0" x2="99" y2="99"/>
    <line class="axis-line" x1="0" y1="0" x2="0" y2="140"/>
    <line class="axis-line" x1="0" y1="0" x2="-99" y2="99"/>
    <line class="axis-line" x1="0" y1="0" x2="-140" y2="0"/>
    <line class="axis-line" x1="0" y1="0" x2="-99" y2="-99"/>

    <!-- 刻度数字 -->
    <text x="5" y="-24" class="rs">1</text><text x="5" y="-52" class="rs">2</text>
    <text x="5" y="-80" class="rs">3</text><text x="5" y="-108" class="rs">4</text><text x="5" y="-136" class="rs">5</text>

    <!-- AS-IS 多边形（浅蓝）— 当前状态 -->
    <polygon
      points="0,-77 71.3,-63.4 100.8,0 29.7,29.7 0,70 -55.4,55.4 -98,0 -55.4,-55.4"
      fill="rgba(121,180,235,.22)" stroke="#79b4eb" stroke-width="2"/>

    <!-- TO-BE 多边形（深蓝）— 目标状态 (2026-2027)
         8轴顺序(顺时针从顶): 集团战略3.8/计划管~3.9/主数据4.7/供应链3.8/质量追溯3.2/数据质量3.5/研发产品4.0/IT运维3.6
    -->
    <polygon
      points="0,-106.4 81.2,-72.8 131.6,0 75.25,75.25 0,89.6 -69.3,69.3 -112,0 -71.3,-71.3"
      fill="rgba(11,45,71,.12)" stroke="#0b2d47" stroke-width="2.2"/>

    <!-- AS-IS 数据点 -->
    <circle cx="0" cy="-77" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="71.3" cy="-63.4" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="100.8" cy="0" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="29.7" cy="29.7" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="0" cy="70" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="-55.4" cy="55.4" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="-98" cy="0" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>
    <circle cx="-55.4" cy="-55.4" r="4.5" fill="#79b4eb" stroke="#fff" stroke-width="1.5"/>

    <!-- TO-BE 数据点 -->
    <circle cx="0" cy="-106.4" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="81.2" cy="-72.8" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="131.6" cy="0" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="75.25" cy="75.25" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="0" cy="89.6" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="-69.3" cy="69.3" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="-112" cy="0" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
    <circle cx="-71.3" cy="-71.3" r="5" fill="#0b2d47" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- 标签（放在外圈，绝对定位不受 transform 影响）-->
  <text x="210" y="38" text-anchor="middle" class="rl">集团战略管控</text>
  <text x="320" y="82" text-anchor="start" class="rl">计划管理</text>
  <text x="358" y="194" text-anchor="start" class="rl">主数据治理</text>
  <text x="320" y="310" text-anchor="start" class="rl">供应链协同</text>
  <text x="210" y="346" text-anchor="middle" class="rl">质量追溯</text>
  <text x="100" y="310" text-anchor="end" class="rl">数据质量</text>
  <text x="62" y="194" text-anchor="end" class="rl">研发产品管理</text>
  <text x="100" y="82" text-anchor="end" class="rl">IT服务/运维</text>

  <!-- 图例 -->
  <rect x="100" y="362" width="18" height="6" rx="2" fill="rgba(121,180,235,.35)" stroke="#79b4eb" stroke-width="1.5"/>
  <text x="122" y="369" class="rs">AS-IS 当前状态</text>
  <line x1="220" y1="365" x2="240" y2="365" stroke="#0b2d47" stroke-width="2.5"/>
  <text x="244" y="369" class="rs">TO-BE 目标状态（2026–2027 S/4HANA 上线后）</text>
</svg>
</body>
</html>
