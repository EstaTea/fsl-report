<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价值来源分布</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  .chart-container { width: 100%; height: 100vh; padding: 20px; display: flex; flex-direction: column; }
  h2 { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; font-size: 18px; color: #1B3A6B; margin-bottom: 12px; text-align: center; }
  .canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="chart-container">
  <h2>价值来源分布</h2>
  <div class="canvas-wrap"><canvas id="valuePieChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
Chart.register(ChartDataLabels);
var C = {
  navy:'#003087', dark:'#1B3A6B', primary:'#005EB8', mid:'#1F70C1',
  steel:'#4A6FA5', muted:'#6B8CB8', light:'#A8C4E0', pale:'#D0E4F7'
};

new Chart(document.getElementById('valuePieChart'), {
  type:'doughnut',
  data:{
    labels:['库存降低（1.8亿）','应收提速（1.2亿）','采购降本（1.1亿）','运营效率（1.2亿）','合规价值（0.8亿）','质量成本（0.7亿）'],
    datasets:[{ data:[1.8,1.2,1.1,1.2,0.8,0.7],
      backgroundColor:[C.navy,C.dark,C.primary,C.mid,C.steel,C.muted],
      borderColor:'#fff', borderWidth:2 }]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{position:'right',labels:{font:{size:10},padding:8}},
      datalabels:{color:'#fff',font:{size:9,weight:'600'},formatter:function(v){return v+'亿';}}
    }
  }
});
</script>
</body>
</html>
