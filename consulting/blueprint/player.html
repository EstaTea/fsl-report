<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FSL 主数据治理讲解视频</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#0B2D47;overflow:hidden}
    .wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0B2D47}
    video{max-width:100%;max-height:100%;display:block;outline:none}
    .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      color:#A8C4E0;font-family:"Microsoft YaHei",Arial,sans-serif;font-size:16px;text-align:center;
      pointer-events:none;transition:opacity .5s}
    .title{position:absolute;top:20px;left:50%;transform:translateX(-50%);
      background:rgba(0,94,184,0.8);color:#fff;padding:8px 20px;border-radius:20px;
      font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px;white-space:nowrap;
      opacity:0;transition:opacity .5s}
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="loading" id="loading">⏳ 视频加载中...</div>
    <div class="title" id="title">📊 佛山照明 · 主数据治理概览讲解视频</div>
    <video
      id="vid"
      controls
      preload="metadata"
      style="display:none"
      crossorigin="anonymous"
    >
      <source src="../data-survey-video.mp4" type="video/mp4">
    </video>
  </div>
  <script>
    var vid = document.getElementById('vid');
    var loading = document.getElementById('loading');
    var title = document.getElementById('title');

    vid.addEventListener('canplay', function() {
      loading.style.opacity = '0';
      title.style.opacity = '1';
      vid.style.display = 'block';
      setTimeout(function(){loading.style.display='none';}, 500);
    });

    vid.addEventListener('error', function() {
      loading.innerHTML = '❌ 视频加载失败，请直接访问 <a href="../data-survey-video.mp4" style="color:#60a5fa">MP4文件</a>';
    });
  </script>
</body>
</html>
