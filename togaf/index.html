<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOGAF 咨询工作台 | 佛照 FSL</title>
<style>

:root{--b900:#0B2D47;--b700:#1A4F73;--b500:#2374A3;--b300:#5EA4CE;
      --b100:#C7E2F2;--b050:#EBF5FB;--bg:#F2F7FB;--text:#0F2233;
      --muted:#5B7A91;--rule:#D6E8F2;--r:6px;
      --navy:#0B2D47;--dark:#1A4F73;--primary:#2374A3;--mid:#3D8FC4;
      --steel:#5B7A91;--pale:#D6E8F2;--white:#fff;--text2:#2C4A6A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","Helvetica Neue",system-ui,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
     display:flex;flex-direction:column;min-height:100vh;overflow:auto;}
a{color:inherit;text-decoration:none;}

/* ── NAV ── */

/* ── HERO STRIP ── */
.hero-strip{background:linear-gradient(135deg,var(--b900) 0%,var(--b700) 100%);
  color:#fff;padding:12px 32px;display:flex;align-items:center;gap:20px;
  flex-shrink:0;border-bottom:3px solid var(--b500);}
.hero-strip h1{font-size:15px;font-weight:800;}
.hero-strip p{font-size:11.5px;opacity:.65;margin-top:1px;}
.hero-chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
      border-radius:3px;padding:2px 9px;font-size:10.5px;letter-spacing:.3px;}

/* ── GANTT TOOLBAR ── */
.gantt-toolbar{background:var(--white);border-bottom:1px solid var(--pale);
  padding:6px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.g-btn{padding:4px 10px;border:1px solid var(--pale);border-radius:5px;font-size:11.5px;
  cursor:pointer;background:var(--bg);color:var(--steel);font-family:inherit;transition:all .15s;}
.g-btn:hover{background:var(--pale);}
.g-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.g-legend{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;}
.g-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle;}

/* ── GANTT BODY ── */
.gantt-outer{flex:1;display:flex;overflow:hidden;}
#ganttLeft{width:400px;min-width:400px;flex-shrink:0;overflow-y:auto;overflow-x:hidden;
  border-right:2px solid var(--pale);}
#ganttRight{flex:1;overflow:auto;}
.gantt-col-hd{background:var(--dark);color:#fff;display:grid;grid-template-columns:1fr 56px 56px;padding:10px 12px;font-size:11px;font-weight:700;position:sticky;top:0;z-index:2;letter-spacing:.4px;text-transform:uppercase;}

/* ── Issue Panel ── */
#issuePanel{position:fixed;top:0;right:-480px;width:460px;height:100vh;
  background:#fff;box-shadow:-4px 0 24px rgba(11,45,71,.18);z-index:500;
  display:flex;flex-direction:column;transition:right .25s ease;overflow:hidden;}
#issuePanel.open{right:0;}
.ip-header{background:var(--b900);color:#fff;padding:14px 18px;display:flex;
  align-items:center;gap:10px;flex-shrink:0;}
.ip-header h3{font-size:14px;font-weight:700;flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.ip-close{background:rgba(255,255,255,.15);border:none;color:#fff;
  width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ip-close:hover{background:rgba(255,255,255,.25);}
.ip-body{flex:1;overflow-y:auto;padding:16px 18px;}
.ip-section{margin-bottom:16px;}
.ip-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px;}
.ip-field{width:100%;padding:7px 10px;border:1px solid var(--rule);border-radius:5px;
  font-size:13px;font-family:inherit;color:var(--text);background:#fff;
  transition:border-color .15s;}
.ip-field:focus{outline:none;border-color:var(--b500);}
.ip-field:read-only{background:var(--b050);color:var(--muted);}
textarea.ip-field{resize:vertical;min-height:100px;line-height:1.6;}
.ip-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ip-footer{padding:12px 18px;border-top:1px solid var(--rule);display:flex;
  gap:8px;flex-shrink:0;background:#fff;}
.ip-btn{padding:7px 16px;border-radius:5px;font-size:12.5px;font-weight:700;
  cursor:pointer;border:none;font-family:inherit;transition:all .15s;}
.ip-btn-primary{background:var(--b500);color:#fff;}
.ip-btn-primary:hover{background:var(--b700);}
.ip-btn-ghost{background:var(--b050);color:var(--b700);border:1px solid var(--rule);}
.ip-btn-ghost:hover{background:var(--rule);}
.ip-btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
.ip-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;
  font-weight:700;padding:2px 8px;border-radius:3px;margin-right:4px;}
.ip-badge-open{background:var(--b050);color:var(--b700);}
.ip-badge-closed{background:#f0fdf4;color:#15803d;}
.ip-loading{text-align:center;padding:30px;color:var(--muted);font-size:13px;}
.ip-meta{font-size:11.5px;color:var(--muted);margin-top:4px;}
.ip-link{color:var(--b500);font-size:12px;text-decoration:none;}
.ip-link:hover{text-decoration:underline;}
#panelOverlay{position:fixed;inset:0;background:rgba(11,45,71,.25);z-index:499;
  display:none;}
#panelOverlay.open{display:block;}
.ip-pct-wrap{display:flex;align-items:center;gap:8px;}
.ip-pct-wrap input[type=range]{flex:1;accent-color:var(--b500);}
.ip-pct-num{font-size:13px;font-weight:700;color:var(--b500);min-width:36px;text-align:right;}

/* ── DASHBOARD ── */
.dash-hero{background:linear-gradient(135deg,var(--b900) 0%,var(--b700) 100%);
  color:#fff;padding:20px 32px;flex-shrink:0;border-bottom:3px solid var(--b500);}
.dash-hero h1{font-size:18px;font-weight:800;margin-bottom:3px;}
.dash-hero p{font-size:12.5px;opacity:.7;}
.dash-chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.dash-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  border-radius:3px;padding:3px 10px;font-size:11px;}
.dash-body{flex:1;padding:24px 32px;overflow-y:auto;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:8px;padding:16px 18px;
  box-shadow:0 1px 4px rgba(11,45,71,.08);border:1px solid var(--rule);}
.stat-card .sc-num{font-size:28px;font-weight:800;color:var(--b700);line-height:1;}
.stat-card .sc-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.stat-card .sc-link{font-size:11px;color:var(--b500);margin-top:6px;display:block;text-decoration:none;}
.stat-card .sc-link:hover{text-decoration:underline;}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.dash-card{background:#fff;border-radius:8px;padding:18px 20px;
  box-shadow:0 1px 4px rgba(11,45,71,.08);border:1px solid var(--rule);}
.dash-card h3{font-size:13px;font-weight:800;color:var(--b900);
  margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;}
.dash-card h3 a{font-size:11px;font-weight:400;color:var(--b500);text-decoration:none;}
.dash-card h3 a:hover{text-decoration:underline;}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;
  border-bottom:1px solid var(--rule);font-size:12.5px;}
.task-item:last-child{border-bottom:none;}
.task-item .ti-num{font-size:10.5px;color:var(--muted);min-width:28px;flex-shrink:0;margin-top:1px;}
.task-item .ti-title{flex:1;color:var(--text);line-height:1.45;}
.task-item .ti-title a{color:var(--text);text-decoration:none;}
.task-item .ti-title a:hover{color:var(--b500);}
.task-item .ti-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;
  white-space:nowrap;flex-shrink:0;}
.badge-wip{background:#EBF4FF;color:var(--b700);border:1px solid var(--b100);}
.badge-done{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
.badge-todo{background:var(--bg);color:var(--muted);border:1px solid var(--rule);}
.ms-item-row{display:flex;align-items:center;gap:8px;padding:7px 0;
  border-bottom:1px solid var(--rule);font-size:12.5px;}
.ms-item-row:last-child{border-bottom:none;}
.ms-item-row .mi-name{flex:1;color:var(--b900);font-weight:600;}
.ms-item-row .mi-date{font-size:11px;color:var(--muted);white-space:nowrap;}
.ms-item-row .mi-status{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap;}
.risk-row{display:flex;align-items:center;gap:8px;padding:7px 0;
  border-bottom:1px solid var(--rule);font-size:12.5px;}
.risk-row:last-child{border-bottom:none;}
.risk-row .rr-title{flex:1;color:var(--text);}
.risk-row .rr-badge{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;
  white-space:nowrap;}
.pct-bar{background:var(--rule);border-radius:3px;height:6px;margin-top:10px;}
.pct-fill{height:6px;border-radius:3px;background:var(--b500);transition:width .4s;}
.loading-row{color:var(--muted);font-size:12px;padding:12px 0;text-align:center;}
.chart-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
.chart-card{background:#fff;border-radius:8px;padding:18px 20px;border:1px solid var(--rule);
  box-shadow:0 1px 4px rgba(11,45,71,.08);}
.chart-card h3{font-size:13px;font-weight:800;color:var(--b900);margin-bottom:14px;}
.chart-wrap{position:relative;height:180px;}
.donut-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;}
.dl-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text);}
.dl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pct-big{font-size:36px;font-weight:800;color:var(--b500);line-height:1;margin:20px 0 6px;}
.pct-sub2{font-size:12.5px;color:var(--muted);}
@media(max-width:900px){.chart-row{grid-template-columns:1fr;}}


/* 包装页专用 */
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#togaf-frame {
  flex: 1;
  border: none;
  width: 100%;
  display: block;
  min-height: 0;
}
</style>
</head>
<body>
<div id="site-nav"></div>
<script src="../nav.js"></script>
<iframe id="togaf-frame"
  src="/fsl-report/togaf/workbench.html"
  title="TOGAF 咨询工作台"
  allowfullscreen>
</iframe>
</body>
</html>
