<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOGAF 咨询工作台 V3 — 佛照 S/4HANA 升级项目</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--card:#fff;--border:#e2e8f0;
  --txt:#1e293b;--muted:#64748b;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── header ── */
#hdr{background:#0f172a;color:#f8fafc;padding:0 16px;height:50px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#hdr-logo{font-size:15px;font-weight:800;white-space:nowrap}
#hdr-logo span{color:#60a5fa}
#hdr-tag{font-size:10px;color:#94a3b8;padding:2px 7px;border:1px solid #334155;border-radius:3px;white-space:nowrap}
#hdr-proj{flex:1;font-size:11px;color:#94a3b8;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdr-prog{display:flex;align-items:center;gap:6px;font-size:11px;color:#94a3b8;flex-shrink:0}
#hdr-bar{width:90px;height:4px;background:#1e293b;border-radius:2px}
#hdr-fill{height:100%;background:#60a5fa;border-radius:2px;transition:width .4s}

/* ── layout ── */
#body{flex:1;display:flex;overflow:hidden}

/* ── sidebar ── */
#sb{width:230px;min-width:230px;background:#1e293b;overflow-y:auto;flex-shrink:0;padding:6px 0}
#sb::-webkit-scrollbar{width:3px}
#sb::-webkit-scrollbar-thumb{background:#334155}
.pn{padding:7px 10px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px;margin:1px 0;transition:all .12s}
.pn:hover{background:#334155}
.pn.on{background:#1e3a5f;border-left-color:#60a5fa}
.pn-code{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;background:#334155;color:#64748b}
.pn.on .pn-code{background:#1d4ed8;color:#fff}
.pn-info{flex:1;min-width:0}
.pn-title{font-size:11px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-sub{font-size:10px;color:#64748b;margin-top:1px}
.pn-pct{font-size:10px;font-weight:700;white-space:nowrap}
.sb-sec{padding:8px 10px 4px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px}

/* ── deliverable bar ── */
#dbar{background:#1e293b;border-bottom:1px solid #334155;padding:5px 16px;display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.d-chip{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid transparent;opacity:.5;transition:all .12s;white-space:nowrap}
.d-chip:hover{opacity:.85}
.d-chip.on{opacity:1;border-color:rgba(255,255,255,.25)}
.d-chip.all{background:#334155;color:#94a3b8}
.d-chip.all.on{background:#475569;color:#fff}

/* ── phase header ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#phdr{background:var(--card);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.ph-icon{font-size:22px;flex-shrink:0}
.ph-info{flex:1}
.ph-info h2{font-size:14px;font-weight:700}
.ph-info p{font-size:11px;color:var(--muted);margin-top:2px}
.ph-stats{display:flex;gap:12px;flex-shrink:0}
.ph-stat .v{font-size:16px;font-weight:700;text-align:center}
.ph-stat .l{font-size:10px;color:var(--muted);text-align:center}
.ph-bw{width:90px;flex-shrink:0}
.ph-bt{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
.ph-b{height:5px;background:#e2e8f0;border-radius:3px}
.ph-bf{height:100%;border-radius:3px;transition:width .4s}
.badge{font-size:9px;padding:2px 6px;background:#fef08a;color:#854d0e;border-radius:3px;font-weight:700;margin-left:6px;vertical-align:middle}

/* ── tabs ── */
#tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;display:flex;flex-shrink:0}
.tab{padding:8px 14px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.on{color:#1d4ed8;border-bottom-color:#1d4ed8;font-weight:600}
.tab-n{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:#e2e8f0;border-radius:8px;font-size:9px;font-weight:700;margin-left:4px;color:var(--muted)}
.tab.on .tab-n{background:#dbeafe;color:#1d4ed8}

/* ── content scroll area ── */
#ct{flex:1;overflow-y:auto;padding:14px 18px 28px}
#ct::-webkit-scrollbar{width:5px}
#ct::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:3px}

/* ── legend ── */
.legend{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.ld{width:8px;height:8px;border-radius:50%}
.ld.done{background:#16a34a}
.ld.partial{background:#ca8a04}
.ld.none{background:#cbd5e1}

/* ── INPUT card ── */
.ic{background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden;transition:border-color .12s}
.ic:hover{border-color:#93c5fd}
.ic.faded{opacity:.35}
.ic.open{border-color:#60a5fa}
.ic-row{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ic-dot{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ic-dot.done{background:#dcfce7;color:#16a34a}
.ic-dot.partial{background:#fef9c3;color:#ca8a04}
.ic-dot.none{background:#f1f5f9;color:#94a3b8}
.ic-info{flex:1}
.ic-info h4{font-size:12px;font-weight:600}
.ic-info p{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.4}
.ic-meta{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.d-tag{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;white-space:nowrap}
.req{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;background:#fce7f3;color:#9d174d}
.opt{font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;background:#f1f5f9;color:#94a3b8}
.ic-btns{display:flex;gap:5px;flex-shrink:0}
.btn-xs{padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;transition:all .12s}
.btn-xs:hover{border-color:#60a5fa;color:#1d4ed8}
.btn-xs.pri{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.btn-xs.pri:hover{background:#1e40af}
/* input detail panel */
.ic-detail{padding:0 13px 12px 51px;display:none;border-top:1px dashed #e2e8f0;margin-top:0}
.ic.open .ic-detail{display:block}
.ic-detail-inner{padding-top:10px}
.cl-title{font-size:11px;font-weight:700;color:#475569;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.cl-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--txt);padding:3px 0;line-height:1.5}
.cl-item .ck{font-size:13px;flex-shrink:0}
.note-box{margin-top:8px;padding:8px 10px;background:#fffbeb;border-radius:6px;font-size:11px;color:#92400e;border-left:3px solid #fcd34d}

/* ── STEP card ── */
.sc{background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:border-color .12s}
.sc:hover{border-color:#93c5fd}
.sc.open{border-color:#60a5fa;border-left:3px solid #60a5fa}
.sc.faded{opacity:.35}
.sc-row{padding:11px 13px;display:flex;align-items:center;gap:10px}
.sc-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:2px solid}
.sc-num.done{background:#dcfce7;border-color:#16a34a;color:#166534}
.sc-num.partial{background:#fef9c3;border-color:#ca8a04;color:#92400e}
.sc-num.none{background:#f1f5f9;border-color:#e2e8f0;color:#94a3b8}
.sc-info{flex:1}
.sc-info h4{font-size:12px;font-weight:600}
.sc-info p{font-size:11px;color:var(--muted);margin-top:1px}
.s-btn{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:none;white-space:nowrap}
.s-btn.done{background:#dcfce7;color:#166534}
.s-btn.partial{background:#fef9c3;color:#92400e}
.s-btn.none{background:#f1f5f9;color:#94a3b8}
.sc-detail{display:none;padding:0 13px 13px 49px;border-top:1px dashed #e2e8f0}
.sc.open .sc-detail{display:block}
.guide-box{margin-top:10px;padding:9px 11px;background:#f0f9ff;border-radius:6px;font-size:11px;color:#0c4a6e;line-height:1.65;border-left:3px solid #7dd3fc}
/* subtasks */
.st-title{font-size:11px;font-weight:700;color:#475569;margin:10px 0 6px;display:flex;align-items:center;gap:5px}
.st-list{display:flex;flex-direction:column;gap:4px}
.st-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;padding:3px 6px;border-radius:5px;background:#f8fafc;line-height:1.45}
.st-item.done-t{background:#f0fdf4;color:#166534}
.st-item.done-t .st-ck{color:#16a34a}
.st-item.todo-t{color:#374151}
.st-item.todo-t .st-ck{color:#cbd5e1}
.st-ck{font-size:13px;flex-shrink:0;margin-top:0px}
.tools-row{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tool-tag{font-size:10px;padding:2px 8px;background:#ede9fe;color:#5b21b6;border-radius:10px}

/* ── OUTPUT card ── */
.oc{background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden;transition:border-color .12s}
.oc:hover{border-color:#93c5fd}
.oc.open{border-color:#60a5fa}
.oc.faded{opacity:.35}
.oc-row{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.oc-type{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap;flex-shrink:0}
.oc-type.report{background:#fce7f3;color:#9d174d}
.oc-type.document{background:#fef9c3;color:#92400e}
.oc-type.catalog{background:#dbeafe;color:#1e40af}
.oc-type.matrix{background:#ede9fe;color:#4c1d95}
.oc-type.diagram{background:#dcfce7;color:#166534}
.oc-type.artifact{background:#f1f5f9;color:#475569}
.oc-info{flex:1}
.oc-info h4{font-size:12px;font-weight:600}
.oc-info p{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.4}
.oc-st{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.oc-st.done{background:#16a34a;color:#fff}
.oc-st.partial{background:#ca8a04;color:#fff}
.oc-st.none{background:#e2e8f0;color:#94a3b8}
.btn-ai{padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;background:#7c3aed;color:#fff;border:none;white-space:nowrap;flex-shrink:0}
.btn-ai:hover{background:#6d28d9}
.oc-detail{display:none;padding:0 13px 13px 13px;border-top:1px dashed #e2e8f0}
.oc.open .oc-detail{display:block}
/* doc outline */
.outline-box{margin-top:10px}
.outline-title{font-size:11px;font-weight:700;color:#475569;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.outline-list{display:flex;flex-direction:column;gap:3px;padding-left:4px}
.outline-item{font-size:11px;color:#374151;padding:3px 8px;background:#f8fafc;border-radius:4px;border-left:2px solid #bfdbfe;line-height:1.5}
/* example block */
.ex-box{margin-top:10px;padding:10px 12px;background:#1e293b;border-radius:7px}
.ex-title{font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.ex-pre{font-size:11px;color:#e2e8f0;font-family:monospace;white-space:pre-wrap;line-height:1.6}

/* ── ARTIFACT cards ── */
.ag-sec{font-size:12px;font-weight:700;color:#475569;margin:6px 0 10px;padding-top:6px;display:flex;align-items:center;gap:6px}
.ag-sec::after{content:'';flex:1;height:1px;background:#e2e8f0}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;margin-bottom:16px}
.art{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;transition:all .12s;cursor:pointer}
.art:hover{border-color:#93c5fd;transform:translateY(-1px)}
.art.done{border-color:#bbf7d0;background:#f0fdf4}
.art.partial{border-color:#fde68a;background:#fffbeb}
.art.faded{opacity:.35}
.art-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.art-badge{font-size:9px;padding:2px 6px;border-radius:9px;font-weight:700}
.art-badge.catalog{background:#dbeafe;color:#1e40af}
.art-badge.matrix{background:#ede9fe;color:#4c1d95}
.art-badge.diagram{background:#dcfce7;color:#166534}
.art-badge.report{background:#fce7f3;color:#9d174d}
.art-cnt{font-size:10px;color:var(--muted);margin-left:auto}
.art-name{font-size:12px;font-weight:600;margin-bottom:3px}
.art-desc{font-size:11px;color:var(--muted);line-height:1.45}
.art-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.art-sel{font-size:11px;padding:2px 7px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--card)}
.art-open{font-size:10px;padding:2px 8px;border:none;border-radius:4px;cursor:pointer;background:#eff6ff;color:#1d4ed8}

/* ── deliverable overview ── */
.dov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.dov-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.dov-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dov-icon{font-size:20px;flex-shrink:0}
.dov-title{font-size:13px;font-weight:700}
.dov-pay{font-size:10px;color:#ca8a04;font-weight:600;margin-top:1px}
.dov-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.dov-phases{display:flex;flex-wrap:wrap;gap:5px}
.dov-ptag{font-size:10px;padding:2px 7px;background:#f1f5f9;border-radius:9px;color:#475569;font-weight:500}
.dov-cnt{font-size:12px;font-weight:700;margin-left:auto;padding:2px 8px;border-radius:9px}

/* ── template preview ── */
.tpl-wrap{margin-top:4px}
.tpl-sections{border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:10px}
.tpl-line{padding:7px 12px;font-size:12px;line-height:1.5}
.tpl-h{font-weight:600;color:var(--txt);background:#f8fafc;border-bottom:1px solid #f1f5f9}
.tpl-sub{color:#374151;background:#fff;border-bottom:1px dashed #f1f5f9;padding-left:24px}
.tpl-sub:last-child,.tpl-h:last-child{border-bottom:none}
.tpl-note{padding:9px 12px;background:#fffbeb;border-radius:6px;font-size:11px;color:#92400e;border-left:3px solid #fcd34d;line-height:1.55;margin-bottom:10px}
.tpl-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.tpl-dl-xl{padding:7px 14px;border-radius:6px;border:none;background:#166534;color:#fff;cursor:pointer;font-size:12px;font-weight:600}
.tpl-dl-xl:hover{background:#14532d}
.tpl-dl-wd{padding:7px 14px;border-radius:6px;border:none;background:#1d4ed8;color:#fff;cursor:pointer;font-size:12px;font-weight:600}
.tpl-dl-wd:hover{background:#1e40af}
.tpl-copy-btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:500}
.tpl-copy-btn:hover{border-color:#60a5fa;color:#1d4ed8}

/* ── modal ── */
#mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
#mbg.on{display:flex}
#modal{background:#fff;border-radius:10px;padding:20px;width:520px;max-width:92vw;max-height:82vh;overflow-y:auto}
#modal h3{font-size:14px;font-weight:700;margin-bottom:3px}
.msub{font-size:11px;color:var(--muted);margin-bottom:14px}
.mclose{float:right;background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);margin-top:-2px}
.mf{margin-bottom:12px}
.mf label{display:block;font-size:11px;font-weight:600;margin-bottom:4px}
.mf textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;resize:vertical;min-height:70px;font-family:inherit}
.mf input[type=file]{font-size:11px}
.mbtns{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.btn-c{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px}
.btn-s{padding:6px 14px;border-radius:6px;border:none;background:#1d4ed8;color:#fff;cursor:pointer;font-size:12px;font-weight:600}
.btn-a{padding:6px 14px;border-radius:6px;border:none;background:#7c3aed;color:#fff;cursor:pointer;font-size:12px;font-weight:600}
/* modal artifact table */
.m-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}
.m-table th{background:#f1f5f9;padding:6px 10px;text-align:left;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0}
.m-table td{padding:6px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.45}
.m-table tr:last-child td{border-bottom:none}
.m-table tr:nth-child(even) td{background:#fafbfc}
</style>
<script src="/fsl-report/auth-guard.js"></script>
</head>
<body>
<div id="hdr">
  <div id="hdr-logo">TOGAF<span>工作台</span></div>
  <div id="hdr-tag">PRE → H + RM</div>
  <div id="hdr-proj">佛山照明 业务诊断咨询及SAP系统升级实施项目 · 艾维登（Eviden）· 2026</div>
  <div id="hdr-prog">
    <span>整体进度</span>
    <div id="hdr-bar"><div id="hdr-fill" style="width:0%"></div></div>
    <span id="hdr-pct">0%</span>
  </div>
</div>
<div id="body">
  <div id="sb"></div>
  <div id="main">
    <div id="dbar"></div>
    <div id="phdr"></div>
    <div id="tabs"></div>
    <div id="ct"></div>
  </div>
</div>
<div id="mbg">
  <div id="modal">
    <button class="mclose" onclick="document.getElementById('mbg').classList.remove('on')">✕</button>
    <h3 id="m-title">操作</h3>
    <p class="msub" id="m-sub"></p>
    <div id="m-body"></div>
    <div class="mf"><label>备注</label><textarea placeholder="版本说明、注意事项..."></textarea></div>
    <div class="mf"><label>附件</label><input type="file" accept=".pdf,.doc,.docx,.xlsx,.pptx,.md,.txt"></div>
    <div class="mbtns">
      <button class="btn-c" onclick="document.getElementById('mbg').classList.remove('on')">取消</button>
      <button class="btn-a" onclick="document.getElementById('mbg').classList.remove('on')">✨ AI辅助</button>
      <button class="btn-s" id="m-save">确认</button>
    </div>
  </div>

<script>

const DELIVERABLES = [{"id": "D1", "label": "现状诊断报告", "short": "D1", "color": "#6366f1", "icon": "🔍", "desc": "业务痛点量化、行业对标、AS-IS架构全景", "payment": "★咨询第1批20%"}, {"id": "D2", "label": "企业架构设计报告", "short": "D2", "color": "#0ea5e9", "icon": "️", "desc": "四域TO-BE架构蓝图（业务/应用/数据/技术）", "payment": "★咨询第2批45%"}, {"id": "D3", "label": "专项方案设计报告", "short": "D3", "color": "#8b5cf6", "icon": "⚙️", "desc": "MDG/CPI/PCE/EWM/DRC八大专项方案", "payment": "★咨询第2批"}, {"id": "D4a", "label": "数据调研分析报告", "short": "D4a", "color": "#f59e0b", "icon": "📊", "desc": "9章：数据目录/质量评估/迁移范围/风险清单", "payment": "★咨询第2批(数治三件套)"}, {"id": "D4b", "label": "数据规划及管理办法", "short": "D4b", "color": "#ef4444", "icon": "📋", "desc": "10章治理政策：组织/标准/MDM/质量/生命周期", "payment": "★咨询第2批(数治三件套)"}, {"id": "D4c", "label": "数据治理总结报告", "short": "D4c", "color": "#10b981", "icon": "✅", "desc": "8章：KPI达成/基线对比/经验教训/持续路线图", "payment": "★上线稳定6个月后"}, {"id": "D5", "label": "组织设计报告", "short": "D5", "color": "#ec4899", "icon": "🏢", "desc": "数字化组织架构/CoE/角色职责/变革管理", "payment": "★咨询第2批"}, {"id": "D6", "label": "数字化转型路径规划", "short": "D6", "color": "#14b8a6", "icon": "🗺️", "desc": "2026-2028三年路线图/工作包/过渡架构/ROI", "payment": "★咨询第3批45%"}];


// ── state ──────────────────────────────────────────────────────────────────────
let cur = PHASES[0].id;
let curTab = 'inputs';
let dFilter = 'all';
let expanded = {};  // item-id → true/false
const st = JSON.parse(localStorage.getItem('wb3_st') || '{}');

function save(){ localStorage.setItem('wb3_st', JSON.stringify(st)); }
function getSt(id){ return st[id] || null; }
function setSt(id,v){ st[id]=v; save(); render(); }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

// ── progress ──────────────────────────────────────────────────────────────────
function phasePct(ph){
  const all=[...ph.inputs,...ph.steps,...ph.outputs,...ph.artifacts];
  const done=all.filter(x=>(getSt(x.id)||x.status)==='done').length;
  const part=all.filter(x=>(getSt(x.id)||x.status)==='partial').length;
  return all.length ? Math.round((done+part*.5)/all.length*100) : 0;
}
function overallPct(){
  return Math.round(PHASES.reduce((s,p)=>s+phasePct(p),0)/PHASES.length);
}
function sLabel(s){ return s==='done'?'✓ 已完成':s==='partial'?'◑ 进行中':'○ 未开始'; }
function sIcon(s){ return s==='done'?'✓':s==='partial'?'◑':'○'; }
function typeLabel(t){ return {report:'报告',document:'文档',catalog:'目录',matrix:'矩阵',diagram:'图表',artifact:'制品'}[t]||t; }

function itemMatches(item){
  if(dFilter==='all') return true;
  return (item.delivers||[]).includes(dFilter);
}

// ── D-tags ────────────────────────────────────────────────────────────────────
function dTagHtml(delivers){
  if(!delivers||!delivers.length) return '';
  return delivers.map(id=>{
    const d=DELIVERABLES.find(x=>x.id===id);
    return d ? '<span class="d-tag" style="background:'+d.color+'22;color:'+d.color+'">'+esc(d.short)+'</span>' : '';
  }).join('');
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar(){
  const sb=document.getElementById('sb');
  sb.innerHTML='<div class="sb-sec">ADM Phases</div>'+
    PHASES.map(ph=>{
      const pct=phasePct(ph), on=ph.id===cur;
      const pc=pct>=80?'#4ade80':pct>=40?'#facc15':'#64748b';
      return '<div class="pn'+(on?' on':'')+'" onclick="navTo(\''+ph.id+'\')">'
        +'<div class="pn-code">'+esc(ph.code)+'</div>'
        +'<div class="pn-info">'
        +'<div class="pn-title">'+esc(ph.icon)+' '+esc(ph.title.split('—')[1]?.trim()||ph.title)+'</div>'
        +'<div class="pn-sub">'+esc(ph.subtitle.split('·')[0].trim())+'</div>'
        +'</div>'
        +'<div class="pn-pct" style="color:'+pc+'">'+pct+'%</div></div>';
    }).join('')
    +'<div class="sb-sec" style="margin-top:10px">交付物</div>'
    +'<div class="pn'+(cur==='dov'?' on':'')+'" onclick="navTo(\'dov\')">'
    +'<div class="pn-code">★</div>'
    +'<div class="pn-info"><div class="pn-title">📦 8份交付物总览</div>'
    +'<div class="pn-sub">完成度一览</div></div></div>';
}

// ── D-bar ─────────────────────────────────────────────────────────────────────
function renderDBar(){
  document.getElementById('dbar').innerHTML=
    '<div class="d-chip all'+(dFilter==='all'?' on':'')+'" onclick="setDF(\'all\')">全部</div>'+
    DELIVERABLES.map(d=>'<div class="d-chip'+(dFilter===d.id?' on':'')+'" style="background:'+d.color+'33;color:'+d.color+'" onclick="setDF(\''+d.id+'\')">'+esc(d.short)+'</div>').join('');
}
function setDF(f){ dFilter=f; renderContent(); renderDBar(); }

// ── Phase header ──────────────────────────────────────────────────────────────
function renderPhaseHeader(){
  const pe=document.getElementById('phdr'), te=document.getElementById('tabs');
  if(cur==='dov'){
    pe.innerHTML='<div class="ph-icon">📦</div><div class="ph-info"><h2>8份核心交付物总览</h2><p>管理咨询全部交付物完成状态与关联Phase</p></div>';
    te.innerHTML=''; return;
  }
  const ph=PHASES.find(p=>p.id===cur); if(!ph) return;
  const pct=phasePct(ph);
  pe.innerHTML=
    '<div class="ph-icon">'+esc(ph.icon)+'</div>'
    +'<div class="ph-info"><h2 style="color:'+ph.color+'">'+esc(ph.title)+(ph.badge?'<span class="badge">'+esc(ph.badge)+'</span>':'')+'</h2>'
    +'<p>'+esc(ph.subtitle)+'</p></div>'
    +'<div class="ph-stats">'+['inputs','steps','outputs','artifacts'].map((k,i)=>
      '<div class="ph-stat"><div class="v" style="color:'+ph.color+'">'+ph[k].length+'</div><div class="l">'+['Inputs','Steps','Outputs','Artifacts'][i]+'</div></div>'
    ).join('')+'</div>'
    +'<div class="ph-bw"><div class="ph-bt"><span>完成度</span><span>'+pct+'%</span></div>'
    +'<div class="ph-b"><div class="ph-bf" style="width:'+pct+'%;background:'+ph.color+'"></div></div></div>';
  te.innerHTML=[['inputs','📥 Inputs'],['steps','🔧 Steps'],['outputs','📤 Outputs'],['artifacts','📋 Artifacts']]
    .map(([id,lbl])=>'<div class="tab'+(curTab===id?' on':'')+'" onclick="switchTab(\''+id+'\')">'+lbl+'<span class="tab-n">'+PHASES.find(p=>p.id===cur)[id].length+'</span></div>').join('');
}

// ── Content ───────────────────────────────────────────────────────────────────
function renderContent(){
  const ct=document.getElementById('ct');
  if(cur==='dov'){ ct.innerHTML=renderDov(); return; }
  const ph=PHASES.find(p=>p.id===cur); if(!ph){ ct.innerHTML=''; return; }
  if(curTab==='inputs')     ct.innerHTML=renderInputs(ph);
  else if(curTab==='steps') ct.innerHTML=renderSteps(ph);
  else if(curTab==='outputs') ct.innerHTML=renderOutputs(ph);
  else                       ct.innerHTML=renderArtifacts(ph);
  bindExpand();
}

function bindExpand(){
  document.querySelectorAll('.ic-row[data-eid],.sc-row[data-eid],.oc-row[data-eid]').forEach(row=>{
    row.addEventListener('click',function(e){
      if(e.target.closest('button')||e.target.tagName==='SELECT') return;
      const id=this.dataset.eid;
      expanded[id]=!expanded[id];
      const card=this.closest('.ic,.sc,.oc');
      if(card) card.classList.toggle('open',!!expanded[id]);
    });
  });
}

// ── Deliverable overview ──────────────────────────────────────────────────────
function renderDov(){
  return '<div class="dov-grid">'+DELIVERABLES.map(d=>{
    const cnt=PHASES.reduce((n,ph)=>n+[...ph.inputs,...ph.steps,...ph.outputs,...ph.artifacts].filter(x=>(x.delivers||[]).includes(d.id)).length,0);
    const phaseTags=PHASES.filter(ph=>[...ph.inputs,...ph.steps,...ph.outputs,...ph.artifacts].some(x=>(x.delivers||[]).includes(d.id)))
      .map(ph=>'<span class="dov-ptag">'+esc(ph.code)+'</span>').join('');
    return '<div class="dov-card" style="border-left:3px solid '+d.color+'">'
      +'<div class="dov-top"><div class="dov-icon">'+esc(d.icon)+'</div>'
      +'<div><div class="dov-title">'+esc(d.label)+'</div><div class="dov-pay">'+esc(d.payment)+'</div></div>'
      +'<div class="dov-cnt" style="background:'+d.color+'22;color:'+d.color+'">'+cnt+'项</div></div>'
      +'<div class="dov-desc">'+esc(d.desc)+'</div>'
      +'<div class="dov-phases">'+phaseTags+'</div></div>';
  }).join('')+'</div>';
}

// ── Inputs ────────────────────────────────────────────────────────────────────
function renderInputs(ph){
  const leg='<div class="legend"><div class="lg"><div class="ld done"></div>已提供</div><div class="lg"><div class="ld partial"></div>部分完成</div><div class="lg"><div class="ld none"></div>待上传</div></div>';
  return leg+ph.inputs.map(inp=>{
    const s=getSt(inp.id)||inp.status;
    const dim=!itemMatches(inp)?'faded':'';
    const isOpen=expanded[inp.id];
    const icon=s==='done'?'✓':s==='partial'?'◑':'↑';
    // checklist
    let clHtml='';
    if(inp.checklist&&inp.checklist.length){
      clHtml='<div class="cl-title">📋 核查清单</div>'
        +inp.checklist.map(c=>'<div class="cl-item"><span class="ck">'+esc(c.slice(0,1))+'</span><span>'+esc(c.slice(2))+'</span></div>').join('');
    }
    const noteHtml=inp.template_note?'<div class="note-box">📝 '+esc(inp.template_note)+'</div>':'';
    const detail=clHtml||noteHtml
      ? '<div class="ic-detail"><div class="ic-detail-inner">'+clHtml+noteHtml+'</div></div>' : '';
    return '<div class="ic '+dim+(isOpen?' open':'')+'">'
      +'<div class="ic-row" data-eid="'+inp.id+'">'
      +'<div class="ic-dot '+s+'">'+icon+'</div>'
      +'<div class="ic-info"><h4>'+esc(inp.name)+'</h4><p>'+esc(inp.desc)+'</p></div>'
      +'<div class="ic-meta">'+dTagHtml(inp.delivers)+'<span class="'+(inp.required?'req':'opt')+'">'+(inp.required?'必需':'可选')+'</span></div>'
      +'<div class="ic-btns">'+(inp.template?'<button class="btn-xs" onclick="event.stopPropagation();dlTpl(\''+inp.id+'\')">📄模板</button>':'')
      +'<button class="btn-xs pri" onclick="event.stopPropagation();openUpload(\''+inp.id+'\',\''+inp.required+'\')">⬆ 上传</button>'
      +'</div></div>'
      +detail+'</div>';
  }).join('');
}

// ── Steps ─────────────────────────────────────────────────────────────────────
function renderSteps(ph){
  return ph.steps.map(s=>{
    const st2=getSt(s.id)||s.status;
    const dim=!itemMatches(s)?'faded':'';
    const isOpen=expanded[s.id];
    // subtasks
    let subHtml='';
    if(s.subtasks&&s.subtasks.length){
      const doneN=s.subtasks.filter(t=>t.done).length;
      subHtml='<div class="st-title">☑ 子任务（'+doneN+'/'+s.subtasks.length+'完成）</div>'
        +'<div class="st-list">'+s.subtasks.map(t=>
          '<div class="st-item '+(t.done?'done-t':'todo-t')+'">'
          +'<span class="st-ck">'+(t.done?'✅':'⬜')+'</span><span>'+esc(t.text)+'</span></div>'
        ).join('')+'</div>';
    }
    const toolsHtml=s.tools&&s.tools.length
      ? '<div class="tools-row">🔧 '+s.tools.map(t=>'<span class="tool-tag">'+esc(t)+'</span>').join('')+'</div>' : '';
    const guideHtml=s.guide
      ? '<div class="guide-box"><strong>佛照指导：</strong><br>'+nl(s.guide)+'</div>' : '';
    const detail='<div class="sc-detail">'+guideHtml+subHtml+toolsHtml+'</div>';
    return '<div class="sc '+dim+(isOpen?' open':'')+'">'
      +'<div class="sc-row" data-eid="'+s.id+'">'
      +'<div class="sc-num '+st2+'">'+s.seq+'</div>'
      +'<div class="sc-info"><h4>'+esc(s.title)+'</h4><p>'+esc(s.desc)+'</p></div>'
      +dTagHtml(s.delivers)
      +'<button class="s-btn '+st2+'" onclick="event.stopPropagation();cycleStep(\''+s.id+'\')">'+sLabel(st2)+'</button>'
      +'</div>'+detail+'</div>';
  }).join('');
}

// ── Outputs ───────────────────────────────────────────────────────────────────
function renderOutputs(ph){
  return ph.outputs.map(o=>{
    const s=getSt(o.id)||o.status;
    const dim=!itemMatches(o)?'faded':'';
    const isOpen=expanded[o.id];
    // doc outline
    let outlineHtml='';
    if(o.doc_outline&&o.doc_outline.length){
      outlineHtml='<div class="outline-box">'
        +'<div class="outline-title">📄 文档大纲</div>'
        +'<div class="outline-list">'+o.doc_outline.map(line=>'<div class="outline-item">'+esc(line)+'</div>').join('')
        +'</div></div>';
    }
    const exHtml=o.example
      ? '<div class="ex-box"><div class="ex-title">示例片段</div><div class="ex-pre">'+esc(o.example)+'</div></div>' : '';
    const detail=outlineHtml||exHtml
      ? '<div class="oc-detail">'+outlineHtml+exHtml+'</div>' : '';
    return '<div class="oc '+dim+(isOpen?' open':'')+'">'
      +'<div class="oc-row" data-eid="'+o.id+'">'
      +'<span class="oc-type '+o.type+'">'+typeLabel(o.type)+'</span>'
      +'<div class="oc-info"><h4>'+esc(o.name)+'</h4><p>'+esc(o.desc)+'</p></div>'
      +dTagHtml(o.delivers)
      +'<div class="oc-st '+s+'">'+sIcon(s)+'</div>'
      +'<button class="btn-ai" onclick="event.stopPropagation();openAI(\''+o.id+'\')">✨ AI</button>'
      +'</div>'+detail+'</div>';
  }).join('');
}

// ── Artifacts ─────────────────────────────────────────────────────────────────
function renderArtifacts(ph){
  const groups=[
    {k:'catalog',l:'📂 目录 Catalogs'},
    {k:'matrix', l:'🔲 矩阵 Matrices'},
    {k:'diagram',l:'📊 图表 Diagrams'},
    {k:'report', l:'📑 报告 Reports'},
  ];
  return groups.map(g=>{
    const arts=ph.artifacts.filter(a=>a.type===g.k);
    if(!arts.length) return '';
    return '<div class="ag-sec">'+g.l+'</div><div class="art-grid">'
      +arts.map(a=>{
        const s=getSt(a.id)||a.status;
        const dim=!itemMatches(a)?'faded':'';
        return '<div class="art '+s+' '+dim+'">'
          +'<div class="art-top"><span class="art-badge '+a.type+'">'+a.type+'</span><span class="art-cnt">'+esc(a.count)+'</span></div>'
          +'<div class="art-name">'+esc(a.name)+'</div>'
          +'<div class="art-desc">'+esc(a.desc)+'</div>'
          +'<div class="art-foot">'
          +'<select class="art-sel" onchange="setSt(\''+a.id+'\',this.value)">'
          +'<option value="none"'+(s==='none'?' selected':'')+'>○ 未开始</option>'
          +'<option value="partial"'+(s==='partial'?' selected':'')+'>◑ 进行中</option>'
          +'<option value="done"'+(s==='done'?' selected':'')+'>✓ 已完成</option>'
          +'</select>'
          +'<button class="art-open" onclick="openArtDetail(\''+a.id+'\')">详情 →</button>'
          +'</div></div>';
      }).join('')
      +'</div>';
  }).join('');
}

// ── Actions ───────────────────────────────────────────────────────────────────
function cycleStep(id){
  const cur2=getSt(id)||PHASES.flatMap(p=>p.steps).find(s=>s.id===id)?.status||'none';
  setSt(id,{none:'partial',partial:'done',done:'none'}[cur2]);
}
function dlTpl(id){
  const inp = PHASES.flatMap(p=>p.inputs).find(x=>x.id===id);
  const tc = inp && inp.template_content;
  const mt=document.getElementById('m-title');
  const ms=document.getElementById('m-sub');
  const mb=document.getElementById('m-body');
  if(!tc){
    mt.textContent='📄 模板说明';
    ms.textContent='该 Input 暂无预置模板，请直接上传相关文件。';
    mb.innerHTML='';
    document.getElementById('mbg').classList.add('on');
    document.getElementById('m-save').onclick=()=>document.getElementById('mbg').classList.remove('on');
    return;
  }
  mt.textContent = '📄 ' + tc.title;
  ms.textContent = '点击下方按钮直接下载，在 Word / WPS / Excel 中打开后填写';
  // 决定格式：sections 里有 Sheet 或 字段 → Excel；其余 → Word
  const isExcel = tc.format.includes('Excel') || tc.format.includes('xlsx') || tc.format.includes('xls')
    || tc.sections.some(s=>s.includes('Sheet') || s.includes('字段'));
  const fname = tc.title.replace(/[^\w一-龥]/g,'_');
  let html='<div class="tpl-wrap">';
  // 预览区
  html+='<div class="tpl-sections">';
  tc.sections.forEach(s=>{
    const isH=!s.startsWith('  ');
    html+='<div class="tpl-line '+(isH?'tpl-h':'tpl-sub')+'">'+esc(s)+'</div>';
  });
  html+='</div>';
  if(tc.note) html+='<div class="tpl-note">💡 '+esc(tc.note)+'</div>';
  // 下载按钮区
  html+='<div class="tpl-actions">'
    +(isExcel
      ? '<button class="tpl-dl-xl" onclick="doDownloadExcel(\''+id+'\')">⬇️ 下载 Excel 模板 (.xls)</button>'
      : '<button class="tpl-dl-wd" onclick="doDownloadWord(\''+id+'\')">⬇️ 下载 Word 模板 (.doc)</button>')
    +(isExcel
      ? '<button class="tpl-dl-wd" onclick="doDownloadWord(\''+id+'\')">⬇️ 下载 Word 版 (.doc)</button>'
      : '')
    +'<button class="tpl-copy-btn" onclick="copyTpl(this)">📋 复制内容</button>'
    +'</div></div>';
  mb.innerHTML=html;
  document.getElementById('mbg').classList.add('on');
  document.getElementById('m-save').onclick=()=>document.getElementById('mbg').classList.remove('on');
}

// ── 生成 Excel (.xls via HTML table) ─────────────────────────────────────────
function doDownloadExcel(id){
  const inp=PHASES.flatMap(p=>p.inputs).find(x=>x.id===id);
  const tc=inp.template_content;
  const fname=tc.title.replace(/[^\w一-龥]/g,'_');
  // 把 sections 解析成「Sheet标题 → 字段列表」
  const sheets=[];
  let curSheet=null;
  tc.sections.forEach(s=>{
    const trimmed=s.trim();
    if(!s.startsWith('  ')){
      // 新的 sheet 或大标题
      curSheet={title:trimmed.replace(/^【.*?】/,'').replace('Sheet','').replace(/^\d+\.\s*/,'').trim()||trimmed, rows:[]};
      sheets.push(curSheet);
    } else {
      // 子行：字段说明
      if(curSheet) curSheet.rows.push(trimmed.replace(/^↳\s*/,'').replace(/^字段：/,''));
    }
  });
  // 构建 HTML workbook（每个 sheet 用 <table> 分隔）
  let body='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">'
    +'<head><meta charset="UTF-8">'
    +'<style>body{font-family:微软雅黑,Arial,sans-serif;font-size:11pt}'
    +'table{border-collapse:collapse;width:100%}'
    +'th{background:#1e3a5f;color:#fff;padding:8px 12px;text-align:left;font-size:11pt;border:1px solid #b8cce4}'
    +'td{padding:7px 12px;border:1px solid #d9e1f2;font-size:10pt;vertical-align:top}'
    +'tr:nth-child(even) td{background:#eef3fb}'
    +'.sheet-title{background:#1e3a5f;color:#fff;font-size:13pt;font-weight:bold;padding:10px 12px}'
    +'.field-label{color:#1e3a5f;font-weight:bold}'
    +'.required{color:#c00000;font-weight:bold}'
    +'.optional{color:#7f7f7f}'
    +'</style></head><body>';
  body+='<p style="font-size:14pt;font-weight:bold;color:#1e3a5f;margin-bottom:4px">'+tc.title+'</p>';
  body+='<p style="font-size:10pt;color:#595959;margin-bottom:16px">项目：佛山照明SAP升级项目 &nbsp;|&nbsp; 日期：____年____月____日 &nbsp;|&nbsp; 填写人：________________</p>';
  if(tc.note) body+='<p style="background:#fffbeb;border-left:4px solid #fcd34d;padding:8px 12px;font-size:10pt;color:#92400e;margin-bottom:16px">💡 '+escRaw(tc.note)+'</p>';
  sheets.forEach((sh,idx)=>{
    body+='<p class="sheet-title" style="margin-top:'+(idx>0?'24px':'0')+'px">'+escRaw(sh.title)+'</p>';
    body+='<table><thead><tr><th style="width:30%">字段 / 项目</th><th style="width:10%">状态</th><th style="width:60%">填写内容 / 说明</th></tr></thead><tbody>';
    if(sh.rows.length){
      sh.rows.forEach((r,i)=>{
        const isReq=r.includes('必填')||r.includes('必须');
        const field=r.replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').split('：')[0].split(':')[0].trim();
        const hint=r.includes('：')?r.split('：').slice(1).join('：').trim():'';
        body+='<tr><td class="field-label">'+escRaw(field)+(isReq?'<span class="required">*</span>':'')+'</td>'
          +'<td><select style="width:100%;padding:2px"><option>⬜ 待填写</option><option>✅ 已完成</option><option>⚠️ 不适用</option></select></td>'
          +'<td style="color:#595959">'+(hint?escRaw(hint):'')+'</td></tr>';
      });
    } else {
      body+='<tr><td colspan="3" style="color:#aaa;font-style:italic">（请在此填写'+escRaw(sh.title)+'相关内容）</td></tr>';
    }
    body+='</tbody></table>';
  });
  body+='<p style="margin-top:24px;font-size:9pt;color:#aaa">本模板由佛照TOGAF工作台自动生成 · '+new Date().toLocaleDateString('zh-CN')+'</p>';
  body+='</body></html>';
  dlFile(body, fname+'_模板.xls', 'application/vnd.ms-excel;charset=utf-8');
}

// ── 生成 Word (.doc via styled HTML) ─────────────────────────────────────────
function doDownloadWord(id){
  const inp=PHASES.flatMap(p=>p.inputs).find(x=>x.id===id);
  const tc=inp.template_content;
  const fname=tc.title.replace(/[^\w一-龥]/g,'_');
  const mso='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">';
  let body=mso+'<head><meta charset="UTF-8">'
    +'<style>'
    +'@page{size:A4;margin:2.54cm 3.17cm 2.54cm 3.17cm}'
    +'body{font-family:宋体,SimSun,serif;font-size:12pt;line-height:1.8;color:#1e293b}'
    +'h1{font-size:18pt;font-weight:bold;color:#1e3a5f;text-align:center;margin-bottom:6pt;border-bottom:2pt solid #1e3a5f;padding-bottom:4pt}'
    +'h2{font-size:14pt;font-weight:bold;color:#1e3a5f;margin:16pt 0 6pt;border-left:4pt solid #1e3a5f;padding-left:8pt}'
    +'h3{font-size:12pt;font-weight:bold;color:#374151;margin:10pt 0 4pt}'
    +'.meta{font-size:10pt;color:#6b7280;text-align:center;margin-bottom:16pt}'
    +'.note{background:#fffbeb;border:1pt solid #fcd34d;padding:8pt 12pt;margin:8pt 0;font-size:10pt;color:#92400e}'
    +'.fill-field{border-bottom:1pt solid #1e3a5f;display:inline-block;min-width:200pt;height:14pt}'
    +'.section-box{border:1pt solid #d1d5db;padding:10pt 14pt;margin:8pt 0;background:#fafafa}'
    +'.required{color:#c00000;font-weight:bold}'
    +'p{margin:4pt 0}'
    +'ul{margin:4pt 0 4pt 18pt}'
    +'li{margin:3pt 0}'
    +'</style></head><body>';
  body+='<h1>'+escRaw(tc.title)+'</h1>';
  body+='<p class="meta">项目：佛山照明SAP升级实施项目 &nbsp;|&nbsp; 编制日期：<span class="fill-field">&nbsp;&nbsp;&nbsp;</span>&nbsp;|&nbsp; 编制人：<span class="fill-field">&nbsp;&nbsp;&nbsp;</span></p>';
  body+='<p class="meta">版本：v1.0 &nbsp;|&nbsp; 审核人：<span class="fill-field">&nbsp;&nbsp;&nbsp;</span>&nbsp;|&nbsp; 批准人：<span class="fill-field">&nbsp;&nbsp;&nbsp;</span></p>';
  if(tc.note) body+='<div class="note">💡 '+escRaw(tc.note)+'</div>';
  // 把 sections 渲染为章节
  let inList=false;
  tc.sections.forEach(s=>{
    if(!s.startsWith('  ')){
      if(inList){body+='</ul>';inList=false;}
      const cleaned=s.replace(/^【.*?】\s*/,'').replace(/^Sheet\d*：\s*/,'').trim();
      const isReq=s.includes('必填');
      body+='<h2>'+escRaw(cleaned)+(isReq?'<span class="required"> *必填</span>':'')+'</h2>';
      body+='<div class="section-box">';
    } else {
      const trimmed=s.trim().replace(/^↳\s*/,'');
      if(trimmed.includes('字段：')||trimmed.includes('包含：')){
        if(!inList){body+='<ul>';inList=true;}
        const items=trimmed.replace(/字段：|包含：/,'').split('/');
        items.forEach(it=>{ body+='<li>'+escRaw(it.trim())+' <span class="fill-field">&nbsp;</span></li>'; });
      } else {
        if(inList){body+='</ul>';inList=false;}
        body+='<p>'+escRaw(trimmed)+'</p>';
      }
    }
  });
  if(inList) body+='</ul>';
  body+='</div>';
  body+='<br><h2>备注 / 说明</h2><div class="section-box"><p>&nbsp;</p><p>&nbsp;</p><p>&nbsp;</p></div>';
  body+='<p style="margin-top:24pt;font-size:9pt;color:#9ca3af">本模板由佛照TOGAF工作台自动生成 · '+new Date().toLocaleDateString('zh-CN')+'</p>';
  body+='</body></html>';
  dlFile(body, fname+'_模板.doc', 'application/msword;charset=utf-8');
}

// ── 通用下载 ──────────────────────────────────────────────────────────────────
function dlFile(content, filename, mime){
  const bom='﻿'; // UTF-8 BOM，让 Office 正确识别中文
  const blob=new Blob([bom+content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); document.body.removeChild(a); },500);
}
function escRaw(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function copyTpl(btn){
  const lines=Array.from(btn.closest('.tpl-wrap').querySelectorAll('.tpl-line'))
    .map(el=>el.textContent).join('\n');
  navigator.clipboard.writeText(lines).then(()=>{ btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制内容',2000); });
}
function openUpload(id,req){
  document.getElementById('m-title').textContent='上传文件';
  document.getElementById('m-sub').textContent='ID: '+id+(req==='true'?' (必需)':' (可选)');
  document.getElementById('mbg').classList.add('on');
  document.getElementById('m-save').onclick=()=>{ setSt(id,'done'); document.getElementById('mbg').classList.remove('on'); };
}
function openAI(id){
  const o=PHASES.flatMap(p=>p.outputs).find(x=>x.id===id);
  document.getElementById('m-title').textContent='✨ AI生成：'+(o?o.name:id);
  document.getElementById('m-sub').textContent='基于已上传输入和佛照项目背景（175条需求/19法人/五大痛点）生成草稿';
  document.getElementById('mbg').classList.add('on');
  document.getElementById('m-save').onclick=()=>{ alert('AI生成功能开发中，完成后调用Claude API自动生成草稿。'); document.getElementById('mbg').classList.remove('on'); };
}
function openArtDetail(id){
  const a=PHASES.flatMap(p=>p.artifacts).find(x=>x.id===id);
  if(!a){ return; }
  document.getElementById('m-title').textContent=a.name;
  document.getElementById('m-sub').textContent=a.desc;
  let body='';
  if(a.example_rows&&a.example_rows.length){
    const cols=Object.keys(a.example_rows[0]);
    const headers={'col1':'编号/类别','col2':'名称/标题','col3':'内容/说明','col4':'状态'};
    body='<table class="m-table"><thead><tr>'+cols.map(c=>'<th>'+esc(headers[c]||c)+'</th>').join('')+'</tr></thead><tbody>'
      +a.example_rows.map(row=>'<tr>'+cols.map(c=>'<td>'+esc(row[c]||'')+'</td>').join('')+'</tr>').join('')
      +'</tbody></table>';
  }
  const modalBody=document.getElementById('m-body');
  if(modalBody) modalBody.innerHTML=body;
  document.getElementById('mbg').classList.add('on');
  document.getElementById('m-save').onclick=()=>{ document.getElementById('mbg').classList.remove('on'); };
}

function navTo(id){ cur=id; curTab='inputs'; expanded={}; localStorage.setItem('wb3_last',id); render(); }
function switchTab(t){ curTab=t; render(); }

// ── Main render ───────────────────────────────────────────────────────────────
function render(){
  renderSidebar(); renderDBar(); renderPhaseHeader(); renderContent();
  const pct=overallPct();
  document.getElementById('hdr-fill').style.width=pct+'%';
  document.getElementById('hdr-pct').textContent=pct+'%';
}

window.onload=()=>{
  const last=localStorage.getItem('wb3_last');
  if(last && (PHASES.find(p=>p.id===last)||last==='dov')) cur=last;
  render();
};
