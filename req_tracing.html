<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求追踪工作台 — 佛照 S/4HANA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--txt:#1e293b;--muted:#64748b;
  --navy:#0f172a;--blue:#1d4ed8;--font:'Segoe UI',system-ui,sans-serif;
  --L1:#0f766e;--L2:#b45309;--L3:#1d4ed8;--L4:#7c3aed;--L5:#be185d;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
/* sub-header strip */
#subhdr{background:#0f172a;color:#f8fafc;padding:6px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid #1e293b}
#subhdr-title{font-size:13px;font-weight:700}#subhdr-title span{color:#60a5fa}
#subhdr-tag{font-size:10px;color:#94a3b8;padding:2px 7px;border:1px solid #334155;border-radius:3px}
#subhdr-proj{flex:1;font-size:11px;color:#94a3b8}
/* nav tabs */
#nav{background:#1e293b;display:flex;padding:0 16px;gap:2px;flex-shrink:0}
.nav-tab{padding:10px 16px;font-size:12px;font-weight:500;color:#94a3b8;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap}
.nav-tab:hover{color:#e2e8f0}.nav-tab.on{color:#60a5fa;border-bottom-color:#60a5fa;font-weight:700}
/* layout */
#body{flex:1;padding:16px;overflow-y:auto}
/* summary strip */
#summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.sum-card{background:var(--card);border-radius:8px;padding:12px 14px;border-left:3px solid var(--c);display:flex;align-items:center;gap:10px}
.sum-icon{font-size:20px}.sum-info .v{font-size:20px;font-weight:800;color:var(--c)}.sum-info .l{font-size:10px;color:var(--muted)}
/* chain view */
#chain-view{display:flex;gap:0;overflow-x:auto;padding-bottom:8px}
.chain-col{min-width:200px;max-width:240px;flex-shrink:0}
.chain-hdr{padding:8px 12px;font-size:11px;font-weight:700;color:#fff;border-radius:6px 6px 0 0;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.chain-items{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;min-height:400px}
.chain-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;display:flex;gap:6px;align-items:flex-start}
.chain-item:last-child{border-bottom:none}
.chain-item:hover{background:#f8fafc}
.chain-item.active{background:#eff6ff;border-left:3px solid var(--blue)}
.chain-item.dimmed{opacity:.3}
.ci-badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.ci-name{font-size:11px;line-height:1.3;flex:1}
.ci-sub{font-size:10px;color:var(--muted);margin-top:2px}
.chain-arrow{display:flex;align-items:center;padding:0 6px;color:#94a3b8;font-size:18px;flex-shrink:0;align-self:center}
/* detail panel */
#detail{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:14px;min-height:120px}
#detail h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#detail .d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
#detail .d-item{background:#f8fafc;border-radius:6px;padding:10px 12px;border-left:3px solid var(--border)}
#detail .d-item .label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:4px}
#detail .d-item .value{font-size:12px;line-height:1.5}
/* forward/backward view */
.trace-view{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.trace-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.trace-hdr h3{font-size:13px;font-weight:700}
.trace-path{display:flex;align-items:center;gap:4px;padding:12px;background:#f8fafc;border-radius:6px;border:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap}
.tp-node{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;transition:opacity .1s}
.tp-node:hover{opacity:.85}
.tp-arrow{font-size:14px;color:#94a3b8}
.trace-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.trace-tag{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid transparent;transition:all .1s}
.trace-tag:hover{border-color:#94a3b8}
/* scenario manager */
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .12s}
.sc-card:hover{border-color:#94a3b8;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sc-card.selected{border-color:#7c3aed;background:#faf5ff}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.sc-id{font-size:10px;font-weight:700;color:var(--muted)}
.sc-sel{width:16px;height:16px;border-radius:3px;border:2px solid #d1d5db;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.sc-sel.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.sc-name{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:4px}
.sc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sc-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:#f1f5f9;color:var(--muted)}
.sc-owner{font-size:10px;color:var(--muted)}
.phase-badge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700}
.sev-高{background:#fee2e2;color:#b91c1c}
.sev-中{background:#fef9c3;color:#92400e}
.sel-count{background:#7c3aed;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:8px}
/* util */
.badge-p1{background:#7c3aed22;color:#7c3aed;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700}
.badge-p2{background:#f1f5f9;color:#64748b;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700}
.domain-badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.dom-业务架构{background:#fef3c7;color:#92400e}
.dom-数据架构{background:#dcfce7;color:#166534}
.dom-应用架构{background:#dbeafe;color:#1e40af}
.dom-技术架构{background:#f3e8ff;color:#6b21a8}
.empty-state{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.prio-高{background:#fee2e2;color:#b91c1c;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700}
.prio-中{background:#fef9c3;color:#92400e;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700}
.prio-低{background:#dcfce7;color:#166534;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700}
.hint{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:10px}
/* search bar */
.search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-bar input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none}
.search-bar input:focus{border-color:#60a5fa}
.search-bar select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:#fff;outline:none}
</style>
</head>
<body>
<div id="site-nav"></div>

<div id="subhdr">
  <div id="subhdr-title">🗺️ <span>需求追踪工作台</span></div>

<script>
const RAW={"work_packages": [{"id": "WP1", "name": "主数据MDG", "color": "#7c3aed", "icon": "🗄️", "owner": "班家亮", "budget": "80万", "status": "进行中"}, {"id": "WP2", "name": "PCE基础搭建", "color": "#0369a1", "icon": "🏗️", "owner": "Eviden", "budget": "120万", "status": "进行中"}, {"id": "WP3", "name": "FICO+Group Reporting", "color": "#b45309", "icon": "💰", "owner": "郭裕", "budget": "180万", "status": "进行中"}, {"id": "WP4", "name": "SD+信用管理", "color": "#0f766e", "icon": "📦", "owner": "陈雪星", "budget": "100万", "status": "计划中"}, {"id": "WP5", "name": "MM+PP+MRP", "color": "#15803d", "icon": "🏭", "owner": "杨晓超", "budget": "150万", "status": "计划中"}, {"id": "WP6", "name": "QM+EWM", "color": "#9a3412", "icon": "🔍", "owner": "杨晓超", "budget": "80万", "status": "计划中"}, {"id": "WP7", "name": "CPI集成", "color": "#6d28d9", "icon": "🔗", "owner": "Eviden", "budget": "90万", "status": "计划中"}, {"id": "WP8", "name": "DRC合规", "color": "#be185d", "icon": "⚖️", "owner": "陈宇清", "budget": "60万", "status": "计划中"}, {"id": "WP9", "name": "泰国+德国本地化", "color": "#92400e", "icon": "🌏", "owner": "陈宇清", "budget": "50万", "status": "规划中"}, {"id": "WP10a", "name": "二期 SAC", "color": "#475569", "icon": "📊", "owner": "郭裕", "budget": "TBD", "status": "规划中"}, {"id": "WP10b", "name": "二期HR统一改造", "color": "#334155", "icon": "👥", "owner": "HR", "budget": "TBD", "status": "规划中"}], "scenarios": [{"id": "S01", "name": "物料主数据治理", "owner": "班家亮", "selected": true, "wp": ["WP1"], "domain": "数据架构", "priority": "P1", "desc": "统一物料编码规则，建立MDG主数据治理流程，解决编码不一致导致的跨系统对账困难"}, {"id": "S02", "name": "销售运作计划SOP+主生产计划MPS建设", "owner": "杨晓超", "selected": true, "wp": ["WP5"], "domain": "业务架构", "priority": "P1", "desc": "建立S&OP集成计划体系，连接销售预测与生产计划，解决产销协同断层问题"}, {"id": "S03", "name": "MRP物料需求计划建设", "owner": "杨晓超", "selected": true, "wp": ["WP5"], "domain": "业务架构", "priority": "P1", "desc": "在S/4HANA中启用MRP Live，实现物料需求的自动化计算与采购触发"}, {"id": "S04", "name": "制造成本还原方案", "owner": "郭裕", "selected": true, "wp": ["WP3"], "domain": "业务架构", "priority": "P1", "desc"  "wp": "WP3"}, {"id": "A0058", "brief": "出口订单发货辅助表", "detail": "痛点：ZMRBI004报表仅支持单个销售订单查询仓位，且过账时需对物料逐个手动勾选，无法实现批量处理，操作繁琐、效率低下。\n需求：支持对多个销售订单同时进行仓位查询，并新增批量选择功能。", "opinion": "0705：对于自开发功能进一步核实，确定需求的合理性，载做判断", "dept": "高明仓库", "priority": "待定", "pain": ["P07"], "wp": "WP4"}, {"id": "A0059", "brief": "新物料质检视图自动校验", "detail": "痛点：新物料首次进仓/转卖工厂时，未维护质检视图依赖人工识别，存在漏维护风险。\n需求：新增自动拦截规则，在新物料首次进仓或转卖工厂时自动识别并拦截未维护质检视图的业务操作。", "opinion": "0705：除了增加批量检查的报表，还需要增加考核指标，对于未及时维护的岗位进行考核", "dept": "高明仓库", "priority": "待定", "pain": ["P09"], "wp": "WP6"}, {"id": "A0060", "brief": "物料仓库视图批量维护", "detail": "痛点：当前无物料主数据批量检查、仓库视图批量维护功能，大量物料处理时，效率低。\n需求：新增物料主数据批量检查与仓库视图批量维护功能，提升主数据运维效率。", "opinion": "0705：除了增加批量检查的报表，还需要增加考核指标，对于未及时维护的岗位进行考核", "dept": "高明仓库", "priority": "待定", "pain": ["P02"], "wp": "WP6"}, {"id": "A0061", "brief": "调拨/转卖物料文本信息自动同步", "detail": "痛点：物料转卖或调拨后，原始文本信息无法自动同步，需人工匹配对应修改，效率低且易产生数据不一致。\n需求：新增文本信息自动同步机制，消除人工操作风险。", "opinion": "0705：需要核实具体业务场景，结合物料编码确定", "dept": "高明仓库", "priority": "待定", "pain": ["P09"], "wp": "WP6"}, {"id": "A0062", "brief": "WMS公司间转卖自动过账产生的无效交货单处理", "detail": "痛点：在WMS公司间转卖（自动完成）业务中，常因物料锁定等原因导致过账失败，但交货单仍被保存并在SAP（VL06G）中可见，形成大量无效单据；且系统缺乏批量删除功能，无法高效清理，导致数据冗余\n需求：在公司间转卖自动过账场景中，过账失败的，系统应阻止交货单保存，另需在SAP系统中增加批量删除无效交货单的功能，支持按条件筛选并一键清除,帮我优化表述", "opinion": "0705：待决策", "dept": "高明仓库", "priority": "待定", "pain": ["P09"], "wp": "WP6"}, {"id": "A0063", "brief": "LB10/LU04 转储请求 FIFO 排序优化", "detail": "痛点：当前 LB10/LU04 转储请求界面因未按进仓日期排序，需人工逐条比对挑选下架对象，效率低且易选错。\n需求：优化系统取数与展示逻辑，按进仓日期从旧到新自动排序，以替代人工判断，确保转储作业严格执行 FIFO 规范。", "opinion": "0705：待决策", "dept": "高明仓库", "priority": "待定", "pain": ["P09"], "wp": "WP6"}, {"id": "A0064", "brief": "ZMR99-批量过账逻辑优化", "detail": "痛点：过账中，同一物料只要有人用，其他人都用不了。在SAP中，同一个物料只有一个人可以占用，即有人在用时，其他人是过不了账或开不了单的。\n需求：同时用相同物料，不会影响到相关联的操作。\n1、ZMR99-材料批量订单发料：过账的时候，车间仓或者检验也在操作，物料就会被锁定，系统就会出错，导致全部要手工下架411K和手工LB10下架 ，对于指定厂家要求的被锁定还要自己一个个查库位在下架 。在多订单共用…", "opinion": "0705：需要核定需求，再做出优化落地的策略", "dept": "高明仓库", "priority": "待定", "pain": ["P03", "P07", "P09"], "wp": "WP5"}, {"id": 据。现需要团队协助完成整体顶层架构梳理：\n1.基于行业、数字化管理标准及SAP系统管控逻辑，搭建适配我司经营模式的研产供销端到端整体理论业务架构，明确全流程顶层设计逻辑、各业务模块衔接关系、经营管控核心节点与管控标准。\n2.结合端到端业务架…", "opinion": "0706: 本期诊断咨询与SAP升级项目，会梳理佛照研产供销服的端到端流程，并分析职能边界和流程断点，", "dept": "企业管理部(品牌管理部)", "priority": "高", "pain": ["P09"], "wp": "待评估"}, {"id": "A0165", "brief": "梳理研产供销端到端标准业务流程", "detail": "为彻底解决现有业务流程碎片化、非标准化、线下流程与系统流程不匹配、各环节操作不统一、流程闭环性不足等问题，需要团队对公司全业务链路进行完整、系统化梳理：\n1.全面摸排公司现有研发、采购、供应链、生产制造、库存管理、销售履约、售后、结算等全链条现有业务流程，梳理现状痛点、断点、冗余环节、管控漏洞。\n2.结合SAP系统标准化流程、行业最佳实践及公司经营管理要求，重构并输出全套端到端标准化业务流程，包含…", "opinion": "在SAP系统实施产生的流程的基础上，进行拓展、调整，加入考核指标、配套管理制度", "dept": "企业管理部(品牌管理部)", "priority": "高", "pain": ["P02", "P09"], "wp": "WP5"}, {"id": "A0166", "brief": "非SAP外部系统改造方案及问题解决路径规划", "detail": "本次数字化转型以SAP为核心ERP基座，但公司现有多类外围业务系统、专项管理系统与SAP系统存在数据割裂、接口不打通、流程不联动、功能不匹配等问题，无法实现全链路数字化闭环。现需要团队针对性完成外部系统改造规划：\n1.全面盘点SAP ERP以外的所有外部关联系统现状，梳理各系统功能短板、数据痛点、对接壁垒、适配性问题，明确现有系统与SAP核心架构的冲突点及优化空间。\n2.结合整体数字化转型架构及S…", "opinion": "7370：本期SAP项目会统一规划各系统之间的主数据及交易数据的接口，并通过MDG和IS做集成。非核心外围系统的集成，会在数字化专心路线图中规划。", "dept": "企业管理部(品牌管理部)", "priority": "高", "pain": ["P06", "P10"], "wp": "待评估"}, {"id": "A0167", "brief": "项目实施要求", "detail": "本次SAP升级以及公司整体数字化转型诊断需紧密结合公司经营管理目标，兼顾规范性、实用性、前瞻性，既要完成现状诊断、架构梳理、流程标准化，也要保障所有方案、流程、系统改造内容可落地适配本次SAP实施项目，支撑公司实现业务标准化、管控精细化、数据一体化、经营数字化的整体转型目标。", "opinion": "流程制定过程中，会邀请企业管理部参与一起研讨完善流程", "dept": "企业管理部(品牌管理部)", "priority": "高", "pain": ["P10"], "wp": "待评估"}, {"id": "A0168", "brief": "产品维度主数据体系完善", "detail": "目前SAP导出的各类报表，如销售类，成本类，库存类等，除对应到各物料编码外，还需完善以下数据\n1.从产品类别维度，形成各品类，各系列的对应分类，而不是人为按照物料名称描述来判断物料编码的分类\n2.从产品生命周期管理的维度，结合产品迭代情况的数据勾稽，形成全新型、改进型产品的定义及标识\n3.从产品销售的维度，结合产品过往销售情况的数据勾稽，形成畅销品，滞销品的定义及标识", "opinion": "结合具体需要，落实到报表的取值维度", "dept": "企业管理部(品牌管理部)", "priority": "高", "pain": ["P02", "P07"], "wp": "WP3"}, {"id": "A0169", "brief": "统一新品认定标准，系统自动标识新品", "detail": "各部门对“新品”定义不统一，销售数据需人工逐一甄别。当前新品的销售数据的统计依赖人工校准，需先从SAP导出成品对应的研发BOM号，再交由工程师逐一甄别是否为新品。根本原因在于公司内部未形成统一的新品定义标准：高新项目时间、项目完结时间、规格完结时间、成品首次下单时间均可作为判定依据，各部门理解各异，缺乏共识。亟需明确新品的认定标准，消除部门间定义分歧。", "opinion": "0704：管理梳理，并修改新品相关报表的逻辑", "dept": "研究院", "priority": "高", "pain": ["P03"], "wp": "WP4"}, {"id": "A0170", "brief": "建立RD号/项目号与成品的关联映射，实现从研发项目到销售数据的全链路追溯", "detail": "当前SAP销售数据仅能追溯至成品编码及对应BOM号，不支持按高新项目号或二级项目号进行销售数据的检索与归集，无法满足从项目视角评估销售产出的管理需求。亟需建立RD号、项目号、BOM号与成品编码之间的统一关联映射表，实现从研发项目到销售终端的数据全链路贯通，为各级项目产出追溯提供准确高效的系统化支撑。", "opinion": "0704：解决研发出具的产品编号与生产中心出具的成品编号之间的系统数据验证", "dept": "研究院", "priority": "高", "pain": ["P03", "P09"], "wp": "WP4"}, {"id": "A0171", "brief": "二级项目研发费用归集缺乏自动化工具", "detail": "目前只有一级RD项目的研发费用在SAP系统通过RD号归集，而二级项目的费用都是靠人工统计和筛查", "opinion": "0701：先理清研发过程中的工时收集现状，后续研讨", "dept": "研究院", "priority": "高", "pain": ["P06"], "wp": "WP7"}, {"id": "A0172", "brief": "智能多维度物料检索，实现精准定位，减少重复创建。", "detail": "工程师检索SAP物料时，主要通过关键词搜索，经常无法精准匹配，转而新建物料，既增加冗余数据，又拖慢流程。建议开发高级检索页面，通过智能算法与多维度筛选条件，实现物料的精准筛选与快速定位。", "opinion": "0704：建立主数据维护的规范化标准，控制重码，查询也可以参照这个规范", "dept": "研究院", "priority": "高", "pain": ["P07"], "wp": "待评估"}, {"id": "A0173", "brief": "全局统一成本视图，屏蔽工厂差异，提供统一参考成本", "detail": "当前SAP各工厂的成本数据存在显著差异，建议在系统层面建立全局性的成本视图，对研产销关键角色屏蔽工厂级差异，统一显示经校准的参考成本或加权平均成本，从源头消除信息差，减少无效沟通与返工。", "opinion": "0704：需求合理性存疑，无脱离工厂视图的成本数据，但要探讨如何纠正工厂之间的不合理成本差异", "dept": "研究院", "priority": "中", "pain": ["P03"], "wp": "待评估"}, {"id": "A0174", "brief": "SAP周期价格与最新实际报价偏差大，需评估价格更新机制的优化方案", "detail": "研发工程师在开发阶段进行产品成本核算时，需参考SAP系统中的物料价格作为成本测算依据。然而，实际工作中普遍发现，由于物料最新采购日期距今过久等原因，SAP所维护的物料周期价格与供应商提供的实时报价之间存在明显偏差。", "opinion": "0701: 是否是系统内移动平均价和研发报价差异过大导致？", "dept": "研究院", "priority": "中", "pain": ["P04", "P08"], "wp": "WP3"}, {"id": "A0175", "brief": "实际采购价与初期核定价偏差大，缩短时间差或建立价格联动机制", "detail": "物料发布时虽已维护采购联络单，但该维护时间与首次正式下单日期有一定间隔，在此期间市场价格发生明显波动，导致实际采购价格与初始核定成本产生偏差。", "opinion": "0701: 定期招采询价，避免无效的僵尸价格", "dept": "研究院", "priority": "中", "pain": ["P08"], "wp": "待评估"}, {"id": "A0176", "brief": "同类信息查询结果不一致，统一查询口径，确保数据一致可信", "detail": "在SAP中查询同一类信息（如库存数据）时，不同端口（如采购和研发）存在多条可用的查询指令或事务代码。但实际操作中发现，由于查询条件、权限设置或数据源口径不同，这些指令返回的结果存在偏差。", "opinion": "0704：核对具体报表，校准取数逻辑", "dept": "研究院", "priority": "中", "pain": ["P07", "P10"], "wp": "WP5"}, {"id": "A0177", "brief": "物料供应商/价格信息在PLM审批通过后自动同步至SAP，取消二次录入", "detail": "当前物料发布流程：工程师在PLM提交物料编码及相关文档，审批通过后，编码自动发布到SAP，而供应商和价格信息需要材料专员和招采同事根据《采购联络单》文档到SAP手工维护。", "opinion": "0704：核对具体维护功能，理顺业务逻辑", "dept": "研究院", "priority": "高", "pain": ["P02", "P08"], "wp": "WP5"}, {"id": "A0178", "brief": "子物料逆向追溯成品BOM，输入子物料一键查看完整成品BOM树", "detail": "工程师在查询某一子物料所属成品的其他子物料时，无法通过该子物料一次性逆向追溯至成品并展开其全部下层BOM结构，需先反查成品，再从成品入口逐层查询下层物料，操作路径冗长且需多次切换查询界面。", "opinion": "0704：核对具体维护功能，优化报表逻辑", "dept": "研究院", "priority": "中", "pain": ["P03", "P07", "P09"], "wp": "WP5"}, {"id": "A0179", "brief": "物料变更前的引用BOM查询和自动展示", "detail": "当工程师对物料进行变更时，不知道哪些产品在用，因此亟需一种便捷的评估机制，能够在变更操作前快速查询并展示该物料所属的全部BOM及其层级关系，以便工程师评估风险，同时应加强审批环节。", "opinion": "0704：核对具体维护功能，理顺业务逻辑", "dept": "研究院", "priority": "中", "pain": ["P03", "P07"], "wp": "WP5"}, {"id": "A0180", "brief": "SAP界面直接预览PLM文档", "detail": "工程师在SAP系统中查询物料时，需频繁切换至PLM系统查阅对应的规格书与图纸。建议在SAP查询结果页直接关联并预览PLM中的文档，让工程师无需脱离当前页面即可获取技术资料，从根本上消除系统割裂感，缩短查询周期。", "opinion": "0704：图档管理在SAP制作接口，开发工作量较大，建议放到后期实施", "dept": "研究院", "priority": "中", "pain": ["P07"], "wp": "WP5"}, {"id": "A0181", "brief": "PLM界面集成SAP价格和库存数据", "detail": "工程师在PLM系统进行BOM设计与成本核算时，无法直接查看物料的成本单价及库存信息，须切换至SAP系统另行查询。建议在PLM物料信息界面中集成SAP物料的成本单价、库存等主数据。", "opinion": "0704：做好接口，两端开发，在PLM实现", "dept": "研究院", "priority": "中", "pain": ["P02", "P03", "P04"], "wp": "WP3"}, {"id": "A0182", "brief": "研发BOM与生产BOM双向同步，生产端修改自动同步并通知研发", "detail": "工程师在PLM系统完成设计BOM并发布至SAP后，车间会根据实际物料供应、质量等因素在SAP中对BOM进行物料替换或结构修改，上述变更无任何机制同步回传至PLM或知会研发人员，研发端对生产端的BOM修改情况完全不知情。设计BOM与生产BOM的差异严重影响到后续的产品改型设计、成本精准核算及质量反向追溯。建议建立研发-生产BOM双向同步机制和变更通知。", "opinion": "0704：做好接口，实现信息同步或者状态标识，主要在PLM中开发", "dept": "研究院", "priority": "中", "pain": ["P03", "P09"], "wp": "WP3"}, {"id": "A0183", "brief": "SAP与PLM一键跳转+单点登录，物料维度一键直达，免二次登录", "detail": "当前工程师需在SAP和PLM系统之间频繁切换且反复登录，效率低下。建议在物料维度建立双向快速跳转机制，实现从任意系统一键直达另一系统的同一物料页面，无需用户手动输入或二次搜索，并通过单点登录实现免二次认证。", "opinion": "0704：理顺业务需求涉及的同步页面，确定哪些需求本期会涉及，哪些后续实现；软件统一门户管理", "dept": "研究院", "priority": "中", "pain": ["P03"], "wp": "WP5"}, {"id": "A0184", "brief": "PLM搭建完BOM自动滚算成本", "detail": "建议在PLM系统中开发物料BOM成本自动核算功能，工程师导入或完成BOM结构搭建后，系统根据BOM中各物料编码自动获取SAP中维护的当前有效成本单价和库存量（供参考），按BOM层级结构逐级滚算，即时生成完整的物料成本BOM，无需额外的手工核算操作。", "opinion": "0704：物料标准成本核算（会计视图维护计划价格（谁来维护：招投标中心、供应链中心）；BOM要完整）", "dept": "研究院", "priority": "低", "pain": ["P02", "P03"], "wp": "WP3"}, {"id": "A0185", "brief": "PLM与SAP物料状态同步，任一系统修改，另一系统自动同步", "detail": "当前PLM与SAP系统中物料状态维护采取各自独立的人工操作方式，两系统间缺乏实时同步机制。曾引入审批流以规范状态变更，但因物料创建/变更端口分散，审批人无法根据物料所属业务域准确判定，实际操作中易发生审批路径错误或流转停滞，导致该方案难以落地。", "opinion": "0704：主数据治理问题", "dept": "研究院", "priority": "低", "pain": ["P02"], "wp": "WP5"}, {"id": "A0186", "brief": "历史物料描述格式清洗", "detail": "大量历史物料的物料描述存在格式不规范、PLM系统与SAP系统未保持一致等问题，需对可修正的描述则依照统一标准模板进行批量刷新，对无法校正或无效的描述予以冻结。", "opinion": "0704：主数据治理问题", "dept": "研究院", "priority": "高", "pain": ["P06"], "wp": "WP7"}, {"id": "A0187", "brief": "供应商名称模糊检索优化（支持简称/不规范写法）", "detail": "在新增供应商时，通常通过关键字快速检索系统内已有记录，然而由于供应商名称可能存在不标准写法、简称或历史录入偏差，导致搜索结果为空，且操作人员又不清楚该供应商对应的编码，需线下与招投标进行人工确认，效率低下。", "opinion": "0704：主数据治理问题", "dept": "研究院", "priority": "低", "pain": ["P03"], "wp": "WP5"}, {"id": "A0188", "brief": "供应商重复维护允许覆盖确认弹窗", "detail": "在SAP系统维护供应商时，操作人员常因逐一核对现有信息步骤繁琐而跳过二次确认环节，直接发起新的维护操作。若该供应商已在系统中存在记录，重复维护将触发系统报错，导致操作中断。建议优化系统逻辑，允许以新录入的供应商信息覆盖原有记录，或提供“覆盖确认”弹窗作为快捷处理方式，从而避免重复报错，减轻操作负担。", "opinion": "0704：供应商主数据维护流程", "dept": "研究院", "priority": "中", "pain": ["P03"], "wp": "WP5"}, {"id": "A0189", "brief": "SAP首页增设“研发查询”专属模块", "detail": "SAP首页的查询入口缺乏引导，且多数查询功能与研发业务无关却被一并展示，造成视觉冗余与操作干扰。建议对界面进行简化重构，确保查询功能描述直观明确。同时在首页增设“研发查询”专属模块，集中放置研发场景常用的查询功能。", "opinion": "0704：确定具体需求和场景，优化报表查询", "dept": "研究院", "priority": "中", "pain": ["P07"], "wp": "WP5"}, {"id": "A0190", "brief": "物料查询按价格/库存智能排序推荐", "detail": "工程师在查询可用物料时，面对众多符合条件的物料，缺乏科学的筛选与推荐依据。只能凭经验或逐一查询价格、库存等信息后自行判断，选料过程耗时且易受个人经验局限。建议在物料查询结果页面引入智能推荐机制，系统可基于采购价格、历史订单、现有库存量等关键要素，对可用物料进行综合评估与自动排序，优先推荐成本最优、供应稳定或库存充足的物料。", "opinion": "0704：确定具体需求和场景，优化报表查询", "dept": "研究院", "priority": "中", "pain": ["P07", "P08"], "wp": "WP3"}, {"id": "A0191" "], "wp": "WP3"}, {"id": "A0381", "brief": "皓徕特贸易流程简化", "detail": "现状痛点：当前集团内部公司间转卖业务流程层级多，公司间转卖流程繁琐，现阶段皓徕特业务模式已转型为贸易型企业，内部跨公司转卖业务交易量大幅增加，原有复杂流程造成单据处理效率低。\n需求解决：针对皓徕特贸易化业务，简化公司间转卖业务中间操作流程，压缩单据流转节点，提升内部跨公司转卖业务处理与效率。", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P04"], "wp": "WP3"}, {"id": "A0382", "brief": "全链路报关流程打通", "detail": "现状痛点：下单 - 仓库 - 财务 - 物流 - 关务数据割裂，无统一单据关联，仅合同号关联报关单，一报关单对应多合同，无发票号匹配。\n需求解决：全流程单据打通，实现各环节单号互相关联，报关无需第三方系统对接。", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P06"], "wp": "WP3"}, {"id": "A0383", "brief": "应收逾期分级权限查看", "detail": "现状痛点：应收逾期、回款明细仅财务可查看，业务、部门负责人、销售总监无法实时掌握客户欠款情况，只能依赖财务定期下发报表，信息滞后，不能提前介入催收。\n需求解决：客户逾期账款、收款数据分级开放权限：业务员→部门负责人→销售总监，分级查看对应管辖客户数据", "opinion": "0712：\n贾奋明：\n0716：前面有类似问题", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P07", "P10"], "wp": "WP3"}, {"id": "A0384", "brief": "产品质量追溯归档", "detail": "现状痛点：产品质量反馈，来料检查和整灯生产过程出现不良的，要让步接收不良，相关质量问题、责任供应商、对应BOM版本信息没有统一归档记录。\n需求解决：SAP 统一归档质量不良记录，一键关联对应供应商、BOM 版本，支撑研发优化设计规避同类问题", "opinion": "0716:  来料检验可以通过检验批找见采购订单，找见本次来料检验不合格，追溯到供应商质量问题 （需要N+2天配料到车间，手工台账记录供应商原材料批次）         \n过程检验（IPQC ），只能判断本次加工过程中的质量问题，不能确定是哪个供应商发的物料导致质量问题，如果要追溯到供应商需要做条码…", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P03", "P09"], "wp": "WP5"}, {"id": "A0385", "brief": "订单交期、物料进度追踪", "detail": "希望SAP能从订单或样板单输入系统到完成入仓有个过程管控，业务能使用某个功能可以监测到各个环节完成时间。这样可以免去业务不断与车间确认订单和样板来料状况和完成时间。并且需要SAP 设个简单操作能一键输出各个客户近不同时间业务成交数量金额及品类。", "opinion": "Leadtime需要梳理后导入SAP系统", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P08"], "wp": "WP4"}, {"id": "A0386", "brief": "价格字段精度升级", "detail": "现状痛点：SAP现有销售单价字段小数点只有6位，无法匹配客户高精度计价标准，计算产生尾差。\n需求解决：所有价格字段统一扩展至 8 位小数，满足客户高精度计价需求。", "opinion": "0716：技术问题", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P08", "P10"], "wp": "WP4"}, {"id": "A0387", "brief": "客户名称完整展示", "detail": "现状痛点：销售订单抬头客户名称显示不全，与发票名称（可以显示）不一致，需反复和客户解释。\n需求解决：扩大客户名称展示字段长度，销售订单抬头完整显示客户全称，与发票名称保持一致", "opinion": "0716：技术问题", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P04"], "wp": "WP3"}, {"id": "A0388", "brief": "订单交期、物料进度追踪", "detail": "现状痛点：下订单后无交期反馈、物料追踪机制，临近出货才暴露物料 / 包材问题，无缓冲协商时间。\n需求解决：新增订单交期预警、物料全流程追踪看板，提前同步缺料风险，预留客户沟通缓冲期。", "opinion": "0701：缺料（物料齐套检查）需要在销售订单确认阶段或生产计划阶段做物料齐套检查", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P03", "P07"], "wp": "WP4"}, {"id": "A0389", "brief": "客户费用模块恢复启用", "detail": "现状痛点：国外品牌经销商客户的返点、市场费用、不良品等费用曾在SAP进行抵扣管理，即在客户每次出货时抵扣出货金额的5%，2022年该功能被调整下架，交回业务部门自行人工记账管理，效率低，容易出错。\n需求解决：重新启用 SAP 客户费用自动抵扣功能，减少人工做账可能存在的失误，提升客户费用的管理效率和精确度。", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "低", "pain": ["P08"], "wp": "WP4"}, {"id": "A0390", "brief": "外购研发下单周期问题", "detail": "痛点：外购产品订单从下单到供应商收到订单周期较长，当中涉及送样、编码制定、采购定价等一系列流程导致供应商排产时间不足影响交期，研发编码慢，导致无法下单给供应商。\n需求解决：提高外购编码的效率，加快外购采购订单下发速度，缩短订单从内部发起到供应商收单的全周期。", "opinion": "0710：物料编码需要归口和时间节点管理", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P03", "P08"], "wp": "WP5"}, {"id": "A0391", "brief": "多组织报表合并", "detail": "现状痛点：SAP系统多组织分散（佛熙2000、平台电商6000、皓徕特9500、泰国9800，渠道多段编码如11 12 14 15等），数据分裂，跨组织统计困难，数据无法统一汇总，报表拆分工作量大，业务分析效率低。\n需求解决：统一组织架构主数据，合并多组织统计维度，实现一键跨公司数据汇总，减少报表拆分工作量。", "opinion": "", "dept": "国际事业部（佛照光电）", "priority": "低", "pain": ["P01", "P02", "P05"], "wp": "WP3"}, {"id": "A0392", "brief": "客户主数据精细化权限", "detail": "现状痛点：事务VD01或XD01维护客户主数据仅基础字段，缺少主管或者部长绑定，涉密客户资料全员可见（涉密资料没有维护在SAP，手工登记），权限管控缺失。\n需求解决：新增业务主管绑定字段，精细化权限分组，涉密字段单独授权查看。", "opinion": "0716：可能需要增加销售组织或者订单类型", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P02", "P10"], "wp": "WP4"}, {"id": "A0393", "brief": "物料会计视图审批简化", "detail": "现状痛点：新增物料会计视图维护多级审批，整体周期过长，影响SAP需求录入周期长，需催促且频率高。\n需求解决：在SAP组收到订单之前，销售价格和成本都已经在OA审批过，无需再重审，希望简化流程，可以直接提交给财务维护会计视图。", "opinion": "0716：方案待定，统计和权限需求", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P08"], "wp": "WP3"}, {"id": "A0394", "brief": "PLM 物料新增优化规则", "detail": "现状痛点：PLM 物料编码新增、变更同步至 SAP 的操作流程步骤繁杂，系统编码拆分规则颗粒度过细，字段繁多，操作人员录入与核对时极易遗漏参数、填错信息，造成主数据同步失败、物料编码异常，反复返工核对增加工作量。\n需求解决：简化 PLM 与 SAP 之间物料编码新增、变更同步操作步骤，优化物料编码展示规则，减少冗余细分字段，降低人工录入与核对失误率，提升物料主数据同步效率。", "opinion": "0710：需求： PLM 与 SAP 之间物料编码新增、变更同步操作步骤，优化物料编码展示规则\n建议：物料编码通过PLM与SAP之间的接口，同步更新\n出口的物料编码能否重复使用；因包装和LOGO不同编制不同的代码", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P02", "P06"], "wp": "WP5"}, {"id": "A0395", "brief": "退货 / 调拨单据关联原订单", "detail": "现状痛点：退货订单、客户调拨单据目前是重新下一个新的需求，车间进仓的是旧需求，无法关联原有销售需求，业务报表数据难以区分。\n需求解决：单据新增原订单关联字段，支持由原销售单一键生成退货 / 调拨单，报表自动区分业务类型，往来数据自动抵消核算。", "opinion": "0712：\n贾奋明：\n0716：成本穿透相关问题", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P07", "P09"], "wp": "WP3"}, {"id": "A0396", "brief": "单价小数位自动调整", "detail": "现状痛点：销售需求和销售订单，物料单价保留3位小数点以上的，需逐一点击订单的每一行项目去手上填上小数单位，操作繁琐耗时，效率低。（如0.001，要先输入0.01，单位要双击点到另一个页面输入10）。\n需求解决：价格字段统一自动规整小数格式，无需逐行手动调整。", "opinion": "0712：\n贾奋明：\n0716：退货区分来源，前面125有类似问题", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P08"], "wp": "WP4"}, {"id": "A0397", "brief": "同客户加单自动分单开票风险", "detail": "现状痛点：销售订单已经加上了国家后，同柜出的加单，系统自动拆分单据独立过账，生成多张单号，财务开票风险高，只能把原来做好的销售订单删除重做，工作量翻倍。\n需求解决：同一客户、同一国家加单合并至同一销售订单过账，避免拆分多单号。", "opinion": "0712：\n贾奋明：\n0716：技术问题", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P01"], "wp": "WP3"}, {"id": "A0398", "brief": "生产车间名称标准化带出", "detail": "现状痛点：销售需求界面生产车间名称全程手工录入，无标准化选项，名称录入容易出现不统一，生产统计报表拆分困难。\n需求解决：配置标准化车间主数据，单据录入自动带出标准车间名称，禁止自由手工录入", "opinion": "Z开发定制需要优化", "dept": "国际事业部（佛照光电）", "priority": "低", "pain": ["P02", "P07"], "wp": "WP4"}, {"id": "A0399", "brief": "财务报表补充业务员维度", "detail": "现状痛点：事务码 ZFR11 明细报表、财务专用未开票明细页面均未展示对应业务员信息，报表导出后需人工跨表匹配补充人员，月度出货率核算需多个界面整合开票、未开票数据，全程手工汇总，操作效率低下，且人工匹配整合过程易出现数据错配、统计偏差，影响月度出货率核算准确性。\n需求解决：所有开票、未开票明细报表增加客户对应的业务员名字，导出直接带出人员信息，省去导出后手工匹配人员的重复工作。", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "低", "pain": ["P07"], "wp": "WP3"}, {"id": "A0400", "brief": "销售订单 PDF 打印优化", "detail": "痛头现状：ZFR10打印页面，仅支持PDF单页逐张导出，无法批量或者整单导出，另外皓徕特订单无法直接导出PDF，仅能通过报表输出，而且报表带出来的PO只能显示一个，与实际不一致，实际的销售订单是对应多个PO号。\n需求解决：支持批量导出整单PDF，ZSR10增加皓徕特订单9500打印，与佛照订单2000权限一致。", "opinion": "0712：\n贾奋明：\n0716：看演示再定方案", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P07", "P10"], "wp": "WP4"}, {"id": "A0401", "brief": "多 PO 可视化展示", "detail": "现状痛点：销售订单VA01参考多个销售需求的PO号过来合成一张销售订单出货，销售订单直观界面明细那里只显示一个PO号，无法同时显示多个PO号，导致核对PO号要依靠打印报表。\n需求解决：主界面明细新增 PO 展示区域，多 PO 分行展示，支持筛选、导出，无需打印单据核对", "opinion": "0712：\n贾奋明：\n0716：需求有冲突，要么不合并，要么一对一产生SO", "dept": "国际事业部（佛照光电）", "priority": "中", "pain": ["P07"], "wp": "WP4"}, {"id": "A0402", "brief": "销售地区字段标准化", "detail": "现状痛点：销售订单的销售地区字段填写前后不一致，触发财务开票校验拦截，无法正常开具发票，需要手工单个修改，影响效率。\n需求解决：统一销售地区增加销售订单地区字段录入校验或者自动标准化转换功能，杜绝字段填写不一致问题，避免开票校验拦截，减少手工改单工作量，保障开票流程顺畅。", "opinion": "0712：\n贾奋明：\n0716:需要用户演示问题再定夺", "dept": "国际事业部（佛照光电）", "priority": "低", "pain": ["P03"], "wp": "WP3"}, {"id": "A0403", "brief": "成套 BOM 成本管理", "detail": "现状痛点：无成套BOM成本查询导出功能，材料、制造、包装成本分散，需人工汇总核算，成本更新依赖手工操作。\n需求解决：输入项目号一键查询、导出整套 BOM 完整成本（材料 + 制造 + 包装）；系统定时自动重算更新标准成本", "opinion": "BOM的准确性、完整性检查需要成立主数据组归口管理和时间节点管理\n跨公司间，成本穿透问题", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P03", "P04", "P07"], "wp": "WP3"}, {"id": "A0404", "brief": "货源清单批量维护", "detail": "现状痛点：当前仅支持单条物料逐一维护供应商货源清单，物料、供应商批量维护无入口，采购主数据维护工作量大、效率低下。\n需求解决：SAP新增批量维护入口，支持多物料批量绑定多个供应商货源清单", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P02"], "wp": "WP5"}, {"id": "A0405", "brief": "PLM 与 SAP 全链路打通", "detail": "现状痛点：PLM 研发立项、研发 BOM、生产 BOM、车间生产、成品出货各环节系统数据相互独立，未打通全自动同步机制，各阶段数据需要人工导出，缺少统一数据源。\n需求解决：实现 PLM 与SAP打通功能，从PLM的研发立项-研发BOM-车间生产成品BOM-出货数据，全链条贯通，方便数据抓取和分析。", "opinion": "0701：PLM研发项目不在PLM管理，通过研发工单在SAP管理，SAP系统物流和生产、财务是数据打通的。", "dept": "国际事业部（佛照光电）", "priority": "高", "pain": ["P03"], "wp": "WP4"}, {"id": "A0406", "brief": "ZMR51 物料仓位查询", "detail": "建议增加采购组和供应商查询栏，便于查询各自采购物料的库存明细。查询成品库存增加业务员，无需再用ZPR105导数据来匹配人员名单。", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "待定", "pain": ["P07"], "wp": "WP5"}, {"id": "A0407", "brief": "ZPR61 - 采购申请到货查询", "detail": "采购员建议按用户账号锁定自己所需的布局，无需因他人改动又得重新调整", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "待定", "pain": ["P07"], "wp": "WP5"}, {"id": "A0408", "brief": "ZPR105 - 出口订单完成情况统计汇总表", "detail": "此列生产数量只代表车间收货完成，无法体现是否进仓，销售端能否发货？", "opinion": "0712：\n贾奋明：", "dept": "国际事业部（佛照光电）", "priority": "待定", "pain": ["P07"], "wp": "WP4"}, {"id": "A0409", "brief": "渠道结构与经销商分级管理", "detail": "调研问题：目前商用渠道结构是怎样的？经销商是如何分级管理的？\n现场反馈：目前经销商有不同层级，包括一级、二级经销商，管理方式比较粗放，缺乏系统化的分级标准和对应政策。\n核心判断：渠道结构不清晰，经销商分级管理缺乏标准，导致渠道政策执行不一致，资源分配不合理。\n管理影响：影响渠道效率，难以针对不同层级经销商制定差异化政策，不利于渠道深耕和精细化管理。", "opinion": "需企业归口部门定义和明确，后续确定系统实现内容。\n0715：需要进一步细化需求，额度要实现渠道维度管理，最好CRM做新的规划，三年规划讨论，CRM暂时只有商机管理", "dept": "商用事业部（智城科技）", "priority": "中", "pain": ["P07"], "wp": "待评估"}, {"id": "A0410", "brief": "信用管理与应收账龄统计", "detail": "调研问题：目前客户信用管理是怎么做的？应收账龄统计是否准确？\n现场反馈：信用管理主要靠人工控制，系统中有信用额度但执行不严格；应收账龄统计存在偏差，与财务数据对不上。\n核心判断：信用管理体系不完善，应收账龄统计不准确，存在坏账风险。\n管理影响：可能导致应收账款逾期增加，资金周转效率降低，增加财务风险。", "opinion": "需规划同事先明确“信用管理管理在CRM实现，还是SAP SD实现”，在此基础上细化SAP项目实现内容和上线计划。\n0715：跟前面需求重叠", "dept": "商用事业部（智城科技）", "priority": "中", "pain": ["P09"], "wp": "WP3"}, {"id": "A0411", "brief": "直投订单流程与样品管理", "detail": "调研问题：直投工程订单的流程是怎样的？样品如何管理？\n现场反馈：直投订单流程比较特殊，需要单独处理；样品管理混乱，没有专门的样品库，样品出入库不规范。\n核心判断：直投订单流程不标准，样品管理缺乏规范，影响订单交付效率和成本控制。\n管理影响：样品成本难以核算，直投订单交付周期长，客户满意度受影响。", "opinion": "需进一步明确业务场景，再定义样品归责\n0715：同上，需要专项讨论", "dept": "商用事业部（智城科技）", "priority": "低", "pain": ["P03"], "wp": "WP3"}, {"id": "A0412", "brief": "交期确认与客诉问题", "detail": "调研问题：订单交期如何确认？客诉处理流程是怎样的？\n现场反馈：交期确认不准确，经常出现延期；客诉处理流程不规范，缺乏系统记录和跟踪。\n核心判断：交期管理能力不足，客诉处理缺乏系统化管理，影响客户满意度。\n管理影响：客户投诉率高，订单交付不及时，可能导致客户流失和品牌形象受损。", "opinion": "0701: 订单交期管理可以由SAP承接，客诉流程原则上应该由CRM或其他专业客户服务系统承接", "dept": "商用事业部（智城科技）", "priority": "高", "pain": ["P09"], "wp": "WP4"}, {"id": "A0413", "brief": "定价与折扣体系管理", "detail": "调研问题：产品定价策略是怎样的？折扣体系如何管理？\n现场反馈：定价比较灵活，不同客户折扣不同，主要靠人工审批，系统中价格维护比较繁琐。\n核心判断：定价与折扣管理缺乏系统化，审批流程不规范，价格执行难以监控。\n管理影响：可能导致价格体系混乱，利润水平难以控制，内部管理风险增加。", "opinion": "需企业先行制订和明确产品定价策略，再通过SAP标准定价功能实现管控。\n针对个别定价，可以通过OA等平台实现审批，具体实现场景需进一步讨论。\n0715：需要进一步讨论", "dept": "商用事业部（智城科技）", "priority": "中", "pain": ["P08"], "wp": "WP3"}, {"id": "A0414", "brief": "库存报表与数据治理", "detail": "调研问题：库存报表是否准确？数据质量如何？\n现场反馈：库存报表数据  "priority": "高", "pain": ["P08"], "wp": "WP4"}, {"id": "A0458", "brief": "zsr04订单号输入", "detail": "痛点：需先在界面输入数字，才能按多项的位置输单号\n需求：改为空白就直接按多项选择", "opinion": "0630：请提供TCODE或SAP界面截图", "dept": "家用事业部", "priority": "高", "pain": ["P08"], "wp": "WP4"}, {"id": "A0459", "brief": "区分生成的订单号", "detail": "需求：商城生成的单号，禅昌/高明能否区分一下，比如禅昌7开头，高明8开头，容易区分对应公司的订单号", "opinion": "0715：要看系统实际数据再确定", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "WP4"}, {"id": "A0460", "brief": "增加订单折扣位置", "detail": "痛点：政策越来越多，订单上可以用来折扣的位置不够用；\n需求：增加订单折扣位置(见图)", "opinion": "0715：最好调整管理方式来解决", "dept": "家用事业部", "priority": "待定", "pain": ["P08"], "wp": "WP4"}, {"id": "A0461", "brief": "增加批量折扣奖励的功能", "detail": "痛点：折奖励需进入每张订单\n需求：开发辅助表格，填写订单号及奖励比例，实现可批量导入折扣。（可与下文促销辅助表需求放在一起）", "opinion": "", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "WP4"}, {"id": "A0462", "brief": "实现促销政策开单自动化", "detail": "痛点：\n目前每月的促销，除了特价开单及奖励后补，其他均通过手动开单折扣，效率慢且易出错；\n需求：\n促销政策类型有：满减、满赠、满折、多档一口价等；规则设置：支持促销互斥、指定叠加、全局叠加三种模式；可选是否计入销售业绩或返利计算。\n1、期望实现：通过在系统中设置规则，客户下单时可自动计算出折扣金额及实际应付金额；同时做到提醒客户加量可达到对应促销档次。\n2、过渡阶段，开发辅助表，实现可批量订单（填…", "opinion": "0701：1、需要对现有功能及开发增强进行详细了解\n            2、梳理现有方案的合理性与系统BUG\n0715：专项讨论", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "待评估"}, {"id": "A0463", "brief": "加速系统运行", "detail": "痛点：\n1、有时sap会加载不出页面，卡顿很久；并且有时页面会强制结束运行，要重新输入密码再进入；\n2、ZSR31导折算单订单很慢；商城、SAP一到月底冲任务就卡！\n需求：\n解决导数跨度较大加载过慢或强制结束的问题", "opinion": "0630：SAP数据库访问的性能问题待评估", "dept": "家用事业部", "priority": "高", "pain": ["P08"], "wp": "WP4"}, {"id": "A0464", "brief": "改进功能", "detail": "需求：\n1、SAP一次性打开页面建议增加至10个。\n2、增加输入错误次数-10次", "opinion": "0630：1.云版本，这个问题可以解决；\n2.请提供详细说明", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "WP4"}, {"id": "A0465", "brief": "改进功能", "detail": "痛点：复制内容，要慢慢拖动全部才能复制齐全。\n需求：可以直接复制全部数据。", "opinion": "0630：SAP系统标准功能，不可以修改", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "WP4"}, {"id": "A0466", "brief": "改善删奖励功能", "detail": "痛点：订单直接删开单奖励，会导致ZSR117奖励丢失；\n需求：修改该功能，可直接删除奖励，不影响ZSR117报表统计。", "opinion "opinion": "0715：需要了解进更详细需求细节", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "WP4"}, {"id": "A0476", "brief": "应收账款", "detail": "痛点：\n目前是人工做流水账，助销自行计算应收数据、逾期金额及利息等\n需求：\n开发查询报表，关联银行到款数据，系统可按已打出库单计算借方。\n1、可查询到经销商实时的开单/到款/结余明细等；\n2、维护客户固定放账/临时放账等信息，可查询客户可用信用额度", "opinion": "0715：从FICO现存报表拷贝，加上渠道维度统计数据", "dept": "家用事业部", "priority": "中", "pain": ["P03", "P07"], "wp": "WP3"}, {"id": "A0477", "brief": "开发物流订单跟踪表", "detail": "痛点：\n目前是通过仓库提供表格查询是否已发货\n需求：\n订单跟踪表：客户或助销可以通过订单+产品跟踪表来跟踪订单的发货状态；", "opinion": "0715：放到三期，现在拿不到物流数据", "dept": "家用事业部", "priority": "中", "pain": ["P07"], "wp": "WP4"}, {"id": "A0478", "brief": "权限管理", "detail": "人员调动后，相应的SAP权限应及时调整，避免跨事业部有访问权限。需不定期清理相关权限。", "opinion": "0715：权限分配到岗位，而不是人，否则人员变动后影响使用", "dept": "家用事业部", "priority": "中", "pain": ["P10"], "wp": "WP4"}, {"id": "A0479", "brief": "产品完成报表需求", "detail": "进货数据形成报表：支持多级品类分级统计\n优化进货数据统计逻辑，系统需支持产品“大类、品类、系列、W数”等分级管理，实现全国、区域、省份、经销商等维度的进货数据按品类汇总及查询。通过分级品类数据，精准分析经销商品类进货结构，识别品类铺货缺口与优势品类，为货源调配、品类规划及新品推广提供数据支撑。", "opinion": "0715：报表需求", "dept": "家用事业部", "priority": "中", "pain": ["P07"], "wp": "WP4"}, {"id": "A0480", "brief": "进销存数据管理", "detail": "1、库存数据：完善库存结构及金额统计维度\n扩充库存数据统计维度，系统需自动统计展示各经销商库存品类、库存数量、单品库存金额、整体库存金额及库存周转时长。通过量化库存结构数据，精准判断库存合理性，快速筛选积压、滞销、呆滞货品，支撑滞销清理、库存调优工作，降低渠道资金占用，提升库存周转效率。\n2、出货数据：细化终端出货明细台账\n完善经销商出货明细台账，系统需完整记录下沉至各五金终端的出货数据，包含出货…", "opinion": "0715：需要专项讨论，关乎合规性问题", "dept": "家用事业部", "priority": "中", "pain": ["P03"], "wp": "WP5"}, {"id": "A0481", "brief": "商城的库存数显示", "detail": "目前商城只显示总库存数，导致有些不可销售库位也显示有货可下单销售，为避免客户误会及造成冲单麻烦，建议跟SAP同步按库位显示库存数量", "opinion": "0707：\n商城功能改造，与SAP集成\n0715：库存管理需要改进，是一个重要的功能性需求，现在的管理方法可能不能实现", "dept": "家用事业部", "priority": "中", "pain": ["P08"], "wp": "WP4"}, {"id": "A0482", "brief": "不同工厂之间转卖", "detail": "目前自产生产和销售在不同工厂的产品转卖人工操作耗时较长，建议建立了销售转卖的产品，可实现自动转卖。", "opinion": "0707：\n跨公司销售的优化\n0715：需要讨论怎么管理库存的问题", "dept": "家用事业部", "priority": "高", "pain": ["P08"], "wp": "WP4"}, {"id": "A0483", "brief": "产品库存/账龄/未清显示", "detail": "目前没有一个SAP报表可显示全部产品库存/账龄/未清/销售数量，对于 const WP=RAW.work_packages, SC=RAW.scenarios, AG=RAW.arch_gaps, PP=RAW.pain_points, SR=RAW.sample_reqs;

// state
let view='chain', sel={layer:null, id:null};
const DOMAIN_COLOR={'业务架构':'#b45309','数据架构':'#15803d','应用架构':'#1d4ed8','技术架构':'#7c3aed'};
const LAYER_COLOR={'L1':'#0f766e','L2':'#b45309','L3':'#1d4ed8','L4':'#7c3aed','L5':'#be185d'};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function switchView(v){ view=v; sel={layer:null,id:null};
  document.querySelectorAll('.nav-tab').forEach((t,i)=>{
    t.classList.toggle('on', ['chain','forward','backward','scenario','reqs'][i]===v);
  }); render(); }

function selectItem(layer, id){
  if(sel.layer===layer && sel.id===id){ sel={layer:null,id:null}; } else { sel={layer,id}; }
  render();
}

// ── lookup helpers ─────────────────────────────────────────────────────────
function reqsByPain(pid){ return SR.filter(r=>r.pain.includes(pid)); }
function painsByGap(gid){ return PP.filter(p=>p.gaps.includes(gid)); }
function gapsByScenario(sid){ return AG.filter(g=>g.scenarios.includes(sid)); }
function wpsBySc(sid){ const s=SC.find(x=>x.id===sid); return s?(s.wp||[]).map(w=>WP.find(x=>x.id===w)).filter(Boolean):[]; }
function scByWp(wpid){ return SC.filter(s=>(s.wp||[]).includes(wpid)); }
function gapsByDomain(dom){ return AG.filter(g=>g.domain===dom); }

// ── summary strip ──────────────────────────────────────────────────────────
function renderSummary(){
  const cards=[
    {c:'#0f766e',icon:'📋',v:'555',l:'原始需求总条数'},
    {c:'#b45309',icon:'🔍',v:'18',l:'业务痛点归纳'},
    {c:'#1d4ed8',icon:'🏛️',v:'10',l:'架构差距识别'},
    {c:'#7c3aed',icon:'🎯',v:'16 (聚焦9个场景)',l:'高价值解决方案'},
    {c:'#be185d',icon:'📦',v:'11',l:'实施工作包'},
  ];
  document.getElementById('summary').innerHTML=cards.map(c=>
    `<div class="sum-card" style="--c:${c.c}">
      <div class="sum-icon">${c.icon}</div>
      <div class="sum-info"><div class="v">${esc(c.v)}</div><div class="l">${esc(c.l)}</div></div>
    </div>`
  ).join('');
}

// ══ VIEW 1: 全景追溯链 ═════════════════════════════════════════════════════
function renderChain(){
  // determine active sets based on selection
  let activeReqs=new Set(), activePains=new Set(), activeGaps=new Set(), activeSCs=new Set(), activeWPs=new Set();
  if(sel.id){
    if(sel.layer==='req'){
      const r=SR.find(x=>x.id===sel.id);
      activeReqs.add(sel.id);
      (r.pain||[]).forEach(pid=>{
        activePains.add(pid);
        const p=PP.find(x=>x.id===pid);
        (p.gaps||[]).forEach(gid=>{
          activeGaps.add(gid);
          const g=AG.find(x=>x.id===gid);
          (g.scenarios||[]).forEach(sid=>{
            activeSCs.add(sid);
            const s=SC.find(x=>x.id===sid);
            (s.wp||[]).forEach(w=>activeWPs.add(w));
          });
        });
      });
    } else if(sel.layer==='pain'){
      activePains.add(sel.id);
      reqsByPain(sel.id).forEach(r=>activeReqs.add(r.id));
      const p=PP.find(x=>x.id===sel.id);
      (p.gaps||[]).forEach(gid=>{
        activeGaps.add(gid);
        AG.find(x=>x.id===gid).scenarios.forEach(sid=>{
          activeSCs.add(sid);
          SC.find(x=>x.id===sid).wp.forEach(w=>activeWPs.add(w));
        });
      });
    } else if(sel.layer==='gap'){
      activeGaps.add(sel.id);
      const g=AG.find(x=>x.id===sel.id);
      painsByGap(sel.id).forEach(p=>{
        activePains.add(p.id);
        reqsByPain(p.id).forEach(r=>activeReqs.add(r.id));
      });
      (g.scenarios||[]).forEach(sid=>{
        activeSCs.add(sid);
        SC.find(x=>x.id===sid).wp.forEach(w=>activeWPs.add(w));
      });
    } else if(sel.layer==='sc'){
      activeSCs.add(sel.id);
      gapsByScenario(sel.id).forEach(g=>{
        activeGaps.add(g.id);
        painsByGap(g.id).forEach(p=>{
          activePains.add(p.id);
          reqsByPain(p.id).forEach(r=>activeReqs.add(r.id));
        });
      });
      wpsBySc(sel.id).forEach(w=>activeWPs.add(w.id));
    } else if(sel.layer==='wp'){
      activeWPs.add(sel.id);
      scByWp(sel.id).forEach(s=>{
        activeSCs.add(s.id);
        gapsByScenario(s.id).forEach(g=>{
          activeGaps.add(g.id);
          painsByGap(g.id).forEach(p=>{
            activePains.add(p.id);
            reqsByPain(p.id).forEach(r=>activeReqs.add(r.id));
          });
        });
      });
    }
  }
  const hasFilter=sel.id!=null;
  function dim(set, id){ return hasFilter && !set.has(id) ? ' dimmed':''; }
  function act(set, id){ return set.has(id) ? ' active':''; }

  // detail panel
  let detailHtml='<div class="empty-state">👆 点击任意节点，查看双向追溯关系</div>';
  if(sel.id){
    if(sel.layer==='pain'){
      const p=PP.find(x=>x.id===sel.id);
      detailHtml=`<h3>🔍 业务痛点：${esc(p.name)}</h3>
        <p style="font-size:12px;color:var(--muted);margin-bottom:8px">${esc(p.desc)}</p>
        <div class="d-grid">
          <div class="d-item"><div class="label">相关需求数</div><div class="value"><strong>${p.req_count}</strong> 条（样本: ${reqsByPain(p.id).length}条展示）</div></div>
          <div class="d-item"><div class="label">部门</div><div class="value">${esc(p.dept)}</div></div>
          <div class="d-item"><div class="label">→ 触发架构差距</div><div class="value">${p.gaps.map(g=>{ const gx=AG.find(x=>x.id===g); return gx?'<span class="phase-badge sev-高">'+esc(gx.name)+'</span>':g; }).join(' ')}</div></div>
          <div class="d-item"><div class="label">严重程度</div><div class="value"><span class="sev-${esc(p.severity)} phase-badge">${esc(p.severity)}</span></div></div>
        </div>`;
    } else if(sel.layer==='gap'){
      const g=AG.find(x=>x.id===sel.id);
      detailHtml=`<h3>🏛️ 架构差距：${esc(g.name)}</h3>
        <p style="font-size:12px;color:var(--muted);margin-bottom:8px">${esc(g.desc)}</p>
        <div class="d-grid">
          <div class="d-item"><div class="label">架构域</div><div class="value"><span class="domain-badge dom-${esc(g.domain)}">${esc(g.domain)}</span></div></div>
          <div class="d-item"><div class="label">TOGAF Phase</div><div class="value">Phase ${esc(g.togaf_phase)}</div></div>
          <div class="d-item"><div class="label">→ 对应解决方案</div><div class="value">${g.scenarios.map(s=>{ const sx=SC.find(x=>x.id===s); return sx?'<span class="badge-p'+esc(sx.priority.slice(1))+'">'+esc(sx.name)+'</span>':s; }).join(' ')}</div></div>
          <div class="d-item"><div class="label">严重程度</div><div class="value"><span class="sev-${esc(g.severity)} phase-badge">${esc(g.severity)}</span></div></div>
        </div>`;
    } else if(sel.layer==='sc'){
      const s=SC.find(x=>x.id===sel.id);
      const wps=wpsBySc(s.id);
      detailHtml=`<h3>🎯 高价值场景：${esc(s.name)}</h3>
        <p style="font-size:12px;color:var(--muted);margin-bottom:8px">${esc(s.desc)}</p>
        <div class="d-grid">
          <div class="d-item"><div class="label">负责人</div><div class="value">${esc(s.owner)}</div></div>
          <div class="d-item"><div class="label">架构域</div><div class="value"><span class="domain-badge dom-${esc(s.domain)}">${esc(s.domain)}</span></div></div>
          <div class="d-item"><div class="label">→ 工作包</div><div class="value">${wps.map(w=>`<span style="background:${w.color}22;color:${w.color};padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700">${esc(w.name)}</span>`).join(' ')}</div></div>
          <div class="d-item"><div class="label">选定状态</div><div class="value">${s.selected?'<span class="badge-p1">✅ 已聚焦场景</span>':'<span class="badge-p2">候选</span>'}</div></div>
        </div>`;
    }
  }

  document.getElementById('content').innerHTML=`
    <p class="hint">点击任意节点高亮全链路追溯，再次点击取消；箭头方向为正向推导</p>
    <div id="chain-view">
      <div class="chain-col">
        <div class="chain-hdr" style="background:#0f766e">📋 原始需求 <small style="opacity:.7;font-size:9px">(全量555条，点击痛点过滤)</small></div>
        <div class="chain-items">${(hasFilter ? SR.filter(r=>r.pain.some(p=>activePains.has(p))) : SR).map(r=>{
          const pri=r.priority;

function renderForward(){
  const searchEl=document.getElementById('fwd-search');
  const filterEl=document.getElementById('fwd-filter');
  const q=(searchEl?searchEl.value:'').toLowerCase();
  const f=(filterEl?filterEl.value:'all');

  let filteredPains=PP;
  if(q) filteredPains=PP.filter(p=>p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q));
  if(f!=='all') filteredPains=PP.filter(p=>p.severity===f);

  let content=`
    <div class="search-bar">
      <input id="fwd-search" placeholder="搜索痛点..." value="${esc(q)}" oninput="renderForward()">
      <select id="fwd-filter" onchange="renderForward()">
        <option value="all" ${f==='all'?'selected':''}>全部严重度</option>
        <option value="高" ${f==='高'?'selected':''}>高</option>
        <option value="中" ${f==='中'?'selected':''}>中</option>
      </select>
    </div>
    <p class="hint">从业务痛点出发 → 架构差距 → 解决方案 → 工作包（正向推导）</p>`;

  filteredPains.forEach(p=>{
    const gaps=p.gaps.map(gid=>AG.find(x=>x.id===gid)).filter(Boolean);
    const allScs=[...new Set(gaps.flatMap(g=>g.scenarios))].map(sid=>SC.find(x=>x.id===sid)).filter(Boolean);
    const allWps=[...new Set(allScs.flatMap(s=>s.wp))].map(wid=>WP.find(x=>x.id===wid)).filter(Boolean);

    content+=`<div class="trace-view" style="margin-bottom:10px">
      <div class="trace-hdr">
        <span class="sev-${esc(p.severity)} phase-badge">${esc(p.id)}</span>
        <h3>${esc(p.name)}</h3>
        <span style="font-size:11px;color:var(--muted);margin-left:auto">${esc(p.dept)} · ${p.req_count}条需求</span>
      </div>
      <div class="trace-path">
        <span style="font-size:10px;color:var(--muted);margin-right:4px">📋</span>
        <span class="tp-node" style="background:#0f766e" title="${p.req_count}条需求">${p.req_count}条原始需求</span>
        <span class="tp-arrow">→</span>
        ${gaps.map(g=>`<span class="tp-node" style="background:#1d4ed8">${esc(g.name)}</span>`).join('<span class="tp-arrow">·</span>')}
        <span class="tp-arrow">→</span>
        ${allScs.map(s=>`<span class="tp-node" style="background:${s.selected?'#7c3aed':'#94a3b8'}">${esc(s.name)}${s.selected?' ✅':''}</span>`).join('<span class="tp-arrow">·</span>')}
        <span class="tp-arrow">→</span>
        ${allWps.map(w=>`<span class="tp-node" style="background:${w.color}">${esc(w.name)}</span>`).join('<span class="tp-arrow">·</span>')}
      </div>
      <div style="font-size:11px;color:var(--muted);padding:4px 8px;background:#f8fafc;border-radius:4px">${esc(p.desc)}</div>
    </div>`;
  });

  document.getElementById('content').innerHTML=content;
}

            ${wps.map(w=>`<span class="sc-tag" style="background:${w.color}22;color:${w.color}">${esc(w.id)}</span>`).join('')}

          <div style="font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4">${esc(s.desc.slice(0,60))}${s.desc.length>60?'...':''}</div>
        </div>`;
      }).join('')}
    </div>`;

    content+=`
    <div style="margin-top:16px;background:var(--card);border:2px solid #7c3aed;border-radius:8px;padding:14px">

          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  document.getElementById('content').innerHTML=content;
}

function toggleScenario(id){
  const s=SC.find(x=>x.id===id);
  if(!s) return;
  const selCount=SC.filter(x=>x.selected).length;
  if(!s.selected && selCount>=9){
    // allow override but warn
    if(!confirm(`当前已选${selCount}个场景，再添加"${s.name}"将超过8个。是否继续？`)) return;
  }
  s.selected=!s.selected;
  renderScenario();
}

// ── main render ─────────────────────────────────────────────────────────────
function render(){
  renderSummary();
  if(view==='chain') renderChain();
  else if(view==='forward') renderForward();
  else if(view==='backward') renderBackward();
  else if(view==='scenario') renderScenario();
  else if(view==='reqs') renderReqs();
}


// ══ VIEW 5: 需求明细（全量555条）═══════════════════════════════════════════
let reqFilter = {q:'', priority:'all', pain:'all', wp:'all'};
function renderReqs(){
  const q = reqFilter.q.toLowerCase();
  const pf = reqFilter.priority;
  const painf = reqFilter.pain;
  const wpf = reqFilter.wp;

  let filtered = SR.filter(r => {
    if(q && !r.brief.toLowerCase().includes(q) && !r.id.toLowerCase().includes(q) && !(r.dept||'').toLowerCase().includes(q)) return false;
    if(pf !== 'all' && r.priority !== pf) return false;
    if(painf !== 'all' && !r.pain.includes(painf)) return false;
    if(wpf !== 'all' && r.wp !== wpf) return false;
    return true;
  });

  const total = SR.length;

  document.getElementById('content').innerHTML = `

            +'<td style="padding:6px 10px;font-weight:700;color:#1d4ed8;font-family:monospace">'+esc(r.id)+'</td>'
            +'<td style="padding:6px 10px;line-height:1.4;font-weight:500">'+esc(r.brief)+'</td>'
            +'<td style="padding:6px 10px;line-height:1.45;color:#374151;font-size:10.5px">'+esc(r.detail||'')+'</td>'
            +'<td style="padding:6px 10px;line-height:1.45;color:#6b7280;font-size:10.5px">'+esc(r.opinion||'暂无')+'</td>'
            +'<td style="padding:6px 10px;text-align:center"><span style="background:'+priBg+';color:'+priCol+';padding:2px 6px;border-radius:3px;font-weight:700;font-size:10px">'+esc(r.priority)+'</span></td>'
            +'<td style="padding:6px 10px;color:var(--muted);font-size:10px">'+esc(r.dept||'')+'</td>'
            +'<td style="padding:6px 10px"><span style="font-size:10px;font-weight:600;color:#1d4ed8">'+esc(r.wp||'')+'</span></td>'
            +'<td style="padding:6px 10px">'+painTags+'</td>'
            +'</tr>';
        }).join('')}
      </tbody>
    </table>
    ${filtered.length===0?'<div style="text-align:center;padding:40px;color:var(--muted)">无匹配需求</div>':''}
  </div>`;
}

window.onload=()=>{ render(); };
</script>
</body>
</html>
