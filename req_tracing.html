<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>需求追踪工作台 — 佛照 S/4HANA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F7FB;--card:#fff;--border:#DCE6F2;--txt:#16283E;--muted:#5E718A;
  --navy:#0F2440;--tabbar:#16283E;
  --blue1:#12315C;--blue2:#2E5E9E;--blue3:#5B8FD6;--blue4:#93B8E4;--blue5:#C7DBF0;--blue6:#E8F0F9;
  --grayb:#8A9BB0;
  --font:'Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
#subhdr{background:var(--navy);color:#F2F7FD;padding:6px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid #1C3A63}
#subhdr-title{font-size:13px;font-weight:700}#subhdr-title span{color:#7FAEE2}
#subhdr-tag{font-size:10px;color:#9DB8D8;padding:2px 7px;border:1px solid #2E4E77;border-radius:3px}
#subhdr-proj{flex:1;font-size:11px;color:#9DB8D8}
#nav{background:var(--tabbar);display:flex;padding:0 16px;gap:2px;flex-shrink:0;overflow-x:auto}
.nav-tab{padding:10px 16px;font-size:12px;font-weight:500;color:#9DB8D8;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap}
.nav-tab:hover{color:#DCE9F7}.nav-tab.on{color:#7FAEE2;border-bottom-color:#7FAEE2;font-weight:700}
#body{flex:1;padding:16px;overflow-y:auto}
#summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media(max-width:1100px){#summary{grid-template-columns:repeat(3,1fr)}}
.sum-card{background:var(--card);border-radius:8px;padding:12px 14px;border-left:3px solid var(--c);display:flex;align-items:center;gap:10px}
.sum-icon{font-size:20px}.sum-info .v{font-size:20px;font-weight:800;color:var(--c)}.sum-info .l{font-size:10px;color:var(--muted)}
/* chain view */
#chain-view{display:flex;gap:0;overflow-x:auto;padding-bottom:8px}
.chain-col{min-width:212px;max-width:250px;flex-shrink:0}
.chain-hdr{padding:8px 12px;font-size:11px;font-weight:700;color:#fff;border-radius:6px 6px 0 0;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.chain-items{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;min-height:420px;max-height:640px;overflow-y:auto}
.chain-item{padding:8px 10px;border-bottom:1px solid var(--blue6);cursor:pointer;transition:background .1s;display:flex;gap:6px;align-items:flex-start}
.chain-item:last-child{border-bottom:none}
.chain-item:hover{background:var(--blue6)}
.chain-item.active{background:#DCEBFA;border-left:3px solid var(--blue2)}
.chain-item.dimmed{opacity:.28}
.ci-badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.ci-name{font-size:11px;line-height:1.35;flex:1}
.ci-sub{font-size:10px;color:var(--muted);margin-top:2px}
.chain-arrow{display:flex;align-items:center;padding:0 6px;color:var(--blue4);font-size:18px;flex-shrink:0;align-self:center}
.loadmore{width:100%;padding:8px;font-size:11px;color:var(--blue2);background:var(--blue6);border:none;cursor:pointer;font-weight:600}
.loadmore:hover{background:var(--blue5)}
/* detail panel */
#detail{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:14px;min-height:60px}
.empty-state{color:var(--muted);font-size:12px;text-align:center;padding:18px}
.detail-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px;margin-bottom:6px}
/* generic card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:box-shadow .12s}
.gcard:hover{box-shadow:0 2px 10px rgba(18,49,92,.13)}
.gcard.active{outline:2px solid var(--blue2)}
.gcard h4{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.gcard .meta{font-size:11px;color:var(--muted);line-height:1.6}
.chip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;background:var(--blue6);color:var(--blue1);margin:2px 3px 2px 0;font-weight:600}
.chip.b2{background:var(--blue5)}.chip.gray{background:#EDF0F4;color:var(--grayb)}
.bar{height:6px;border-radius:3px;background:var(--blue6);overflow:hidden;display:flex;margin:4px 0}
.bar div{height:100%}
/* section title */
.sec-title{font-size:14px;font-weight:800;color:var(--blue1);margin:18px 0 10px;padding-left:10px;border-left:4px solid var(--blue2)}
.note{font-size:11px;color:var(--muted);line-height:1.7;background:var(--blue6);border-radius:6px;padding:10px 14px;margin:10px 0}
/* filter bar */
.fbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.fbar input,.fbar select{font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--txt)}
.fbar input{min-width:200px}
/* table */
.rtable{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;font-size:11.5px}
.rtable th{background:var(--blue1);color:#fff;padding:8px 10px;text-align:left;font-size:11px;white-space:nowrap;position:sticky;top:0}
.rtable td{padding:7px 10px;border-bottom:1px solid var(--blue6);vertical-align:top}
.rtable tr:hover td{background:var(--blue6);cursor:pointer}
.pager{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pager button{font-size:11px;padding:5px 10px;border:1px solid var(--border);background:#fff;border-radius:5px;cursor:pointer;color:var(--txt)}
.pager button.on{background:var(--blue1);color:#fff;border-color:var(--blue1);font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}
/* maturity roadmap */
.mat-ladder{display:flex;gap:8px;margin:12px 0}
.mat-step{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;position:relative}
.mat-step .lv{font-size:16px;font-weight:800}
.mat-step .nm{font-size:11px;font-weight:700;margin:2px 0}
.mat-step .ds{font-size:10px;color:var(--muted);line-height:1.55}
.mat-step.cur{border:2px solid var(--blue2);background:var(--blue6)}
.mat-step.cur::after{content:'当前 L1-2';position:absolute;top:-9px;right:8px;font-size:9px;background:var(--blue2);color:#fff;padding:1px 7px;border-radius:8px;font-weight:700}
.mat-step.ph1::after{content:'2026→L2-3';position:absolute;top:-9px;right:8px;font-size:9px;background:var(--blue2);color:#fff;padding:1px 7px;border-radius:8px;font-weight:700}
.mat-step.ph2::after{content:'2027→L4';position:absolute;top:-9px;right:8px;font-size:9px;background:var(--blue1);color:#fff;padding:1px 7px;border-radius:8px;font-weight:700}
.mat-step.ph3::after{content:'2028→L4+/L5';position:absolute;top:-9px;right:8px;font-size:9px;background:var(--blue3);color:#fff;padding:1px 7px;border-radius:8px;font-weight:700}
.year-row{display:flex;gap:14px;align-items:stretch;margin-bottom:6px}
.year-col{flex:1;min-width:0}
.year-hdr{border-radius:8px;padding:10px 14px;color:#fff;margin-bottom:10px}
.year-hdr .y{font-size:18px;font-weight:800}
.year-hdr .p{font-size:11px;opacity:.92;margin-top:2px}
.year-hdr .g{font-size:10px;opacity:.85;margin-top:4px;line-height:1.5}
.pcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--yc,#2E5E9E);border-radius:8px;padding:13px;margin-bottom:10px;cursor:pointer;transition:box-shadow .12s}
.pcard:hover{box-shadow:0 2px 10px rgba(18,49,92,.13)}
.pcard h4{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .pmeta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:6px 0}
.pcard .pdesc{font-size:11px;line-height:1.65;color:var(--txt)}
.pcard .pextra{display:none;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.pcard.open .pextra{display:block}
.ms-list{font-size:10.5px;color:var(--muted);line-height:1.7}
/* modal */
#req-modal{display:none;position:fixed;inset:0;background:rgba(15,36,64,.45);z-index:99;overflow-y:auto}
#req-modal .inner{background:#fff;max-width:860px;margin:40px auto;border-radius:10px;padding:20px 24px;box-shadow:0 10px 40px rgba(15,36,64,.3)}
#req-modal h3{font-size:15px;color:var(--blue1);margin-bottom:10px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:12px;margin:8px 0}
.kv .k{color:var(--muted);font-weight:600}
.chain-trace{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;margin-top:6px}
.tnode{padding:3px 10px;border-radius:5px;font-weight:600}
.tarrow{color:var(--blue4);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>

      Object.entries(p.arch).forEach(([a,w])=>{if(w>=.25)active.arch.add(a);});
      scOfPain(p).forEach(s=>{active.sc.add(s);(SCEN_MAP[s].wp||[]).forEach(w=>active.wp.add(w));});
    }else if(sel.layer==='arch'){active.arch.add(sel.id);
      PP.forEach(p=>{if(p.arch_dom===sel.id){active.pain.add(p.id);reqsOfPain(p.id).forEach(r=>active.req.add(r.id));}});
      SC.forEach(s=>{if(s.arch===sel.id)active.sc.add(s.id);});
    }else if(sel.layer==='sc'){const s=SCEN_MAP[sel.id];active.sc.add(sel.id);
      reqsOfScen(sel.id).forEach(r=>{active.req.add(r.id);r.pain.forEach(pid=>active.pain.add(pid));});
      (s.pains||[]).forEach(pid=>active.pain.add(pid));if(s.arch)active.arch.add(s.arch);
      (s.wp||[]).forEach(w=>active.wp.add(w));
    }else if(sel.layer==='wp'){const w=WP_MAP[sel.id];active.wp.add(sel.id);
      (w.sc||[]).forEach(sid=>{active.sc.add(sid);reqsOfScen(sid).forEach(r=>{active.req.add(r.id);r.pain.forEach(pid=>active.pain.add(pid));});});
      (w.pains||[]).forEach(pid=>active.pain.add(pid));
    }
  }
  const has=sel.id!=null;
  const dim=(set,id)=>has&&!set.has(id)?' dimmed':'';
  const act=(set,id)=>set.has(id)?' active':'';
  function archSecond(p){const e=Object.entries(p.arch).sort((a,b)=>b[1]-a[1]);return e[1][0];}
  function selArch2(p){return p.arch_dom;}

  // 需求列（虚拟滚动：默认80条，点击加载更多）
  let reqHtml='';
  const shown=REQS.slice(0,reqShown);
  shown.forEach(r=>{reqHtml+=`<div class="chain-item${act(active.req,r.id)}${dim(active.req,r.id)}" onclick="selectItem('req','${r.id}')">
    <span class="ci-badge" style="background:#EDF3FA;color:#2E5E9E">${esc(r.id)}</span>

  if(reqShown<REQS.length)reqHtml+=`<button class="loadmore" onclick="event.stopPropagation();reqShown+=200;renderChain();">▼ 加载更多（已显示 ${reqShown}/${REQS.length}）</button>`;

  // 痛点列
  let painHtml='';
  PP.forEach(p=>{const sv=SEV_STYLE[p.sev]||SEV_STYLE['低'];
    painHtml+=`<div class="chain-item${act(active.pain,p.id)}${dim(active.pain,p.id)}" onclick="selectItem('pain','${p.id}')">
    <span class="ci-badge" style="background:${sv.bg};color:${sv.fg}">${esc(p.id)}</span>
    <div><div class="ci-name">${esc(p.name)}</div><div class="ci-sub">${esc(p.domain)} · ${p.req_count}条 · ${ARCH_CN[p.arch_dom]}</div></div></div>`;});

  // 4A列
  let archHtml='';
  AR.forEach(a=>{archHtml+=`<div class="chain-item${act(active.arch,a.id)}${dim(active.arch,a.id)}" onclick="selectItem('arch','${a.id}')" style="padding:12px 10px">
    <span class="ci-badge" style="background:${ARCH_COLOR[a.id]};color:${a.id==='TA'?'#12315C':'#fff'}">${a.id}</span>
    <div><div class="ci-name" style="font-weight:700">${esc(a.name)} ${esc(a.en.split(' ')[0])}</div>

    <div class="bar">${archBar(a.id)}</div></div></div>`;});

  // 场景列
  let scHtml='';
  SC.forEach(s=>{const bucket=s.is_bucket;
    scHtml+=`<div class="chain-item${act(active.sc,s.id)}${dim(active.sc,s.id)}" onclick="selectItem('sc','${esc(s.id)}')">
    <span class="ci-badge" style="background:${bucket?'#EDF0F4':ARCH_COLOR[s.arch]};color:${bucket?'#8A9BB0':(s.arch==='TA'?'#12315C':'#fff')}">${esc(s.id)}</span>
    <div><div class="ci-name">${esc(s.name)}</div><div class="ci-sub">${bucket?'范围外':esc(s.domain)+' · '+esc(s.priority)+' · '+s.req_count+'条'}</div></div></div>`;});

  // 项目卡片列
  let wpHtml='';
  WPS.forEach(w=>{wpHtml+=`<div class="chain-item${act(active.wp,w.id)}${dim(active.wp,w.id)}" onclick="selectItem('wp','${w.id}')" style="padding:10px">
    <span class="ci-badge" style="background:${YEAR_COLOR[w.year]};color:#fff">${w.year}</span>
    <div><div class="ci-name" style="font-weight:600">${esc(w.id)} ${esc(w.name)}</div>
    <div class="ci-sub">${esc(w.owner)} · ${esc(w.budget)} · ${esc(w.maturity)}</div></div></div>`;});

  document.getElementById('view').innerHTML=`
  <div class="legend"><span><i style="background:${ARCH_COLOR.BA}"></i>业务架构 BA</span><span><i style="background:${ARCH_COLOR.DA}"></i>数据架构 DA</span><span><i style="background:${ARCH_COLOR.AA}"></i>应用架构 AA</span><span><i style="background:${ARCH_COLOR.TA}"></i>技术架构 TA</span><span style="color:#8A9BB0">▍治理类痛点与范围外桶不计入23场景</span></div>
  <div id="chain-view">
    <div class="chain-col"><div class="chain-hdr" style="background:#12315C">📋 原始需求 <span style="opacity:.8">701</span></div><div class="chain-items">${reqHtml}</div></div>
    <div class="chain-arrow">➜</div>

    <div class="chain-arrow">➜</div>

  </div>
  <div id="detail">${chainDetail()}</div>`;
}
function prioInline(p){const s=PRIO_STYLE[p]||PRIO_STYLE['待定'];return ` · <b style="color:${s.bg==='C7DBF0'||s.bg==='EDF0F4'?'#5E718A':s.bg}">${esc(p)}</b>`;}
function archBar(aid){let h='';['BA','DA','AA','TA'].forEach(a=>{h+=`<div style="width:${archWeighted[a]/archWeighted.BA*100/(archWeighted.BA+archWeighted.DA+archWeighted.AA+archWeighted.TA)*((archWeighted.BA+archWeighted.DA+archWeighted.AA+archWeighted.TA)/archWeighted.BA)}%;background:${ARCH_COLOR[a]}"></div>`;});return h;}

// ══ VIEW 4: 场景矩阵 ══
function renderScenario(){
  const inSc=SC.filter(s=>!s.is_bucket),buckets=SC.filter(s=>s.is_bucket);
  let html=`<div class="note">23 个高价值场景（S01–S23）承接 SAP 范围内 568 条需求；其余 133 条归入范围外治理桶（与 EA 报告图 9-1 口径一致）。点击卡片查看关联痛点与项目卡片。</div>`;
  const byDom={};inSc.forEach(s=>{(byDom[s.domain]=byDom[s.domain]||[]).push(s);});
  Object.keys(byDom).sort((a,b)=>byDom[b].length-byDom[a].length).forEach(dom=>{
    html+=`<div class="sec-title">${esc(dom)}（${byDom[dom].length} 个场景 · ${byDom[dom].reduce((n,s)=>n+s.req_count,0)} 条需求）</div><div class="grid">`;
    byDom[dom].forEach(s=>{
      html+=`<div class="gcard" onclick="selectItem('sc','${esc(s.id)}');switchView('chain')">
      <h4><span class="ci-badge" style="background:${ARCH_COLOR[s.arch]};color:${s.arch==='TA'?'#12315C':'#fff'}">${esc(s.id)}</span>${esc(s.name)}<span class="chip" style="margin-left:auto">${esc(s.priority)}</span></h4>
      <div class="meta">${esc(s.desc.slice(0,52))}…</div>
      <div style="margin-top:6px"><span class="chip">${ARCH_CN[s.arch]}</span><span class="chip gray">${s.req_count}条需求</span><span class="chip gray">${esc(s.owner)}</span>${(s.wp||[]).map(w=>`<span class="chip b2">${esc(w)}·${WP_MAP[w].year}</span>`).join('')}</div></div>`;});
    html+=`</div>`;
  });
  html+=`<div class="sec-title">范围外治理桶（${buckets.reduce((n,s)=>n+s.req_count,0)} 条）</div><div class="grid">`;
  buckets.forEach(s=>{html+=`<div class="gcard" style="opacity:.75" onclick="selectItem('sc','${esc(s.id)}');switchView('chain')">
    <h4><span class="ci-badge" style="background:#EDF0F4;color:#8A9BB0">${esc(s.id.length>4?'桶':s.id)}</span>${esc(s.name)}<span class="chip gray" style="margin-left:auto">${s.req_count}条</span></h4>
    <div class="meta">${esc(s.desc)}</div></div>`;});
  html+=`</div>`;
  document.getElementById('view').innerHTML=html;
}

// ══ VIEW 5: 需求明细 ══
let rf={q:'',dom:'',prio:'',pain:'',sc:'',arch:''},rPage=1;
function renderReqs(){
  const doms=[...new Set(REQS.map(r=>r.dom))].sort();
  let list=REQS.filter(r=>
    (!rf.q||r.id.toLowerCase().includes(rf.q.toLowerCase())||r.brief.toLowerCase().includes(rf.q.toLowerCase()))&&
    (!rf.dom||r.dom===rf.dom)&&(!rf.prio||r.prio===rf.prio)&&
    (!rf.pain||r.pain.includes(rf.pain))&&(!rf.sc||r.s===rf.sc)&&(!rf.arch||r.arch===rf.arch));
  const PER=50,total=Math.max(1,Math.ceil(list.length/PER));rPage=Math.min(rPage,total);
  const page=list.slice((rPage-1)*PER,rPage*PER);
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${cur===v?' selected':''}>${esc(l)}</option>`;
  let html=`<div class="fbar">
    <input placeholder="🔍 需求编号/关键词" value="${esc(rf.q)}" oninput="rf.q=this.value;rPage=1;renderReqs()">
    <select onchange="rf.dom=this.value;rPage=1;renderReqs()">${opt('','全部领域'+`(${REQS.length})`,rf.dom)}${doms.map(d=>opt(d,d+`(${REQS.filter(r=>r.dom===d).length})`,rf.dom)).join('')}</select>
    <select onchange="rf.prio=this.value;rPage=1;renderReqs()">${opt('','全部优先级',rf.prio)}${['高','中','低','待定'].map(p=>opt(p,p+`(${REQS.filter(r=>r.prio===p).length})`,rf.prio)).join('')}</select>
    <select onchange="rf.pain=this.value;rPage=1;renderReqs()">${opt('','全部痛点',rf.pain)}${PP.map(p=>opt(p.id,p.id+' '+p.name.slice(0,10)+`(${p.req_count})`,rf.pain)).join('')}</select>
    <select onchange="rf.sc=this.value;rPage=1;renderReqs()">${opt('','全部场景',rf.sc)}${SC.map(s=>opt(s.id,s.id+' '+s.name.slice(0,10)+`(${s.req_count})`,rf.sc)).join('')}</select>
    <select onchange="rf.arch=this.value;rPage=1;renderReqs()">${opt('','全部4A',rf.arch)}${['BA','DA','AA'].map(a=>opt(a,ARCH_CN[a]+`(${archDomCount[a]||0})`,rf.arch)).join('')}</select>
    <span style="font-size:11px;color:var(--muted)">命中 ${list.length} / 701 条</span></div>`;
  html+=`<table class="rtable"><tr><th>编号</th><th>需求简述</th><th>提出部门</th><th>优先级</th><th>问题领域</th><th>痛点</th><th>4A</th><th>场景</th></tr>`;
  page.forEach(r=>{const s=SCEN_MAP[r.s];
    html+=`<tr onclick="showReq('${r.id}')"><td style="color:#2E5E9E;font-weight:700;white-space:nowrap">${esc(r.id)}</td>
    <td>${esc(r.brief.slice(0,34))}</td><td style="color:var(--muted)">${esc(r.dept)}</td><td>${prioBadge(r.prio)}</td>
    <td style="color:var(--muted);white-space:nowrap">${esc(r.dom.slice(0,8))}</td>
    <td>${r.pain.map(p=>`<span class="chip" style="padding:0 5px">${esc(p)}</span>`).join('')}</td>
    <td><span class="ci-badge" style="background:${ARCH_COLOR[r.arch]};color:${r.arch==='TA'?'#12315C':'#fff'}">${r.arch}</span></td>
    <td style="white-space:nowrap">${s?(s.is_bucket?'<span style="color:#8A9BB0">'+esc(s.name.slice(0,8))+'</span>':esc(s.id)):'—'}</td></tr>`;});
  html+=`</table><div class="pager">
    <button ${rPage===1?'disabled':''} onclick="rPage--;renderReqs()">‹ 上一页</button>
    ${Array.from({length:total},(_,i)=>i+1).filter(p=>p===1||p===total||Math.abs(p-rPage)<=2).map(p=>`<button class="${p===rPage?'on':''}" onclick="rPage=${p};renderReqs()">${p}</button>`).join('<span style="align-self:center;color:var(--muted)">…</span>')}
    <button ${rPage===total?'disabled':''} onclick="rPage++;renderReqs()">下一页 ›</button></div>`;
  document.getElementById('view').innerHTML=html;
}
function showReq(rid){const r=REQS.find(x=>x.id===rid);if(!r)return;
  const s=SCEN_MAP[r.s];const wps=(s&&!s.is_bucket)?(s.wp||[]):[];
  document.getElementById('req-modal-body').innerHTML=`
  <h3>${esc(r.id)} · ${esc(r.brief)}</h3>
  <div class="kv"><span class="k">提出部门</span><span>${esc(r.dept)}</span><span class="k">优先级</span><span>${esc(r.prio)}</span>
  <span class="k">问题领域</span><span>${esc(r.dom)}</span><span class="k">SAP模块</span><span>${esc(r.sap||'—')}</span></div>
  <div class="sec-title">追踪链</div>
  <div class="chain-trace"><span class="tnode" style="background:#12315C;color:#fff">${esc(r.id)} 需求</span><span class="tarrow">→</span>
  ${r.pain.map(pid=>`<span class="tnode" style="background:#2E5E9E;color:#fff">${esc(pid)} ${esc(PAIN_MAP[pid].name.slice(0,12))}</span>`).join('<span class="tarrow">→</span>')}
  <span class="tarrow">→</span><span class="tnode" style="background:#5B8FD6;color:#fff">${ARCH_CN[r.arch]}</span><span class="tarrow">→</span>
  <span class="tnode" style="background:#12315C;color:#fff">${s?esc(s.id+' '+s.name):'—'}</span>
  ${wps.length?`<span class="tarrow">→</span>${wps.map(w=>`<span class="tnode" style="background:${YEAR_COLOR[WP_MAP[w].year]};color:#fff">${esc(w)} ${esc(WP_MAP[w].name.slice(0,10))}</span>`).join('')}`:''}</div>
  <div class="note">痛点权重：${r.pain.map(pid=>{const p=PAIN_MAP[pid];return `${esc(pid)}：${Object.entries(p.arch).map(([a,w])=>`${a} ${Math.round(w*100)}%`).join('/')}`}).join('；')}</div>`;
  document.getElementById('req-modal').style.display='block';
}
function closeReqModal(e){if(e.target===document.getElementById('req-modal'))document.getElementById('req-modal').style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('req-modal').style.display='none';});

// ══ VIEW 6: 项目卡片 2026-2028（GB/T 43439 成熟度分期） ══
function renderCards(){
  let html=`<div class="note"><b>分期原则（GB/T 43439-2023《信息技术服务 数字化转型成熟度模型与评估》）：</b>2026 年完成基础建设与数据规范，由当前 1-2 级升至 2-3 级（完成局部业务数据收集整合、关键业务系统集成启动）；2027 年五大实施包完成 S/4HANA 核心切换，达到 4 级（数据作为核心要素，构建算法和模型提供数据智能体验）；2028 年深化数据智能、探索生态协同（五级愿景）。实施路径参考《制造业企业数字化转型实施指南》。</div>`;
  // 成熟度阶梯
  html+=`<div class="sec-title">数字化转型成熟度阶梯（GB/T 43439-2023 §5）</div><div class="mat-ladder">`;
  const cls={L1:'cur',L2:'ph1',L3:'ph1',L4:'ph2',L5:'ph3'};
  MAT.levels.forEach(l=>{html+=`<div class="mat-step ${cls[l.id]||''}"><div class="lv" style="color:${l.id==='L4'?'#12315C':(l.id==='L5'?'#5B8FD6':'#2E5E9E')}">${esc(l.name)}</div><div class="nm">${esc(l.short)}</div><div class="ds">${esc(l.desc)}</div></div>`;});
  html+=`</div>`;
  // 三年分期
  MAT.phases.forEach(ph=>{
    const cards=ph.cards.map(c=>WP_MAP[c]);
    html+=`<div class="sec-title">${ph.year} · ${esc(ph.name)}（${esc(ph.frm)} → ${esc(ph.to)}）</div>
    <div class="note" style="background:#EDF3FA">${esc(ph.desc)}<br><b style="color:#2E5E9E">国标依据：${esc(ph.gbt)}</b></div>
    <div class="year-row"><div class="year-col">`;
    cards.forEach(w=>{
      const scs=(w.sc||[]).map(sid=>SCEN_MAP[sid]);
      const reqN=scs.reduce((n,s)=>n+(s?s.req_count:0),0);
      html+=`<div class="pcard" style="--yc:${YEAR_COLOR[w.year]}" onclick="this.classList.toggle('open')">
      <h4><span class="ci-badge" style="background:${YEAR_COLOR[w.year]};color:#fff">${esc(w.id)}</span>${esc(w.name)}
      <span class="chip">${esc(w.maturity)}</span></h4>
      <div class="pmeta"><span>👤 ${esc(w.owner)}</span><span>💰 ${esc(w.budget)}</span><span>📌 ${esc(w.status)}</span><span>🎯 ${scs.length}场景 / ${reqN}条需求</span></div>
      <div class="pdesc">${esc(w.desc)}</div>
      <div class="pextra">
        <div class="sec-title" style="margin-top:2px">覆盖场景</div>
        <div>${scs.map(s=>`<span class="chip">${esc(s.id)} ${esc(s.name)}</span>`).join('')||'<span class="empty-state">平台/流程支撑类，服务全部23场景</span>'}</div>
        <div class="sec-title">直击痛点</div>
        <div>${(w.pains||[]).map(pid=>`<span class="chip b2">${esc(pid)} ${esc(PAIN_MAP[pid].name.slice(0,14))}</span>`).join('')}</div>
        <div class="sec-title">季度里程碑</div>
        <div class="ms-list">${(w.ms||[]).map(m=>'• '+esc(m)).join('<br>')}</div>
      </div><div style="font-size:10px;color:var(--blue4);margin-top:6px">▼ 点击展开场景/痛点/里程碑</div></div>`;
    });
    html+=`</div></div>`;
  });
  // 实施指南原则
  html+=`<div class="sec-title">${esc(MAT.guide.title)}</div><div class="note">${MAT.guide.points.map(p=>'• '+esc(p)).join('<br>')}</div>
  <div class="note" style="background:#fff">🔗 延伸工具：<a href="/fsl-report/kanban/maturity-tool.html" style="color:#2E5E9E" target="_blank">GB/T 43439 成熟度评估工具</a> · <a href="/fsl-report/ea-architect/" style="color:#2E5E9E" target="_blank">企业架构工作台</a></div>`;
  document.getElementById('view').innerHTML=html;
}

function render(){
  renderSummary();
  if(view==='chain')renderChain();
  else if(view==='forward')renderForward();
  else if(view==='backward')renderBackward();
  else if(view==='scenario')renderScenario();
  else if(view==='reqs')renderReqs();
  else if(view==='cards')renderCards();
}
render();
</script>
