<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>引导式课程 | FSL 培训</title>
<style>
:root{--b900:#0B2D47;--b700:#1A4F73;--b500:#2374A3;--b300:#5EA4CE;
      --b050:#EBF5FB;--bg:#F2F7FB;--text:#0F2233;--muted:#5B7A91;--rule:#D6E8F2;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);}
.fill{width:100%;height:100vh;border:0;display:block;}
.bar{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(155deg,var(--b900),var(--b700));
  color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;
  box-shadow:0 2px 8px rgba(11,45,71,.2);}
.bar .pill{font-size:11px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:20px;padding:2px 10px;}
.bar .grow{flex:1;}
.bar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:6px;
  padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.bar button:hover{background:rgba(255,255,255,.26);}
.frame-wrap{position:absolute;top:42px;left:0;right:0;bottom:0;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--b500);color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(11,45,71,.3);display:none;}
.toast.show{display:block;}
</style>
</head>
<body>
<div class="bar">
  <span id="title">引导式课程</span>
  <span class="pill" id="progress">0 / 0</span>
  <span class="grow"></span>
  <button id="restart">↻ 重玩</button>
</div>
<div class="frame-wrap">
  <iframe id="stage" class="fill" src="stage/po-create.html" title="仿真舞台"></iframe>
</div>
<div class="toast" id="toast">🎉 课程已完成，成绩已上报</div>

<script>
'use strict';
/* ===== 最小 SCORM 1.2 桥接（沿 window.parent 找到 LMS 的 window.API）===== */
function findAPI(win){
  var cur=win, depth=0;
  while(cur && depth<5){
    if(cur.API && typeof cur.API.LMSInitialize==='function') return cur.API;
    cur=cur.parent; depth++;
  }
  return null;
}
var API=findAPI(window.parent);
var initialized=false;
function scormInit(){
  if(!API) return false;
  if(API.LMSInitialize('')==='0'){ initialized=true; return true; }
  return false;
}
function scormSet(p,v){ if(initialized && API) API.LMSSetValue(p,String(v)); }
function scormCommit(){ if(initialized && API) API.LMSCommit(''); }
function scormFinish(){ if(initialized && API){ API.LMSFinish(''); initialized=false; } }

/* ===== 课程装载 ===== */
var params=new URLSearchParams(window.location.search);
var courseId=params.get('course')||'po-create';
var stage=document.getElementById('stage');
var course=null;
var started=false;
var expected=null;   // 本课程指定的舞台 screen id（默认舞台为 po-create）
/* 舞台当前文档是否就是本课程要的舞台：
   iframe 换 src 时导航尚未提交，contentWindow 仍是上一个文档（默认舞台 po-create），
   此时下发引导会被那个旧文档接走——它跑完 0 个命中步骤就回报「完成」，课程静默失败。 */
function stageIsExpected(){
  try{
    var w=stage.contentWindow;
    if(!w||!w.location) return false;
    var href=String(w.location.href);
    if(!href||href.indexOf('about:blank')===0) return false;
    var m=/screen=([^&]+)/.exec(href);
    var cur=m?decodeURIComponent(m[1]):'po-create';
    return !expected || cur===expected;
  }catch(e){ return false; }
}
function tryStart(){
  if(started||!course||!course.steps) return;
  if(!stageIsExpected()) return;   // 等真正的舞台文档就绪
  started=true;
  startTour(course.steps);
}
function resetStart(){ started=false; confirmed=false; retryCount=0; sawStep=false; }
// 舞台 load 后留一点余量：通用舞台为异步渲染，优先监听其 stage-ready 信号
stage.addEventListener('load',function(){ setTimeout(tryStart,400); });

function loadCourse(cb){
  // 优先相对路径 courses/{id}.json（与页面同源）
  fetch('courses/'+encodeURIComponent(courseId)+'.json')
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ if(j&&j.steps) cb(j); else cb(null); })
    .catch(function(){ cb(null); });
}

/* 下发引导指令：舞台未确认收到前持续重试。
   背景：iframe 加载存在 about:blank → 真实文档的切换，指令可能发给空文档而丢失；
   仅靠「已发送」标记会导致慢网络下课程随机没有引导。以舞台回传 stage-step/stage-done 为准。 */
var confirmed=false, retryTimer=null, retryCount=0, sawStep=false;
function startTour(steps){
  if(!steps||!steps.length) return;
  sawStep=false;
  scormInit();
  try{ stage.contentWindow.postMessage({type:'stage-run-tour',steps:steps},'*'); }catch(e){}
  document.getElementById('progress').textContent='1 / '+steps.length;
  if(retryTimer) clearTimeout(retryTimer);
  if(!confirmed && retryCount<12){
    retryTimer=setTimeout(function(){
      retryCount++;
      if(!confirmed && course&&course.steps) startTour(course.steps);
    },700);
  }
}
function stopRetry(){
  confirmed=true;
  if(retryTimer){ clearTimeout(retryTimer); retryTimer=null; }
}

window.addEventListener('message',function(e){
  // 只认当前舞台文档的消息：换 src 期间旧文档（默认舞台）的应答必须丢弃
  if(e.source!==stage.contentWindow) return;
  var d=e.data||{};
  if(d.type==='stage-ready'){
    // 通用舞台异步渲染完成后才下发引导，避免元素尚未渲染导致空跑
    if(expected && d.screen && d.screen!==expected) return;  // 不是本课程的舞台
    tryStart();
  } else if(d.type==='stage-miss'){
    // 舞台汇报「一个锚点都没命中」：不放弃，重置后继续重试下发
    started=false; retryCount=0;
    return;
  } else if(d.type==='stage-step'){
    stopRetry();
    sawStep=true;
    document.getElementById('progress').textContent=(d.index+1)+' / '+d.total;
  } else if(d.type==='stage-done'){
    // 没见过任何 stage-step 就收到 done = 空跑，不能算完成，继续重试
    if(!sawStep){ started=false; retryCount=0; return; }
    stopRetry();
    document.getElementById('progress').textContent='完成';
    scormSet('cmi.core.lesson_status','completed');
    scormSet('cmi.core.score.raw','100');
    scormCommit();
    var t=document.getElementById('toast'); t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); },3200);
  }
});

document.getElementById('restart').onclick=function(){
  if(course&&course.steps){ resetStart(); startTour(course.steps); }
};

loadCourse(function(j){
  course=j;
  if(!course){
    document.getElementById('title').textContent='课程未找到：'+courseId;
    return;
  }
  document.getElementById('title').textContent=course.title||('引导式课程 · '+courseId);
  // 按课程指定的仿真舞台加载（默认回退到采购订单舞台）
  var target=course.stage||'stage/po-create.html';
  var m=/screen=([^&]+)/.exec(target);
  expected=m?decodeURIComponent(m[1]):'po-create';
  resetStart();
  if(target!==stage.getAttribute('src')){
    stage.src=target;   // 触发 load
  } else {
    // 舞台已在初始 HTML 中：仅在其确实加载完成后才下发。
    // 注意：iframe 初始为 about:blank，其 readyState 同样是 complete，必须先排除，
    // 否则引导指令会发给空文档而丢失（表现为进度显示 1/N 但引导气泡不出现）。
    var w=stage.contentWindow, d=w && w.document;
    var blank=!w || !w.location || String(w.location.href).indexOf('about:blank')===0;
    if(d && !blank && d.readyState==='complete') tryStart();   // 否则等 load 事件触发
  }
});
window.addEventListener('beforeunload',function(){ scormFinish(); });
</script>
</body>
</html>
