<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的学习 · ERP 仿真培训 | FSL 工作台</title>
<script src="../auth-guard.js"></script>
<style>
:root{--b900:#0B2D47;--b700:#1A4F73;--b500:#2374A3;--b300:#5EA4CE;
      --b100:#C7E2F2;--b050:#EBF5FB;--bg:#F2F7FB;--text:#0F2233;
      --muted:#5B7A91;--rule:#D6E8F2;--r:6px;--green:#15803d;--amber:#92400e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;}
a{color:inherit;text-decoration:none;}

.hero{background:linear-gradient(155deg,var(--b900) 0%,var(--b700) 100%);
      color:#fff;padding:28px 32px 24px;border-bottom:3px solid var(--b500);
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.hero h1{font-size:21px;font-weight:800;}
.hero p{font-size:13px;opacity:.8;max-width:760px;margin-top:4px;}
.learner-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;padding:6px 13px;font-size:12.5px;display:flex;align-items:center;gap:8px;}
.learner-badge .av{width:26px;height:26px;border-radius:50%;background:var(--b300);
  display:flex;align-items:center;justify-content:center;color:var(--b900);font-weight:800;font-size:13px;}

.container{width:100%;padding:26px 32px;}
.bc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:20px;flex-wrap:wrap;}
.bc a{color:var(--b500);} .bc a:hover{color:var(--b700);} .bc .sep{color:var(--b100);}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--b500);
  border-radius:9px;padding:15px 18px;box-shadow:0 1px 4px rgba(11,45,71,.06);}
.stat .num{font-size:27px;font-weight:800;color:var(--b900);line-height:1;}
.stat .lab{font-size:12px;color:var(--muted);margin-top:5px;}

/* 进度表 */
.card{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(11,45,71,.07);}
.card h3{font-size:15px;font-weight:800;color:var(--b900);padding:15px 18px;border-bottom:1px solid var(--rule);}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;
  padding:11px 18px;background:var(--b050);border-bottom:1px solid var(--rule);}
.tbl td{padding:13px 18px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl .ct{font-weight:700;color:var(--b900);}
.tbl .cd{font-size:11.5px;color:var(--muted);margin-top:2px;}
.status-pill{display:inline-block;padding:2px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.st-not{background:var(--bg);color:var(--muted);border:1px solid var(--rule);}
.st-ing{background:#EBF4FF;color:var(--b700);border:1px solid var(--b100);}
.st-done{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;}
.btn-go{background:var(--b500);color:#fff;border:none;border-radius:6px;padding:7px 15px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-go:hover{background:var(--b700);}
.btn-go.ghost{background:var(--b050);color:var(--b700);border:1px solid var(--rule);}
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:13px;}
.warn-bar{background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;
  border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:12.5px;color:var(--amber);}
.loading{padding:30px 18px;text-align:center;color:var(--muted);}
@media(max-width:640px){.container{padding:20px 14px;}.tbl td,.tbl th{padding:10px 12px;}}
</style>
</head>
<body>
<div id="site-nav"></div>
<script src="../nav.js"></script>

<div class="hero">
  <div>
    <h1>我的学习</h1>
    <p>学员进度通过 GitHub 持久化（与任务看板同一机制）：完成状态、得分、断点续学位置均可恢复，数据自托管、不出境。</p>
  </div>
  <div class="learner-badge"><span class="av" id="learnerAv">学</span><span id="learnerName">学员</span></div>
</div>

<div class="container">
  <div class="bc"><a href="/fsl-report/">工作台首页</a><span class="sep">/</span><a href="index.html">培训</a><span class="sep">/</span><span>我的学习</span></div>

  <div id="warnSlot"></div>
  <div class="stats" id="stats">
    <div class="stat"><div class="num" id="stTotal">—</div><div class="lab">课程总数</div></div>
    <div class="stat"><div class="num" id="stDone">—</div><div class="lab">已完成</div></div>
    <div class="stat"><div class="num" id="stAvg">—</div><div class="lab">平均得分</div></div>
    <div class="stat"><div class="num" id="stRate">—</div><div class="lab">完成率</div></div>
  </div>

  <div class="card">
    <h3>课程进度</h3>
    <div id="tblSlot"><div class="loading">读取课程与进度中…</div></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var REPO = 'EstaTea/fsl-report';
  function learner(){ var s=window.FSL_SESSION||{}; return {
    name:s.name||s.login||'学员', id:s.login||s.email||'anonymous',
    token:s.gh_token||s.token||(localStorage.getItem('gh_token_fsl')||'') }; }

  function statusText(s){ return ({'not attempted':'未开始','browsed':'已浏览','incomplete':'进行中',
    'completed':'已完成','passed':'已通过','failed':'未通过'})[s]||'未开始'; }
  function statusCls(s){ if(s==='completed'||s==='passed')return'st-done';
    if(s==='incomplete'||s==='browsed'||s==='failed')return'st-ing'; return'st-not'; }

  function loadCatalog(){ return fetch('courses.json').then(function(r){return r.json();})
    .then(function(j){return (j&&j.courses)||[];}).catch(function(){return[];}); }

  function loadProgress(courseId, login, token){
    if(!token) return Promise.resolve(null);
    var url='https://api.github.com/repos/'+REPO+'/contents/data/training/'+
      encodeURIComponent(courseId)+'/'+encodeURIComponent(login)+'.json';
    return fetch(url,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(j){ if(j&&j.content){ try{return JSON.parse(atob(j.content.replace(/\s/g,'')));}catch(e){return null;} } return null; })
      .catch(function(){return null;});
  }

  function fmtTime(iso){ if(!iso)return'—'; try{var d=new Date(iso);
    return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return'—';} }

  function render(courses, l, rows){
    var total=courses.length, done=0, sum=0, scored=0;
    var html='<table class="tbl"><thead><tr><th>课程</th><th>状态</th><th>得分</th><th>最后更新</th><th>操作</th></tr></thead><tbody>';
    courses.forEach(function(c){
      var p=rows[c.id]||null;
      var st=(p&&p.cmi)?(p.cmi['cmi.core.lesson_status']||'not attempted'):'not attempted';
      var sc=(p&&p.cmi)?(p.cmi['cmi.core.score.raw']||''):'';
      var up=(p&&p.updated_at)?p.updated_at:null;
      if(st==='completed'||st==='passed'){done++; if(sc!==''){sum+=parseFloat(sc)||0;scored++;}}
      var label=(st==='not attempted')?'开始学习':'继续学习';
      html+='<tr><td><div class="ct">'+c.title+'</div><div class="cd">'+(c.desc||'')+'</div></td>'+
        '<td><span class="status-pill '+statusCls(st)+'">'+statusText(st)+'</span></td>'+
        '<td>'+(sc!==''?sc+' / 100':'—')+'</td>'+
        '<td>'+fmtTime(up)+'</td>'+
        '<td><a class="btn-go'+(st==='not attempted'?'':' ghost')+'" href="lms.html?course='+encodeURIComponent(c.id)+'">'+label+' →</a></td></tr>';
    });
    html+='</tbody></table>';
    if(total===0) html='<div class="empty">暂无课程。</div>';
    document.getElementById('tblSlot').innerHTML=html;
    document.getElementById('stTotal').textContent=total;
    document.getElementById('stDone').textContent=done;
    document.getElementById('stAvg').textContent=scored?Math.round(sum/scored):'—';
    document.getElementById('stRate').textContent=total?Math.round(done/total*100)+'%':'—';
  }

  function init(){
    var l=learner();
    var nm=document.getElementById('learnerName'), av=document.getElementById('learnerAv');
    if(nm)nm.textContent=l.name; if(av)av.textContent=(l.name||'学').slice(0,1);
    if(!l.token){
      document.getElementById('warnSlot').innerHTML=
        '<div class="warn-bar">未检测到登录令牌：当前只能浏览课程目录，进度不会保存。请在佛照工作台登录后访问本页。</div>';
    }
    loadCatalog().then(function(courses){
      Promise.all(courses.map(function(c){
        return loadProgress(c.id, l.id, l.token).then(function(p){ return [c.id,p]; });
      })).then(function(pairs){
        var rows={}; pairs.forEach(function(pr){ rows[pr[0]]=pr[1]; });
        render(courses, l, rows);
      });
    });
  }
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
