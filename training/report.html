<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习报告 · ERP 仿真培训 | FSL 工作台</title>
<script src="../auth-guard.js"></script>
<style>
:root{--b900:#0B2D47;--b700:#1A4F73;--b500:#2374A3;--b300:#5EA4CE;
      --b100:#C7E2F2;--b050:#EBF5FB;--bg:#F2F7FB;--text:#0F2233;
      --muted:#5B7A91;--rule:#D6E8F2;--r:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;}
a{color:inherit;text-decoration:none;}

.hero{background:linear-gradient(155deg,var(--b900) 0%,var(--b700) 100%);
      color:#fff;padding:28px 32px 24px;border-bottom:3px solid var(--b500);
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.hero h1{font-size:21px;font-weight:800;}
.hero p{font-size:13px;opacity:.82;max-width:780px;margin-top:4px;}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;}

.container{width:100%;padding:26px 32px;}
.bc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;}
.bc a{color:var(--b500);} .bc a:hover{color:var(--b700);} .bc .sep{color:var(--b100);}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px;}
.stat{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--b500);
  border-radius:9px;padding:14px 17px;box-shadow:0 1px 4px rgba(11,45,71,.06);}
.stat .num{font-size:26px;font-weight:800;color:var(--b900);line-height:1;}
.stat .lab{font-size:12px;color:var(--muted);margin-top:5px;}

.card{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(11,45,71,.07);margin-bottom:20px;}
.card h3{font-size:15px;font-weight:800;color:var(--b900);padding:14px 18px;
  border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card .pad{padding:18px;}

.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;}
.ctrl select{padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r);
  font-size:13px;font-family:inherit;background:#fff;color:var(--text);}

.btn{background:var(--b500);color:#fff;border:none;border-radius:var(--r);padding:7px 15px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--b700);}
.btn.ghost{background:#fff;color:var(--b700);border:1px solid var(--rule);}

.tbl-wrap{overflow:auto;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;
  padding:10px 14px;background:var(--b050);border-bottom:1px solid var(--rule);white-space:nowrap;}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--rule);font-size:12.5px;vertical-align:middle;white-space:nowrap;}
.tbl tr:last-child td{border-bottom:none;}
.tbl .ct{font-weight:700;color:var(--b900);}
.tbl .cd{font-size:11px;color:var(--muted);}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.st-done{background:var(--b100);color:var(--b900);border:1px solid var(--b300);}
.st-ing{background:var(--b050);color:var(--b700);border:1px solid var(--b100);}
.st-not{background:#fff;color:var(--muted);border:1px solid var(--rule);}

/* 可视化摘要：每门课完成率条 */
.bars{padding:16px 18px;}
.bar-row{display:grid;grid-template-columns:minmax(140px,1.6fr) 1fr auto;gap:12px;align-items:center;margin-bottom:11px;}
.bar-lab{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{background:var(--b050);border:1px solid var(--rule);border-radius:20px;height:16px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--b700),var(--b500));border-radius:20px;}
.bar-val{font-size:12px;font-weight:700;color:var(--b900);min-width:74px;text-align:right;}

.empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:13px;}
.warn-bar{background:var(--b050);border:1px solid var(--b100);border-left:4px solid var(--b500);
  border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:12.5px;color:var(--b700);}
.loading{padding:30px 18px;text-align:center;color:var(--muted);}
@media(max-width:640px){.container{padding:20px 14px;}}
</style>
</head>
<body>
<div id="site-nav"></div>
<script src="../nav.js"></script>

<div class="hero">
  <div>
    <h1>学习报告</h1>
    <p>按班级或全量学员汇总课程完成情况：完成矩阵、单课完成率与平均分，可导出 CSV 或打印留档。进度源为 GitHub 上 <code>data/training/{课程}/{学员}.json</code>。</p>
  </div>
  <div class="hero-actions">
    <button class="btn ghost" id="btnPrint">🖨 打印 / 存 PDF</button>
    <button class="btn" id="btnCsv">⬇ 导出 CSV</button>
  </div>
</div>

<div class="container">
  <div class="bc"><a href="/fsl-report/">工作台首页</a><span class="sep">/</span><a href="index.html">培训</a><span class="sep">/</span><span>学习报告</span></div>

  <div id="warnSlot"></div>

  <div class="card">
    <div class="pad ctrl">
      <label for="selScope">统计范围</label>
      <select id="selScope"></select>
      <span class="cd" id="scopeHint" style="color:var(--muted);font-size:12px;"></span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="stLearners">—</div><div class="lab">学员</div></div>
    <div class="stat"><div class="num" id="stCourses">—</div><div class="lab">课程</div></div>
    <div class="stat"><div class="num" id="stDone">—</div><div class="lab">完成人次</div></div>
    <div class="stat"><div class="num" id="stRate">—</div><div class="lab">完成率</div></div>
    <div class="stat"><div class="num" id="stAvg">—</div><div class="lab">平均得分</div></div>
  </div>

  <div class="card">
    <h3>完成矩阵（学员 × 课程）</h3>
    <div class="tbl-wrap" id="matrixSlot"><div class="loading">读取中…</div></div>
  </div>

  <div class="card">
    <h3>单课完成率（可视化摘要）</h3>
    <div class="bars" id="chartSlot"><div class="loading">读取中…</div></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var REPO='EstaTea/fsl-report';
  var P_ROSTER='data/training/roster.json';
  var P_CLASSES='data/training/classes.json';

  var S={ catalog:[], roster:{learners:[]}, classes:{classes:[]}, token:'',
          matrix:[], coursesInScope:[], scopeLabel:'' };

  function token(){ var s=window.FSL_SESSION||{};
    return s.gh_token||s.token||(localStorage.getItem('gh_token_fsl')||''); }

  function ghGet(path){
    if(!S.token) return Promise.resolve(null);
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
      headers:{'Authorization':'Bearer '+S.token,'Accept':'application/vnd.github+json'}
    }).then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        if(!j||!j.content) return null;
        try{ return JSON.parse(atob(j.content.replace(/\s/g,''))); }catch(e){ return null; }
      }).catch(function(){ return null; });
  }
  function localFallback(path){
    return fetch('../'+path).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function courseTitle(id){ var c=S.catalog.filter(function(x){return x.id===id;})[0]; return c?c.title:id; }
  function statusText(s){ return ({'not attempted':'未开始','browsed':'已浏览','incomplete':'进行中',
    'completed':'已完成','passed':'已通过','failed':'未通过'})[s]||'未开始'; }
  function statusCls(s){ if(s==='completed'||s==='passed')return'st-done';
    if(s==='incomplete'||s==='browsed'||s==='failed')return'st-ing'; return'st-not'; }
  function isDone(s){ return s==='completed'||s==='passed'; }

  function loadProgress(courseId,login){
    if(!S.token) return Promise.resolve(null);
    var url='https://api.github.com/repos/'+REPO+'/contents/data/training/'+
      encodeURIComponent(courseId)+'/'+encodeURIComponent(login)+'.json';
    return fetch(url,{headers:{'Authorization':'Bearer '+S.token,'Accept':'application/vnd.github+json'}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ if(j&&j.content){ try{return JSON.parse(atob(j.content.replace(/\s/g,'')));}catch(e){return null;} } return null; })
      .catch(function(){ return null; });
  }

  function assignedCourses(learner){
    var out={};
    (learner.classes||[]).forEach(function(cid){
      var c=(S.classes.classes||[]).filter(function(x){return x.id===cid;})[0];
      (c&&c.courses||[]).forEach(function(k){ out[k]=1; });
    });
    (learner.courses||[]).forEach(function(k){ out[k]=1; });
    return Object.keys(out);
  }

  function scopeLearners(){
    var v=document.getElementById('selScope').value;
    var L=S.roster.learners||[];
    if(v==='__all__'){ S.scopeLabel='全部学员'; return L.filter(function(l){return l.active!==false;}); }
    var c=(S.classes.classes||[]).filter(function(x){return x.id===v;})[0];
    S.scopeLabel=c?c.name:v;
    return L.filter(function(l){ return (l.classes||[]).indexOf(v)>=0; });
  }

  function build(){
    var learners=scopeLearners();
    // 课程列 = 范围内学员被指派课程的并集（仅保留目录中存在的）
    var set={};
    learners.forEach(function(l){ assignedCourses(l).forEach(function(k){
      if(S.catalog.some(function(c){return c.id===k;})) set[k]=1; }); });
    S.coursesInScope=S.catalog.filter(function(c){ return set[c.id]; }).map(function(c){return c.id;});

    var jobs=[];
    learners.forEach(function(l){ S.coursesInScope.forEach(function(k){
      jobs.push(loadProgress(k,l.id).then(function(p){ return {l:l,k:k,p:p}; })); }); });

    document.getElementById('matrixSlot').innerHTML='<div class="loading">读取 '+jobs.length+' 条进度记录中…</div>';

    Promise.all(jobs).then(function(rows){
      var map={};
      rows.forEach(function(r){ map[r.l.id+'||'+r.k]=r.p; });
      S.matrix=learners.map(function(l){
        var cells=S.coursesInScope.map(function(k){
          var p=map[l.id+'||'+k]||null;
          var st=(p&&p.cmi)?(p.cmi['cmi.core.lesson_status']||'not attempted'):'not attempted';
          var sc=(p&&p.cmi)?(p.cmi['cmi.core.score.raw']||''):'';
          return {k:k,st:st,sc:sc,up:(p&&p.updated_at)||null};
        });
        return { l:l, cells:cells };
      });
      render();
    });
  }

  function render(){
    var rows=S.matrix, cols=S.coursesInScope;
    // 矩阵
    if(!rows.length||!cols.length){
      document.getElementById('matrixSlot').innerHTML=
        '<div class="empty">该范围内暂无学员或尚未指派课程。请先在「管理台」创建班级并指派课程。</div>';
    }else{
      var h='<table class="tbl"><thead><tr><th>学员</th><th>班级</th>'+
        cols.map(function(k){ return '<th>'+esc(courseTitle(k))+'</th>'; }).join('')+
        '<th>完成</th></tr></thead><tbody>';
      rows.forEach(function(r){
        var done=r.cells.filter(function(c){ return isDone(c.st); }).length;
        h+='<tr><td><div class="ct">'+esc(r.l.name)+'</div><div class="cd">'+esc(r.l.id)+'</div></td>'+
          '<td>'+(((r.l.classes||[]).map(function(id){
            var c=(S.classes.classes||[]).filter(function(x){return x.id===id;})[0]; return c?c.name:id; }).join('、'))||'—')+'</td>'+
          r.cells.map(function(c){
            return '<td><span class="pill '+statusCls(c.st)+'">'+statusText(c.st)+'</span>'+
              (c.sc!==''?' <span class="cd">'+esc(c.sc)+'</span>':'')+'</td>';
          }).join('')+
          '<td><b>'+done+'/'+cols.length+'</b></td></tr>';
      });
      h+='</tbody></table>';
      document.getElementById('matrixSlot').innerHTML=h;
    }

    // 统计
    var pairs=0,done=0,sum=0,scored=0;
    rows.forEach(function(r){ r.cells.forEach(function(c){
      pairs++; if(isDone(c.st)){ done++; if(c.sc!==''){ sum+=parseFloat(c.sc)||0; scored++; } } }); });
    document.getElementById('stLearners').textContent=rows.length;
    document.getElementById('stCourses').textContent=cols.length;
    document.getElementById('stDone').textContent=done;
    document.getElementById('stRate').textContent=pairs?Math.round(done/pairs*100)+'%':'—';
    document.getElementById('stAvg').textContent=scored?Math.round(sum/scored):'—';

    // 可视化：每门课完成率
    if(!cols.length){ document.getElementById('chartSlot').innerHTML='<div class="empty">暂无数据。</div>'; }
    else{
      var bh='';
      cols.forEach(function(k){
        var tot=0,dn=0,sm=0,sc=0;
        rows.forEach(function(r){ r.cells.forEach(function(c){
          if(c.k!==k) return; tot++; if(isDone(c.st)){ dn++; if(c.sc!==''){ sm+=parseFloat(c.sc)||0; sc++; } } }); });
        var pct=tot?Math.round(dn/tot*100):0;
        var avg=sc?Math.round(sm/sc):null;
        bh+='<div class="bar-row">'+
          '<div class="bar-lab" title="'+esc(courseTitle(k))+'">'+esc(courseTitle(k))+'</div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
          '<div class="bar-val">'+dn+'/'+tot+' · '+pct+'%'+(avg!==null?' · 均 '+avg:'')+'</div></div>';
      });
      document.getElementById('chartSlot').innerHTML=bh;
    }
    document.getElementById('scopeHint').textContent='当前范围：'+S.scopeLabel+'（'+rows.length+' 人）';
  }

  // CSV 导出
  function toCsv(){
    var cols=S.coursesInScope;
    var head=['学员','登录标识','班级'].concat(cols.map(courseTitle)).concat(['完成数','完成率']);
    var lines=[head];
    S.matrix.forEach(function(r){
      var cls=(r.l.classes||[]).map(function(id){
        var c=(S.classes.classes||[]).filter(function(x){return x.id===id;})[0]; return c?c.name:id; }).join('、');
      var doneN=r.cells.filter(function(c){return isDone(c.st);}).length;
      var row=[r.l.name,r.l.id,cls];
      cols.forEach(function(k){
        var c=r.cells.filter(function(x){return x.k===k;})[0]||{st:'not attempted',sc:''};
        row.push(statusText(c.st)+(c.sc!==''?'('+c.sc+')':''));
      });
      row.push(doneN, cols.length?Math.round(doneN/cols.length*100)+'%':'0%');
      lines.push(row);
    });
    return '\ufeff'+lines.map(function(r){
      return r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(',');
    }).join('\r\n');
  }

  document.getElementById('btnCsv').onclick=function(){
    if(!S.matrix.length){ alert('暂无数据可导出'); return; }
    var blob=new Blob([toCsv()],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='学习报告_'+S.scopeLabel.replace(/[\\/:*?"<>|]/g,'')+'_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
  };
  document.getElementById('btnPrint').onclick=function(){ window.print(); };
  document.getElementById('selScope').onchange=build;

  function init(){
    S.token=token();
    fetch('courses.json').then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ S.catalog=(j&&j.courses)||[]; })
      .catch(function(){ S.catalog=[]; })
      .then(function(){ return ghGet(P_ROSTER); })
      .then(function(d){ if(d) S.roster=d; else return localFallback(P_ROSTER).then(function(x){ if(x)S.roster=x; }); })
      .then(function(){ return ghGet(P_CLASSES); })
      .then(function(d){ if(d) S.classes=d; else return localFallback(P_CLASSES).then(function(x){ if(x)S.classes=x; }); })
      .then(function(){
        if(!S.roster.learners) S.roster.learners=[];
        if(!S.classes.classes) S.classes.classes=[];
        var sel=document.getElementById('selScope');
        sel.innerHTML='<option value="__all__">全部学员</option>'+
          (S.classes.classes||[]).map(function(c){
            return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('');
        if(!S.token){
          document.getElementById('warnSlot').innerHTML=
            '<div class="warn-bar">未检测到登录令牌：无法读取各学员的云端进度，矩阵将全部显示「未开始」。请在佛照工作台登录后访问本页。</div>';
        }
        build();
      });
  }
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
